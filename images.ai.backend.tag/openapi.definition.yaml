openapi: 3.0.0
info:
  title: hcloud - AI
  description: AI backend
  version: 1.0.0
  contact:
    name: MoovIT Software Products GmbH
    url: https://www.moovit-sp.com
    email: info@moovit-sp.com
servers:
  - url: https://eu-central-1.helmut.cloud/api/ai
    description: EU-Central production server
  - url: https://na-west-1.helmut.cloud/api/ai
    description: NA-West production server
  - url: https://eu-dev-1.app.helmut.cloud/api/ai
    description: EU development server
  - url: http://localhost/api/ai
    description: Localhost
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    patAuth:
      type: http
      scheme: bearer
      bearerFormat: PAT
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CustomError:
      type: object
      properties:
        error:
          type: string
          description: Error name
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
      required:
        - error
        - code
        - message
      description: API errors obey this shape
    AIHigh5StreamRequestDto:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 10000
          description: User prompt for the AI agent
          example: Add a HTTP request node before the mapper
        type:
          type: string
          enum:
            - design
            - documentation
          description: What the agent should do with the stream
          example: design
        payload:
          type: object
          properties:
            nodes:
              type: array
              items:
                nullable: true
            links:
              type: array
              items:
                nullable: true
            canvas:
              nullable: true
          required:
            - nodes
            - links
          description: Current stream design content (context for the agent)
      required:
        - message
        - type
        - payload
    ReducedOrganization:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
          description: Unique identifier of the organization
          example: 4d572a052ed0690e5d580da0
        name:
          type: string
          description: Name of the organization
          example: Acme-Corporation
        avatarUrl:
          type: string
          format: uri
          description: URL to the avatar image of the organization
          example: https://example.com/org-avatar.webp
      required:
        - _id
        - name
        - avatarUrl
      description: >-
        Simplified representation of an organization object used for referencing
        or displaying minimal organization details
      example:
        _id: 82f7e64ff912d31ffa27a5b7
        name: Moovit Software Products
        avatarUrl: https://example.com/asset/some_avatar.webp
    ReducedSpace:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
          description: Unique identifier of the space
          example: 75562d052ed0590e5d580da0
        name:
          type: string
          description: Name of the space
          example: Design-Team-Workspace
        avatarUrl:
          type: string
          format: uri
          description: URL to the avatar image of the Space
          example: https://example.com/space-avatar.webp
      required:
        - _id
        - name
        - avatarUrl
      description: >-
        Simplified representation of a space object used for referencing or
        displaying minimal space details
      example:
        _id: 9687e64ff912d31ffa27a1bd
        name: MySpace
        avatarUrl: https://example.com/asset/some_avatar.webp
    ReducedUser:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
          description: Unique identifier of the user
          example: 65562d052ed0590e5d580ca0
        name:
          type: string
          description: Full name of the user
          example: John Doe
        email:
          type: string
          format: email
          description: Email address of the user
          example: john.doe@example.com
        avatarUrl:
          type: string
          format: uri
          description: URL to the user's avatar image
          example: https://example.com/avatar.webp
        isGuest:
          type: boolean
          description: Indicates if the user is a guest
          example: false
        isAgent:
          type: boolean
          description: Indicates if the user is an agent
          example: true
      required:
        - _id
        - name
        - email
        - avatarUrl
      description: >-
        Simplified representation of a user object used for referencing or
        displaying minimal user details
      example:
        _id: 3817e64ff912d31ffa27a571
        name: Helmut Mc Cloud
        email: mcloud@helmut.cloud
        avatarUrl: https://example.com/asset/some_avatar.webp
        isGuest: false
        isAgent: false
    AIHigh5StreamResponse:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
          description: ID of the message
          example: 527d1df208337bc792b55f73
        message:
          type: string
          description: Message text
          example: Added the requested node.
        type:
          type: string
          enum:
            - design
            - documentation
          description: Payload type of the conversation
        source:
          type: string
          enum:
            - user
            - ai
          description: Who authored the message
        organization:
          $ref: '#/components/schemas/ReducedOrganization'
        space:
          $ref: '#/components/schemas/ReducedSpace'
        createdBy:
          $ref: '#/components/schemas/ReducedUser'
        createDate:
          type: integer
          description: Creation timestamp in unix format
          example: 1749040000000
      required:
        - _id
        - message
        - type
        - source
        - organization
        - space
        - createdBy
        - createDate
  parameters: {}
paths:
  /v1/high5/org/{orgName}/spaces/{spaceName}/streams/{streamId}:
    post:
      security:
        - bearerAuth:
            - high5:space:write
        - basicAuth:
            - high5:space:write
        - patAuth:
            - high5:space:write
      summary: >-
        Send a message to a High5 stream and receive the AI response as
        Server-Sent Events
      tags:
        - AI
      parameters:
        - schema:
            anyOf:
              - type: string
                minLength: 3
                maxLength: 64
                pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
                description: >-
                  Name of the organization (only alphanumeric characters,
                  hyphens and dots are allowed; it should contain between 3 and
                  64 characters)
                example: MoovIT-Software-Products-GmbH
              - type: string
                minLength: 3
                maxLength: 255
                pattern: ^[\p{L}\p{M}0-9_+@.-]{3,255}$
                description: >-
                  Name of the user's private organization, allowed everything
                  defined in the RFC for the email specification (it should
                  contain between 3 and 255 characters)
                example: hmc@helmut.cloud
          required: true
          name: orgName
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 32
            pattern: ^[\w-.]{1,32}$
            description: >-
              Name of the space (only alphanumeric characters, hyphens and dots
              are allowed; it should contain between 1 and 32 characters)
            example: Helmut4
          required: true
          name: spaceName
          in: path
        - schema:
            type: string
            minLength: 24
            maxLength: 24
            format: hexadecimal
          required: true
          name: streamId
          in: path
        - schema:
            type: string
          required: true
          name: authorization
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIHigh5StreamRequestDto'
      responses:
        '200':
          description: SSE stream of AIHigh5StreamEvent objects (start, chunk, done, error)
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: >-
            Failed to validate 'path' parameter 'orgName' | Failed to validate
            'path' parameter 'spaceName' | Failed to validate 'path' parameter
            'streamId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Failed to validate 'path' parameter 'orgName':
                  summary: Failed to validate 'path' parameter 'orgName'
                  description: Failed to validate 'path' parameter 'orgName' - {error}
                  value:
                    code: 011.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'path' parameter 'orgName' - {error}
                Failed to validate 'path' parameter 'spaceName':
                  summary: Failed to validate 'path' parameter 'spaceName'
                  description: Failed to validate 'path' parameter 'spaceName' - {error}
                  value:
                    code: 011.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'path' parameter 'spaceName' - {error}
                Failed to validate 'path' parameter 'streamId':
                  summary: Failed to validate 'path' parameter 'streamId'
                  description: Failed to validate 'path' parameter 'streamId' - {error}
                  value:
                    code: 011.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'path' parameter 'streamId' - {error}
        '401':
          description: >-
            You're not authorized | Expected an authentication token that has
            not been provided | Your authentication token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                You're not authorized:
                  summary: You're not authorized
                  value:
                    code: 011.001.0001
                    error: unauthorized
                    message: You're not authorized
                Expected an authentication token that has not been provided:
                  summary: Expected an authentication token that has not been provided
                  value:
                    code: 011.001.0002
                    error: missing.auth.token
                    message: >-
                      Expected an authentication token that has not been
                      provided
                Your authentication token is invalid:
                  summary: Your authentication token is invalid
                  value:
                    code: 011.001.0003
                    error: wrong.auth.token
                    message: Your authentication token is invalid
        '403':
          description: >-
            Required scopes ['high5:space:write'] not included in authorization
            | User's organization role is insufficient. Must be at least MEMBER
            | You do not have the required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Required scopes ['high5:space:write'] not included in authorization:
                  summary: >-
                    Required scopes ['high5:space:write'] not included in
                    authorization
                  value:
                    code: 011.001.0004
                    error: insufficient.rights
                    message: >-
                      You have not enough rights to access/manipulate this
                      resource
                User's organization role is insufficient. Must be at least MEMBER:
                  summary: >-
                    User's organization role is insufficient. Must be at least
                    MEMBER
                  value:
                    code: 011.001.0004
                    error: insufficient.rights
                    message: >-
                      You have not enough rights to access/manipulate this
                      resource
                You do not have the required permission:
                  summary: You do not have the required permission
                  value:
                    code: 011.010.0003
                    error: space.insufficient.permission
                    message: You do not have the required permission
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  summary: Organization not found
                  value:
                    code: 011.007.0001
                    error: organization.not.found
                    message: Organization not found
        '500':
          description: something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                something went wrong:
                  summary: something went wrong
                  value:
                    code: 011.000.0002
                    error: internal.server.error
                    message: something went wrong
    get:
      security:
        - bearerAuth:
            - high5:space:read
        - basicAuth:
            - high5:space:read
        - patAuth:
            - high5:space:read
      summary: Get the message history of a High5 stream
      tags:
        - AI
      parameters:
        - schema:
            anyOf:
              - type: string
                minLength: 3
                maxLength: 64
                pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
                description: >-
                  Name of the organization (only alphanumeric characters,
                  hyphens and dots are allowed; it should contain between 3 and
                  64 characters)
                example: MoovIT-Software-Products-GmbH
              - type: string
                minLength: 3
                maxLength: 255
                pattern: ^[\p{L}\p{M}0-9_+@.-]{3,255}$
                description: >-
                  Name of the user's private organization, allowed everything
                  defined in the RFC for the email specification (it should
                  contain between 3 and 255 characters)
                example: hmc@helmut.cloud
          required: true
          name: orgName
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 32
            pattern: ^[\w-.]{1,32}$
            description: >-
              Name of the space (only alphanumeric characters, hyphens and dots
              are allowed; it should contain between 1 and 32 characters)
            example: Helmut4
          required: true
          name: spaceName
          in: path
        - schema:
            type: string
            minLength: 24
            maxLength: 24
            format: hexadecimal
          required: true
          name: streamId
          in: path
        - schema:
            type: number
            minimum: 1
            maximum: 100
            default: 25
            description: Page size
          required: false
          name: limit
          in: query
        - schema:
            type: number
            nullable: true
            minimum: 0
            default: 0
            description: Page index
          required: false
          name: page
          in: query
        - schema:
            type: string
          required: true
          name: authorization
          in: header
      responses:
        '200':
          description: Message history of the stream
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIHigh5StreamResponse'
        '400':
          description: >-
            Failed to validate 'path' parameter 'orgName' | Failed to validate
            'path' parameter 'spaceName' | Failed to validate 'path' parameter
            'streamId' | Failed to validate 'query' parameter 'limit' | Failed
            to validate 'query' parameter 'page'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Failed to validate 'path' parameter 'orgName':
                  summary: Failed to validate 'path' parameter 'orgName'
                  description: Failed to validate 'path' parameter 'orgName' - {error}
                  value:
                    code: 011.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'path' parameter 'orgName' - {error}
                Failed to validate 'path' parameter 'spaceName':
                  summary: Failed to validate 'path' parameter 'spaceName'
                  description: Failed to validate 'path' parameter 'spaceName' - {error}
                  value:
                    code: 011.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'path' parameter 'spaceName' - {error}
                Failed to validate 'path' parameter 'streamId':
                  summary: Failed to validate 'path' parameter 'streamId'
                  description: Failed to validate 'path' parameter 'streamId' - {error}
                  value:
                    code: 011.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'path' parameter 'streamId' - {error}
                Failed to validate 'query' parameter 'limit':
                  summary: Failed to validate 'query' parameter 'limit'
                  description: Failed to validate 'query' parameter 'limit' - {error}
                  value:
                    code: 011.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'query' parameter 'limit' - {error}
                Failed to validate 'query' parameter 'page':
                  summary: Failed to validate 'query' parameter 'page'
                  description: Failed to validate 'query' parameter 'page' - {error}
                  value:
                    code: 011.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'query' parameter 'page' - {error}
        '401':
          description: >-
            You're not authorized | Expected an authentication token that has
            not been provided | Your authentication token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                You're not authorized:
                  summary: You're not authorized
                  value:
                    code: 011.001.0001
                    error: unauthorized
                    message: You're not authorized
                Expected an authentication token that has not been provided:
                  summary: Expected an authentication token that has not been provided
                  value:
                    code: 011.001.0002
                    error: missing.auth.token
                    message: >-
                      Expected an authentication token that has not been
                      provided
                Your authentication token is invalid:
                  summary: Your authentication token is invalid
                  value:
                    code: 011.001.0003
                    error: wrong.auth.token
                    message: Your authentication token is invalid
        '403':
          description: >-
            Required scopes ['high5:space:read'] not included in authorization |
            User's organization role is insufficient. Must be at least MEMBER |
            You do not have the required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Required scopes ['high5:space:read'] not included in authorization:
                  summary: >-
                    Required scopes ['high5:space:read'] not included in
                    authorization
                  value:
                    code: 011.001.0004
                    error: insufficient.rights
                    message: >-
                      You have not enough rights to access/manipulate this
                      resource
                User's organization role is insufficient. Must be at least MEMBER:
                  summary: >-
                    User's organization role is insufficient. Must be at least
                    MEMBER
                  value:
                    code: 011.001.0004
                    error: insufficient.rights
                    message: >-
                      You have not enough rights to access/manipulate this
                      resource
                You do not have the required permission:
                  summary: You do not have the required permission
                  value:
                    code: 011.010.0003
                    error: space.insufficient.permission
                    message: You do not have the required permission
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  summary: Organization not found
                  value:
                    code: 011.007.0001
                    error: organization.not.found
                    message: Organization not found
        '500':
          description: something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                something went wrong:
                  summary: something went wrong
                  value:
                    code: 011.000.0002
                    error: internal.server.error
                    message: something went wrong
