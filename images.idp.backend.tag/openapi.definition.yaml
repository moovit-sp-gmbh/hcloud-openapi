    PasskeyRegistrationOptionsDto:
      type: object
      properties:
        rp:
          type: object
          properties:
            id:
              type: string
              description: >-
                Domain identifying the relying party requesting this passkey
                registration
              example: helmut.cloud
            name:
              type: string
              description: Human-readable name of the relying party shown to the user
              example: helmut.cloud
          required:
            - id
            - name
          description: Relying party this passkey is being registered for
          example:
            id: helmut.cloud
            name: helmut.cloud
        user:
          type: object
          properties:
            id:
              type: string
              description: >-
                Opaque, base64url-encoded identifier for the user this passkey
                belongs to
              example: NzkxNGI4OTYxYWI2YjgwZTRlNDYwNjcz
            name:
              type: string
              description: Username shown to help the user pick the right passkey
              example: hmc@helmut.cloud
            displayName:
              type: string
              description: Full display name shown alongside the passkey
              example: Helmut Mc Cloud
          required:
            - id
            - name
            - displayName
          description: User this passkey is being registered for
          example:
            id: NzkxNGI4OTYxYWI2YjgwZTRlNDYwNjcz
            name: hmc@helmut.cloud
            displayName: Helmut Mc Cloud
        challenge:
          type: string
          description: >-
            Random value the authenticator must sign to prove possession of the
            newly created private key
          example: qMLSNNXoZen8QznSAkNyZ4tLricXiXYLlY6MLZFBxOk
        pubKeyCredParams:
          type: array
          items:
            type: object
            properties:
              alg:
                type: number
                description: >-
                  COSE algorithm identifier accepted for the credential's public
                  key
                example: -7
              type:
                type: string
                enum:
                  - public-key
                description: WebAuthn credential type, always 'public-key'
                example: public-key
            required:
              - alg
              - type
          description: >-
            Public key algorithms accepted for the new credential, in order of
            preference
          example:
            - alg: -7
              type: public-key
            - alg: -257
              type: public-key
        timeout:
          type: number
          description: >-
            Maximum time in milliseconds the user has to complete the
            registration
          example: 60000
        excludeCredentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Base64url-encoded credential ID
                example: Ig53kF0inOyoeDTTFb7gkE01xIKKP4YEe6lkq7px1UM
              transports:
                type: array
                items:
                  $ref: '#/components/schemas/AuthenticatorTransport'
                description: Transports supported by this credential's authenticator
                example:
                  - internal
            required:
              - id
          description: >-
            Credentials already registered for this user, so the authenticator
            can avoid creating a duplicate passkey for one of them
          example:
            - id: Ig53kF0inOyoeDTTFb7gkE01xIKKP4YEe6lkq7px1UM
              transports:
                - internal
        authenticatorSelection:
          type: object
          properties:
            authenticatorAttachment:
              allOf:
                - $ref: '#/components/schemas/AuthenticatorAttachment'
                - description: >-
                    Preferred connection type for the authenticator, if the
                    relying party wants to restrict it
            residentKey:
              type: string
              description: >-
                Whether the credential must be discoverable without the relying
                party specifying it beforehand
              example: required
            requireResidentKey:
              type: boolean
              description: >-
                Legacy equivalent of requiring a discoverable credential, kept
                for older clients
              example: true
            userVerification:
              type: string
              description: >-
                Whether the authenticator must verify the user's identity, for
                example via biometrics or a PIN
              example: required
          description: >-
            Constraints the relying party places on which authenticators may be
            used and how they must behave
          example:
            residentKey: required
            requireResidentKey: true
            userVerification: required
        attestation:
          type: string
          description: >-
            Level of attestation statement requested from the authenticator
            about its provenance
          example: none
        extensions:
          type: object
          additionalProperties:
            nullable: true
          description: Additional authenticator extension inputs, rarely used
          example: {}
      required:
        - rp
        - user
        - challenge
        - pubKeyCredParams
      description: Options the client uses to create a new passkey with an authenticator
    DeviceType:
      type: string
      enum:
        - SINGLE_DEVICE
        - MULTI_DEVICE
      description: Whether the credential can be synced across multiple devices
      example: SINGLE_DEVICE
    PasskeyDto:
      type: object
      properties:
        credentialId:
          type: string
          description: Base64url-encoded credential ID
          example: Ig53kF0inOyoeDTTFb7gkE01xIKKP4YEe6lkq7px1UM
        name:
          type: string
          description: User-friendly label for this passkey
          example: MacBook Touch ID
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        createDate:
          type: number
          description: Creation date of the passkey
          example: 1782296100000
        lastUsedDate:
          type: number
          description: Date the passkey was last used to log in
          example: 1784885400000
      required:
        - credentialId
        - name
        - createDate
      description: >-
        Public representation of a registered passkey (never includes the public
        key or signature counter)
      example:
        credentialId: Ig53kF0inOyoeDTTFb7gkE01xIKKP4YEe6lkq7px1UM
        name: MacBook Touch ID
        deviceType: SINGLE_DEVICE
        createDate: 1782296100000
        lastUsedDate: 1784885400000
    PasskeyAuthenticationOptionsDto:
      type: object
      properties:
        challenge:
          type: string
          description: >-
            Random value the authenticator must sign to prove possession of the
            private key
          example: JYLCesz2cQHJXegfDJsF0tGFQUUPwzZiKO7OiLbq9no
        timeout:
          type: number
          description: >-
            Maximum time in milliseconds the user has to complete the
            authentication
          example: 60000
        rpId:
          type: string
          description: Domain identifying the relying party this passkey was registered for
          example: helmut.cloud
        allowCredentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Base64url-encoded credential ID
                example: Ig53kF0inOyoeDTTFb7gkE01xIKKP4YEe6lkq7px1UM
              transports:
                type: array
                items:
                  $ref: '#/components/schemas/AuthenticatorTransport'
                description: Transports supported by this credential's authenticator
                example:
                  - internal
            required:
              - id
          description: >-
            Credentials allowed to complete this authentication; left empty here
            so that any registered passkey can be offered without knowing the
            user's identity beforehand
          example:
            - id: Ig53kF0inOyoeDTTFb7gkE01xIKKP4YEe6lkq7px1UM
              transports:
                - internal
        userVerification:
          type: string
          description: >-
            Whether the authenticator must verify the user's identity, for
            example via biometrics or a PIN
          example: required
        extensions:
          type: object
          additionalProperties:
            nullable: true
          description: Additional authenticator extension inputs, rarely used
          example: {}
      required:
        - challenge
      description: >-
        Options the client uses to authenticate with an existing passkey; the
        allowed credential list is intentionally omitted so any matching passkey
        can be offered without prior identification of the user
    FullSAMLProviderDto:
