      description: |-

        Required scopes: IDP_ORGANIZATION_READ
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitParameter'
        - $ref: '#/components/parameters/PageParameter'
        - name: teamsOfUser
          in: query
          description: >-
            If true, an additional property holding all teams that the
            requesting user is part of and that belong to the organization will
            be returned.
          required: false
          schema:
            type: boolean
        - name: totalMemberCount
          in: query
          description: >-
            If true, an additional property holding the total member count of
            the organization will be returned.
          required: false
          schema:
            type: boolean
        - name: membersSample
          in: query
          description: >-
            If set, an additional property holding a sample of members will be
            returned. The provided number represents the max size of the sample.
          required: false
          schema:
            type: number
