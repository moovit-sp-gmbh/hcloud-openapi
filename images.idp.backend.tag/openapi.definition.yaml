  parameters:
    DomainName:
      in: path
      name: domainName
      schema:
        type: string
        minLength: 4
        maxLength: 254
        example: helmut.cloud
      required: true
      description: >-
        Fully qualified domain name - FQDN (it should contain between 4 and 254
        characters)
    InvitationID:
      in: path
      name: invitationId
      schema:
        type: string
        minLength: 24
        maxLength: 24
        pattern: /^[a-fA-F0-9]{24}$/i
        example: 961b7de208337dc792b65f57
      required: true
      description: >-
        ID of the invitation (ObjectId identifier, consists of 24 hexadecimal
        digits)
    MessageID:
      in: path
      name: messageId
      schema:
        type: string
        minLength: 24
        maxLength: 24
        pattern: /^[a-fA-F0-9]{24}$/i
        example: 573a7df208337bc792b55f71
      required: true
      description: >-
        ID of the message (ObjectId identifier, consists of 24 hexadecimal
        digits)
    OAuthAppID:
      in: path
      name: oAuthAppId
      schema:
        type: string
        minLength: 24
        maxLength: 24
        pattern: /^[a-fA-F0-9]{24}$/i
        example: 291b7de208337dc792b65f76
      required: true
      description: >-
        ID of the OAuth application (ObjectId identifier, consists of 24
        hexadecimal digits)
    OrgName:
      in: path
      name: orgName
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: /^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$/i
        example: MoovIT-Software-Products-GmbH
      required: true
      description: >-
        Name of the organization (only alphanumeric characters, hyphens and dots
        are allowed; it should contain between 3 and 64 characters)
    PatID:
      in: path
      name: patId
      schema:
        type: string
        minLength: 24
        maxLength: 24
        pattern: /^[a-fA-F0-9]{24}$/i
        example: 381b5de208337dc792b65f67
      required: true
      description: >-
        ID of the personal Access Token (PAT, ObjectId identifier, consists of
        24 hexadecimal digits)
    TeamName:
      in: path
      name: teamName
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: /^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$/i
        example: Research-and-development-department.1
      required: true
      description: >-
        Name of the team (only alphanumeric characters, hyphens and dots are
        allowed; it should contain between 3 and 64 characters)
    UserID:
      in: path
      name: userId
      schema:
        type: string
        minLength: 24
        maxLength: 24
        pattern: /^[a-fA-F0-9]{24}$/i
        example: 671b7de208337dc792b65f93
      required: true
      description: ID of the user (ObjectId identifier, consists of 24 hexadecimal digits)
    LimitParameter:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      required: false
      description: Max number of items to return. Integer between 1 and 100.
    PageParameter:
      in: query
      name: page
      schema:
        type: integer
        minimum: 0
        default: 0
      required: false
      description: Designates the current page, when using a limit. Minimum value is 0.
