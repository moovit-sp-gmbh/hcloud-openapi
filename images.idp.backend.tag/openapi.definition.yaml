            - _id: 73d25431614a64c2974c7152
              name: John Doe
              email: john.doe@helmut.cloud
              avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
              isGuest: false
        totalMemberCount:
          type: number
          description: Total number of members the organization holds
          example: 2
        teamsOfUser:
          type: array
          items:
            $ref: '#/components/schemas/ReducedTeamDto'
          description: >-
            Teams that the requesting user is part of and that belong to the
            organization
          example: []
        license:
          allOf:
            - $ref: '#/components/schemas/LicenseDto'
            - description: License of the organization
      required:
        - _id
        - name
        - creator
        - company
        - isUserOrganization
        - createDate
        - modifyDate
        - roleOfUser
        - executionTarget
        - avatarUrl
      description: >-
        Represents an organization entity including metadata, ownership, and
        user-specific context.
      example:
        _id: 62a17641614a64c2974c9481
        name: Devs
        creator:
          _id: 1784c915f173f39d71bb8b61
          name: Helmut Mc Cloud
