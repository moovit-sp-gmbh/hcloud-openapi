        name: Helmut Mc Cloud
        email: hmc@helmut.cloud
        twoFactor:
          totp: true
        company: Moovit Software Products
        activeOrganization: Video Editors
        avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        createDate: 1665569820033
        modifyDate: 1666361487534
        activeScopes:
          - idp:organization:admin
    UsersEmailDto:
      properties:
        email:
          type: string
          description: Email of the User
      required:
        - email
      example:
        email: hmc@helmut.cloud
    UsersOperation:
      enum:
        - ADD
        - REMOVE
        - SET
      type: string
      description: |
        * ADD - Add a user to the team.
        * REMOVE - Remove a user from the team.
        * SET - Replace the current members of a team with new ones.
    VerificationStatus:
      enum:
        - verified
        - waiting
        - error
      type: string
      description: |
        * verified - Domain is verified
        * waiting - Domain is waiting for verification
        * error - Domain is not verified
    Views:
      enum:
        - save_last_view
        - /account
        - /high5
        - /fuse
      type: string
      description: |
        * save_last_view - Set the last view to the last accessed view.
        * /account - Set the last view to Account.
        * /high5 - Set the last view to High5.
        * /fuse - Set the last view to Fuse.
    LicenseQuota:
      properties:
        fuse:
