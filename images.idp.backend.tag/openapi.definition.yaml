          description: Unexpected error
components:
  securitySchemes:
    BearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    AvatarDto:
      properties:
        url:
          type: string
          description: URL to the avatar
      required:
        - url
      example:
        url: https://pub-1e0d69034e2942f79ef26dae05343340.r2.dev/image.webp
    ConnectionSettingsDto:
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ReducedOrganizationWithConnect'
          description: >-
            Record of connection flags for each organization the user is part
            of.
      required:
        - connections
      example:
        connections:
          - _id: 6424021ff36f1412ecc7a2c1
            name: My-organization
            avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
            connect: true
          - _id: 6524021af36f1413bfc7a2c4
            name: My-other-organization
            avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
            connect: false
    CustomError:
      properties:
        code:
          type: string
          description: >-
            "A helmut cloud custom error code following this schema: [Custom
            Error
            Codes](https://development-guideline.pages.moovit-sp.com/en/hcloud/customErrorCodes.html)"
        error:
          type: string
          description: 'Name of the error in the following format: name.of.error'
        message:
          type: string
          description: Error description
      required:
        - code
        - error
        - message
      example: null
    DateFormat:
      enum:
        - YYYY-MM-DDTHH:mm:ss
        - YYYY-MM-DD hh:mm:ss a
        - MM/DD/YYYY hh:mm:ss a
        - Day, Month DD, YYYY at hh:mm:ss a
        - DD/MM/YYYY HH:mm:ss
        - Day DD Month YYYY at HH:mm:ss
        - DD.MM.YYYY HH:mm:ss
        - Day, DD. Month YYYY at HH:mm:ss
      type: string
      description: |
        * YYYY-MM-DDTHH:mm:ss - ISO 8601 24-hour format.
        * YYYY-MM-DD hh:mm:ss a - ISO 8601 12-hour format.
        * MM/DD/YYYY hh:mm:ss a - American 12-hour format.
        * Day, Month DD, YYYY at hh:mm:ss a - American long 12-hour format.
        * DD/MM/YYYY HH:mm:ss - European 24-hour format.
        * Day DD Month YYYY at HH:mm:ss - European long 24-hour format.
        * DD.MM.YYYY HH:mm:ss - German 24-hour format.
        * Day, DD. Month YYYY at HH:mm:ss - German long 24-hour format.
    DomainCreateDto:
      properties:
        name:
          type: string
          description: Fully qualified domain name
      required:
        - name
      example:
        name: moovit-sp.com
    DomainDto:
      properties:
        _id:
          type: string
          description: ID of the domain
        name:
          type: string
          description: Fully qualified domain name (FQDN)
        organization:
          $ref: '#/components/schemas/ReducedOrganization'
        verified:
          type: boolean
          description: Whether the domain is verified or not
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
          description: Indicates the status of the domain validation
        uuid:
          type: string
          description: UUID used in the verification process
        creator:
          $ref: '#/components/schemas/ReducedUser'
          description: The creator of the domain
        createDate:
          type: number
          description: Unix timestamp of when the domain was created.
        modifyDate:
          type: number
      required:
        - _id
        - name
        - organization
        - verified
        - verificationStatus
        - uuid
        - createDate
        - modifyDate
      example:
        _id: 6424021ff36f1412ecc7a2c1
        name: apple.test
        organization:
          _id: 6284c915f173f39d71bb8b83
          name: Helmut Mc Cloud
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        verified: true
        verificationStatus: verified
        uuid: 8de11b9b-9807-4b78-a6e4-412bda0e85c7
        creator:
          _id: 6284c915f173f39d71bb8b83
          name: Helmut Mc Cloud
          email: hmc@helmut.cloud
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
          isGuest: false
        createDate: 1680251765050
        modifyDate: 1680251765050
    Entrypoint:
      enum:
        - DEFAULT
        - HIGH5
        - FUSE
        - COSMO
        - LAST_VISITED
      type: string
      description: |
        * DEFAULT - The default entrypoint.
        * HIGH5 - Have High5 as the entrypoint.
        * FUSE - Have Fuse as the entrypoint
        * COSMO - Have Cosmo as the entrypoint
        * LAST_VISITED - Have the last visited view as the entrypoint.
    ForgotPasswordDto:
      properties:
        email:
          type: string
          description: Email of the user that forgot their password.
        captcha:
          type: string
          description: Valid google reCAPTCHAV2
        targetUrl:
          type: string
          description: >-
            URL create the redirect link in the email. It will default to
            https://app.helmut.cloud.
