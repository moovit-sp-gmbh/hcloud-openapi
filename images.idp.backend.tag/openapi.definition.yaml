openapi: 3.0.0
info:
  title: hcloud - IdP
  version: 0.0.143-2414
  contact:
    name: MoovIT Software Products GmbH
    url: https://www.moovit-sp.com
    email: info@moovit-sp.com
  description: >-
    The Identity Provider (IdP) handles everything around user entities in the
    helmut cloud. Registration, Authentication, User related preference
    management are performed within this application.
servers:
  - url: https://eu-central-1.helmut.cloud/api/account
    description: EU-Central production server
  - url: https://na-west-1.helmut.cloud/api/account
    description: NA-West production server
  - url: https://eu-dev-1.app.helmut.cloud/api/account
    description: EU development server
  - url: http://localhost/api/account
    description: Localhost
paths:
  /v1/org/{orgName}/settings/domains:
    get:
      tags:
        - Organization.Settings.Domains
      summary: Get all domains associated with an organization
      description: |-

        Required organization role: ADMIN
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
      responses:
        '200':
          description: List of domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainDto'
        '400':
          description: Invalid Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Invalid path parameter for organization name:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                PatExpiredException:
                  $ref: '#/components/examples/PatExpiredException'
                  summary: The token has expired
                TokenExpiredException:
                  $ref: '#/components/examples/TokenExpiredException'
                  summary: The token has expired
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                SessionExpiredException:
                  $ref: '#/components/examples/SessionExpiredException'
                  summary: The user session has expired
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Basic auth cannot be used because 2FA is enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                BasicAuthDisabledInFavorOf2FAException:
                  $ref: '#/components/examples/BasicAuthDisabledInFavorOf2FAException'
                Not a member of the organization:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Insufficient organization role. Must be at least ADMIN:
                  $ref: '#/components/examples/OrganizationInsufficientRoleException'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
        default:
          description: Unexpected error
    post:
      tags:
        - Organization.Settings.Domains
      summary: Creates a new domain for an organization
      description: |-

        Required organization role: ADMIN
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreateDto'
      responses:
        '201':
          description: Created domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDto'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InvalidBodyException:
                  $ref: '#/components/examples/InvalidBodyException'
                Invalid path parameter for organization name:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                PatExpiredException:
                  $ref: '#/components/examples/PatExpiredException'
                  summary: The token has expired
                TokenExpiredException:
                  $ref: '#/components/examples/TokenExpiredException'
                  summary: The token has expired
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                SessionExpiredException:
                  $ref: '#/components/examples/SessionExpiredException'
                  summary: The user session has expired
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                LicenseQuotaExceededException:
                  $ref: '#/components/examples/LicenseQuotaExceededException'
                BasicAuthDisabledInFavorOf2FAException:
                  $ref: '#/components/examples/BasicAuthDisabledInFavorOf2FAException'
                Not a member of the organization:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Insufficient organization role. Must be at least ADMIN:
                  $ref: '#/components/examples/OrganizationInsufficientRoleException'
        '404':
          description: User does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UserNotFoundException:
                  $ref: '#/components/examples/UserNotFoundException'
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
        '409':
          description: Domain already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                DomainAlreadyAssignedException:
                  $ref: '#/components/examples/DomainAlreadyAssignedException'
        default:
          description: Unexpected error
  /v1/org/{orgName}/settings/domains/{domainName}/verify:
    patch:
      tags:
        - Organization.Settings.Domains
      summary: Verifies a domain for an organization
      description: |-

        Required organization role: ADMIN
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
        - $ref: '#/components/parameters/DomainName'
      responses:
        '200':
          description: Verified domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDto'
        '400':
          description: Invalid path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InvalidParameterException:
                  $ref: '#/components/examples/InvalidParameterException'
                Invalid path parameter for organization name:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                PatExpiredException:
                  $ref: '#/components/examples/PatExpiredException'
                  summary: The token has expired
                TokenExpiredException:
                  $ref: '#/components/examples/TokenExpiredException'
                  summary: The token has expired
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                SessionExpiredException:
                  $ref: '#/components/examples/SessionExpiredException'
                  summary: The user session has expired
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Basic auth cannot be used because 2FA is enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                BasicAuthDisabledInFavorOf2FAException:
                  $ref: '#/components/examples/BasicAuthDisabledInFavorOf2FAException'
                Not a member of the organization:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Insufficient organization role. Must be at least ADMIN:
                  $ref: '#/components/examples/OrganizationInsufficientRoleException'
        '404':
          description: Domain does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                DomainNotFoundException:
                  $ref: '#/components/examples/DomainNotFoundException'
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
        '409':
          description: Domain already verified or belongs to another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                DomainAlreadyVerifiedException:
                  $ref: '#/components/examples/DomainAlreadyVerifiedException'
                DomainBelongsToAnotherOrganizationException:
                  $ref: >-
                    #/components/examples/DomainBelongsToAnotherOrganizationException
        '428':
          description: The domain verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                DomainVerificationFailedException:
                  $ref: '#/components/examples/DomainVerificationFailedException'
        default:
          description: Unexpected error
  /v1/org/{orgName}/settings/domains/{domainName}:
    delete:
      tags:
        - Organization.Settings.Domains
      summary: Deletes a domain for an organization
      description: |-

        Required organization role: ADMIN
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
        - $ref: '#/components/parameters/DomainName'
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InvalidParameterException:
                  $ref: '#/components/examples/InvalidParameterException'
                Invalid path parameter for organization name:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                PatExpiredException:
                  $ref: '#/components/examples/PatExpiredException'
                  summary: The token has expired
                TokenExpiredException:
                  $ref: '#/components/examples/TokenExpiredException'
                  summary: The token has expired
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                SessionExpiredException:
                  $ref: '#/components/examples/SessionExpiredException'
                  summary: The user session has expired
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Basic auth cannot be used because 2FA is enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                BasicAuthDisabledInFavorOf2FAException:
                  $ref: '#/components/examples/BasicAuthDisabledInFavorOf2FAException'
                Not a member of the organization:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Insufficient organization role. Must be at least ADMIN:
                  $ref: '#/components/examples/OrganizationInsufficientRoleException'
        '404':
          description: Domain does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                DomainNotFoundException:
                  $ref: '#/components/examples/DomainNotFoundException'
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InternalServerErrorException:
                  $ref: '#/components/examples/InternalServerErrorException'
        default:
          description: Unexpected error
  /v1/guest:
    post:
      tags:
        - Guest
      summary: Create a guest user
      description: Create a guest user by providing an email and HMAC
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestCreateDto'
      responses:
        '200':
          description: Guest object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        default:
          description: Unexpected error
    put:
      tags:
        - Guest
      summary: Login a guest user
      description: Login as a guest user by providing an email and HMAC
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestLoginDto'
      responses:
        '200':
          description: Guest object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        default:
          description: Unexpected error
  /v1/guest/email/{email}:
    get:
      tags:
        - Guest
      summary: Check email's guest status
      description: Check if a certain email is associated with a guest account
      parameters:
        - name: email
          in: path
          description: Email of the guest account
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '"no user" | "not guest" | "guest"'
          content:
            application/json:
              schema:
                type: string
        default:
          description: Unexpected error
  /v1/org/{orgName}/license:
    get:
      tags:
        - Organization.License
      summary: Get the current license applied to the organization
      description: |-

        Required scopes: IDP_ORGANIZATION_READ\
        Required role: MEMBER
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
      responses:
        '200':
          description: License
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseDto'
        '400':
          description: Invalid Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Invalid path parameter for organization name:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                PatExpiredException:
                  $ref: '#/components/examples/PatExpiredException'
                  summary: The token has expired
                TokenExpiredException:
                  $ref: '#/components/examples/TokenExpiredException'
                  summary: The token has expired
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                SessionExpiredException:
                  $ref: '#/components/examples/SessionExpiredException'
                  summary: The user session has expired
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Basic auth cannot be used because 2FA is enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                BasicAuthDisabledInFavorOf2FAException:
                  $ref: '#/components/examples/BasicAuthDisabledInFavorOf2FAException'
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Not a member of the organization:
                  $ref: '#/components/examples/InsufficientAccessRightException'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
        default:
          description: Unexpected error
    put:
      tags:
        - Organization.License
      summary: Update the license of the organization
      description: |-

        Required scopes: IDP_ORGANIZATION_ADMIN\
        Required role: OWNER
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseUpdateDto'
        required: true
      responses:
        '200':
          description: License
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseDto'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InvalidBodyException:
                  $ref: '#/components/examples/InvalidBodyException'
                Invalid path parameter for organization name:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                PatExpiredException:
                  $ref: '#/components/examples/PatExpiredException'
                  summary: The token has expired
                TokenExpiredException:
                  $ref: '#/components/examples/TokenExpiredException'
                  summary: The token has expired
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                SessionExpiredException:
                  $ref: '#/components/examples/SessionExpiredException'
                  summary: The user session has expired
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UnassignedLicenseException:
                  $ref: '#/components/examples/UnassignedLicenseException'
                BasicAuthDisabledInFavorOf2FAException:
                  $ref: '#/components/examples/BasicAuthDisabledInFavorOf2FAException'
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Not a member of the organization:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Insufficient organization role. Must be at least OWNER:
                  $ref: '#/components/examples/OrganizationInsufficientRoleException'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                FailedToFetchLicenseException:
                  $ref: '#/components/examples/FailedToFetchLicenseException'
  /v1/login:
    post:
      tags:
        - Login
      summary: >-
        Endpoint to validate user credentials and authorize user against the
        system
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginDto'
      responses:
        '200':
          description: User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InvalidParameterException:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: Not Authorized exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
        '403':
          description: Invalid TOTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UserTotpInvalidException:
                  $ref: '#/components/examples/UserTotpInvalidException'
        default:
          description: Unexpected error
  /v1/login/verify/totp:
    post:
      tags:
        - Login
      summary: Endpoint to validate user totp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTotpDto'
        required: true
      responses:
        '204':
          description: If either totp is valid or user has totp not enabled
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InvalidBodyException:
                  $ref: '#/components/examples/InvalidBodyException'
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
        '403':
          description: Forbidden exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UserTotpInvalidException:
                  $ref: '#/components/examples/UserTotpInvalidException'
        default:
          description: Unexpected error
  /v1/login/forgot_password:
    post:
      tags:
        - Login
      summary: >-
        Initiate the password reset process. An email will be sent to the user
        to move to

        the next phase.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordDto'
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InvalidBodyException:
                  $ref: '#/components/examples/InvalidBodyException'
        '409':
          description: Invalid Captcha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                RegistrationInvalidCaptchaException:
                  $ref: '#/components/examples/RegistrationInvalidCaptchaException'
        '500':
          description: Internal Server Error - Unable to send the email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InternalServerErrorException:
                  $ref: '#/components/examples/InternalServerErrorException'
        default:
          description: Unexpected error
  /v1/login/pre:
    get:
      tags:
        - Login
      summary: Endpoint to get the way to proceed with the authentication
      parameters:
        - name: email
          in: query
          description: Email of the user
          required: true
          schema:
            type: string
        - name: origin
          in: query
          description: Origin of the request. Used when the response path is EXTERNAL.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPreDto'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InvalidParameterException:
                  $ref: '#/components/examples/InvalidParameterException'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InternalServerErrorException:
                  $ref: '#/components/examples/InternalServerErrorException'
        default:
          description: Unexpected error
  /v1/login/oidc:
    get:
      tags:
        - Login.OpenID Connect
      summary: Authenticate a user against a 3rd party using OAuth/OpenID Connect
      description: Redirects a user to the provider's login page
      parameters:
        - name: origin
          in: query
          description: >-
            Starting URL of the process. After obtaining the credentials, the
            user will be redirected back to this url
          required: true
          schema:
            type: string
        - name: hint
          in: query
          description: >-
            Valid email address of the user that wants to login. Hint must be
            defined when provider is not.
          required: false
          schema:
            type: string
        - name: provider
          in: query
          description: >-
            Provider to use for the process. Only optional

            if the user is part of an organization that has a preferred OIDC
            provider and an associated

            email that matches the user's. The list of available providers can
            be found in the public config endpoint.
          required: false
          schema:
            type: string
      responses:
        '302':
          description: >-
            Redirect to the providers page to proceed with the authentication
            process
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InvalidParameterException:
                  $ref: '#/components/examples/InvalidParameterException'
        '404':
          description: Specified provider does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                OIDCProviderNotFoundException:
                  $ref: '#/components/examples/OIDCProviderNotFoundException'
  /v1/login/saml/metadata.xml:
    get:
      tags:
        - Login.SAML
      summary: |-
        Obtain the metadata XML file with information about HCloud as
                 a SAML 2.0 Service Provider
      responses:
        '200':
          description: Metadata.xml file.
          content:
            application/xml: {}
  /v1/login/saml:
    get:
      tags:
        - Login.SAML
      summary: Start the login process using the SAML2.0 protocol
      parameters:
        - name: origin
          in: query
          description: |-
            A URL marking the starting point of the login process.
                                          At the end the user will be redirected back to this URL
                                          with token=\<JWT\> added to the query string.
          required: true
          schema:
            type: string
        - name: email
          in: query
          description: |-
            The user's email. The email domain will be used to determine
