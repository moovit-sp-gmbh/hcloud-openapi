        - FUSE
        - COSMO
        - LAST_VISITED
      description: New entrypoint in helmut.cloud
      example: HIGH5
    DateFormat:
      type: string
      enum:
        - YYYY-MM-DDTHH:mm:ss
        - YYYY-MM-DD hh:mm:ss a
        - MM/DD/YYYY hh:mm:ss a
        - Day, Month DD, YYYY at hh:mm:ss a
        - DD/MM/YYYY HH:mm:ss
        - Day DD Month YYYY at HH:mm:ss
        - DD.MM.YYYY HH:mm:ss
        - Day, DD. Month YYYY at HH:mm:ss
      description: New format to use for dates
      example: Day DD Month YYYY at HH:mm:ss
    Theme:
      type: string
      enum:
        - DARK
        - LIGHT
        - DARK_HIGH_CONTRAST
        - LIGHT_HIGH_CONTRAST
        - SYSTEM_DEFAULT
      description: Theme to use
      example: SYSTEM_DEFAULT
    GeneralSettingsPatchDto:
      type: object
      properties:
        lastUrl:
          type: string
          minLength: 1
          maxLength: 2048
          description: Last URL visited by the user
          example: /account/settings
        lastView:
          $ref: '#/components/schemas/Views'
        timezone:
          type: string
          description: IANA timezone
          example: Europe/Lisbon
        language:
          $ref: '#/components/schemas/Language'
        entrypoint:
          $ref: '#/components/schemas/Entrypoint'
        dateFormat:
          $ref: '#/components/schemas/DateFormat'
        theme:
          $ref: '#/components/schemas/Theme'
      description: >-
        Payload for updating general settings such as last visited URL, view,
        timezone, language, entrypoint, date format, and theme
      example:
        lastUrl: /account/settings
        lastView: /account
        timezone: Europe/Lisbon
        language: en
        entrypoint: HIGH5
        dateFormat: Day DD Month YYYY at HH:mm:ss
        theme: SYSTEM_DEFAULT
    NotificationSettingsPatchDto:
      type: object
      properties:
        organizationInvitationEmail:
          type: boolean
          description: Enable/disable email notification when invited to an organization
          example: true
        systemNotifications:
          type: boolean
          description: Enable/disable system notifications
          example: false
        cosmoNotifications:
          type: boolean
          description: Enable/disable cosmo notifications
          example: true
      description: >-
        Payload for updating notification preferences such as organization
        invites, system, and cosmo alerts
      example:
        organizationInvitationEmail: true
        systemNotifications: false
        cosmoNotifications: true
    UserChangePasswordDto:
      type: object
      properties:
        old:
          type: string
          description: Old password
          example: OldPass123!
        new:
          type: string
          minLength: 8
          pattern: ^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,255}$
          description: >-
            New password (must include uppercase, lowercase, number, and special
            character)
          example: NewPass456@
        token:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
          description: >-
            TOTP token to validate the user's authenticity. Only required if the
            user has 2FA enabled.
          example: '935482'
      required:
        - old
        - new
      description: >-
        Payload for changing a user's password, including old and new passwords
        and optional 2FA token
      example:
        old: OldPass123!
        new: NewPass456@
        token: '935482'
    UserLoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the user
          example: hmc@helmut.cloud
        password:
          type: string
          description: Password of the user
          example: 123&/(Password
        token:
          anyOf:
            - type: string
              minLength: 6
              maxLength: 6
              pattern: ^\d{6}$
            - type: string
              enum:
                - ''
          description: >-
            Token to match against a TOTP secret if 2FA is enabled (empty string
            is ignored)
          example: '937482'
      required:
        - email
        - password
      description: >-
        Payload for user login, including email, password, and optional 2FA
        token
      example:
        email: hmc@helmut.cloud
        password: 123&/(Password
        token: '937482'
    UserPatchDto:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
          pattern: ^(?!-)(?!.*--)[\p{L}\p{M}0-9_. -]{3,255}(?<!-)$
          description: >-
            Name of the user (only alphanumeric characters, underscores,
            hyphens, dots and spaces are allowed; it should contain between 3
            and 255 characters)
          example: Helmut Mc Cloud
        email:
          type: string
          format: email
          description: Email of the user
          example: hmc@helmut.cloud
        password:
          type: string
          minLength: 8
          maxLength: 255
          pattern: ^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,255}$
          description: >-
            Password of the user (only alphanumeric, underscores, hyphens, dots
            and special characters are allowed; it should contain between 8 and
            255 characters)
          example: MySuperSecurePassword123!
        company:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[\w-. ]{1,255}$
          description: >-
            Name of the company the organization belongs to (only alphanumeric
            characters, underscores, hyphens, dots and spaces are allowed; it
            should contain between 1 and 255 characters)
          example: Moovit SP
        activeOrganization:
          anyOf:
            - type: string
              minLength: 3
              maxLength: 64
              pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
              description: >-
                Name of the organization (only alphanumeric characters, hyphens
                and dots are allowed; it should contain between 3 and 64
                characters)
              example: MoovIT-Software-Products-GmbH
            - type: string
              minLength: 3
              maxLength: 255
              pattern: ^[\p{L}\p{M}0-9_+@.-]{3,255}$
              description: >-
                Name of the user's private organization, allowed everything
                defined in the RFC for the email specification (it should
                contain between 3 and 255 characters)
              example: hmc@helmut.cloud
          description: Name of the currently active organization of the user
          example: Video Editors
      description: >-
        Payload for updating user profile fields such as name, email, password,
        company, and active organization
      example:
        name: Helmut Mc Cloud
        email: hmc@helmut.cloud
        password: MySuperSecurePassword123!
        company: Moovit Software Products
        activeOrganization: Video Editors
    UserRegistrationDto:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
          pattern: ^(?!-)(?!.*--)[\p{L}\p{M}0-9_. -]{3,255}(?<!-)$
          description: >-
            Name of the user (only alphanumeric characters, underscores,
            hyphens, dots and spaces are allowed; it should contain between 3
            and 255 characters)
          example: Helmut Mc Cloud
        email:
          type: string
          format: email
          description: Email of the user
          example: hmc@helmut.cloud
        password:
          type: string
          minLength: 8
          maxLength: 255
          pattern: ^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,255}$
          description: >-
            Password of the user (only alphanumeric, underscores, hyphens, dots
            and special characters are allowed; it should contain between 8 and
            255 characters)
          example: MySuperSecurePassword123!
        company:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[\w-. ]{1,255}$
          description: >-
            Name of the company the organization belongs to (only alphanumeric
            characters, underscores, hyphens, dots and spaces are allowed; it
            should contain between 1 and 255 characters)
          example: Moovit SP
        captcha:
          type: string
          minLength: 1
          description: Valid google reCAPTCHAV2
          example: A6bmQ7n38
        language:
          allOf:
            - $ref: '#/components/schemas/Language'
            - description: Define the user's language
              example: de
        timezone:
          type: string
          description: Define the user's timezone
          example: Europe/Lisbon
        targetUrl:
          type: string
          format: uri
          description: >-
            URL to create the redirect link in the email. Defaults to
            https://app.helmut.cloud.
          example: https://app.helmut.cloud
      required:
        - name
        - email
        - password
        - captcha
      description: >-
        Payload for user registration, including credentials, optional company,
        language, timezone, and redirect URL
      example:
        name: Helmut Mc Cloud
        email: hmc@helmut.cloud
        password: MySuperSecurePassword123!
        company: Moovit Software Products
        captcha: A6bmQ7n38
        language: de
        timezone: Europe/Lisbon
        targetUrl: https://app.helmut.cloud
    UserResendRegistrationEmailDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the user
          example: hmc@helmut.cloud
        targetUrl:
          type: string
          format: uri
          description: >-
            URL to create the redirect link in the email. It will default to
            https://app.helmut.cloud.
          example: https://app.helmut.cloud
      required:
        - email
      description: >-
        Payload for resending a registration email, including user email and
        optional redirect URL
      example:
        email: hmc@helmut.cloud
        targetUrl: https://app.helmut.cloud
    UserResetPasswordDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the user
          example: hmc@helmut.cloud
        nonce:
          type: string
          description: Nonce generated in the 1st phase of the password reset process.
          example: d6e65091-5810-4dc8-a321-9ea59f49e4fa
        newPassword:
          type: string
          pattern: ^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,255}$
          description: New password
          example: MySuperSecurePassword123!
        totpToken:
          type: string
          description: TOTP token. Required only if the user has 2FA enabled.
          example: '237112'
      required:
        - email
        - nonce
        - newPassword
      description: >-
        Payload for resetting a user's password, including email, nonce, new
        password, and optional 2FA token
      example:
        email: hmc@helmut.cloud
        nonce: d6e65091-5810-4dc8-a321-9ea59f49e4fa
        newPassword: Anewpassword!123
        totpToken: '237112'
    UserResolveDto:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: string
            minLength: 24
            maxLength: 24
            pattern: ^[a-fA-F0-9]{24}$
            description: >-
              ID of the user (ObjectId identifier, consists of 24 hexadecimal
              digits)
            example: 671b7de208337dc792b65f93
          minItems: 1
          description: List of user IDs to be resolved
          example:
            - 761b2de208337dc792b65f93
            - 385b2de208337dc792b65f38
            - 97ab2de208337dc792b65f11
        organizationId:
          type: string
          minLength: 24
          maxLength: 24
          format: hexadecimal
          description: >-
            ID of an organization. Will not resolve users that are not members
            of this organization. In essence, guarantees that all users are
            members of the same organization.
          example: 563b2de208337dc792b65dc2
        email:
          type: string
          format: email
          description: >-
            Email of a user. Must be undefined if userIds are defined and
            vice-versa.
          example: hmc@helmut.cloud
      description: >-
        Payload for resolving users by ID or email, optionally scoped to an
        organization
      example:
        userIds:
          - 761b2de208337dc792b65f93
          - 385b2de208337dc792b65f38
          - 97ab2de208337dc792b65f11
        organizationId: 563b2de208337dc792b65dc2
    UserVerifyRegistrationDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the user
          example: hmc@helmut.cloud
        verificationCode:
          type: string
          format: uuid
          description: Verification code
          example: 2ba23e43-a549-48e2-8ce0-832b8ad13729
      required:
        - email
        - verificationCode
      description: Payload for verifying user registration via email and verification code
      example:
        email: hmc@helmut.cloud
        verificationCode: 2ba23e43-a549-48e2-8ce0-832b8ad13729
    CustomAvatarDto:
      type: object
      properties:
        avatar:
          type: string
          format: binary
          description: Image file to upload as avatar
          example: <binary>
      required:
        - avatar
      description: Custom image must be send in request body as multipart/form-data as file
    ReducedOrganization:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
