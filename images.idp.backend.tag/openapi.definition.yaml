            members of the same organization.
          example: 563b2de208337dc792b65dc2
        email:
          type: string
          format: email
          description: >-
            Email of a user. Must be undefined if userIds are defined and
            vice-versa.
          example: hmc@helmut.cloud
      description: >-
        Payload for resolving users by ID or email, optionally scoped to an
