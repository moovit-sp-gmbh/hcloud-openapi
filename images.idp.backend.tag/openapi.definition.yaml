    OAuthTokenRequestDto:
      properties:
        grant_type:
          $ref: '#/components/schemas/GrantType'
          description: Type of authorization grant.
        code:
          type: string
          description: >-
            Code from the OAuth code grant. Will be ignored if the grant type is
            not "authorization_code".
        refresh_token:
          type: string
          description: >-
            RefreshToken from the OAuth token grant. Required in the
            refresh_token grant and ignored in the authorization_code grant.
        client_id:
          type: string
          description: HcloudClientId of the OAuth app
        client_secret:
          type: string
          description: Client secret of the OAuth app
        redirect_uri:
          type: string
          description: >-
            Callback URI of the OAuth app. If a redirect_uri was sent in the
            authorization phase, then it must be sent again. Optional for the
            authorization_code grant and ignored in the refresh_token grant.
        scope:
          type: string
          description: >-
            Scope that the access token should be granted. Optional for the
            refresh_token grant and ignored in the authorization_code grant. The
            requested scope MUST NOT include any scope not originally granted,
            and if omitted is treated as equal to the scope originally granted.
      required:
        - grant_type
        - client_id
        - client_secret
      example:
        grant_type: authorization_code
        code: 32f63f0b8033d77d31b5a4eb77db9c30
        client_id: 30ed05e3-4065-4c2c-b537-e4c411854b6f
        client_secret: >-
          secret_a976faeab2af78f3036ab3cd3773d28346d0d26aaec02f81699c4f1847148bc6
        redirect_uri: https://yourredirect.url
    OrgMemberExecutionTargetPatchDto:
      properties:
        executionTarget:
          type: boolean
          description: >-
            Boolean flag that determines if this user can be an execution target
            for this organization.
      required:
        - executionTarget
      example:
        executionTarget: true
    OrgMemberInvitationCreateDto:
      properties:
        email:
          type: string
          description: Email of the user
        role:
          $ref: '#/components/schemas/OrganizationRole'
          description: Role the user shall have in the Organization
        allowNonRegisteredUsers:
          type: boolean
          description: >-
            If non-registered users are allowed and the email is not bound an
            HCloud user, then a registration email will be sent to this email.
            Upon registration, the user will be added automatically to the
            organization.
        targetUrl:
          type: string
          description: >-
            URL create the redirect link in the email. It will default to
            https://app.helmut.cloud.
      required:
        - email
        - role
      example:
        email: hmc@helmut.cloud
        role: MEMBER
        allowNonRegisteredUsers: false
        targetUrl: app.helmut.cloud
    OrgMemberInvitationPatchDto:
      properties:
        accept:
          type: boolean
          description: True to accept. False to reject.
      required:
        - accept
      example:
        accept: false
    OrgMemberPatchDto:
      properties:
        role:
          $ref: '#/components/schemas/OrganizationRole'
          description: New role the member shall have in the Organization
      required:
        - role
      example:
        role: MEMBER
    OrgMemberSearch:
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/SearchFilter'
          description: A list of filters
        sorting:
          $ref: '#/components/schemas/Sorting'
          description: The sorting definition
        excludeTeamByName:
          type: string
          description: Name of team whos members shall not be returned
      example:
        filters:
          - type: DATE
            key: modifyDate
            comparator: less than
            value: 1681912446650
        sorting:
          direction: DESC
          fields:
            - name
            - company
        excludeTeamByName: SomeTeamName
    OrganizationCreateDto:
      properties:
        name:
          type: string
          description: Name of the organization
        company:
          type: string
          description: Name of the company the organization belongs to
      required:
        - name
      example:
        name: Devs
        company: Moovit SP
    OrganizationDto:
      properties:
        _id:
          type: string
          description: ID of the organization
        name:
          type: string
          description: Name of the organization
        creator:
          $ref: '#/components/schemas/ReducedUser'
          description: Creator of the organization
        company:
          type: string
          description: Company the organization belongs to
        isUserOrganization:
          type: boolean
          description: Defines if it's a user organization
        createDate:
          type: number
          description: Creation date of the organization
        modifyDate:
          type: number
          description: Date of last database entry modification
        roleOfUser:
          $ref: '#/components/schemas/OrganizationRole'
          description: Role the current request user has in this organization
        executionTarget:
          type: boolean
          description: >-
            Whether or not the current request user is set as an executionTarget
            in this organization
        avatarUrl:
          type: string
          description: Url of the avatar
        membersSample:
          type: array
          items:
            $ref: '#/components/schemas/ReducedUser'
          description: >-
            Array holding a limited number of organization members (used for
            preview purposes)
        totalMemberCount:
          type: number
          description: Total number of members the organization holds
        teamsOfUser:
          type: array
          items:
            $ref: '#/components/schemas/ReducedTeamDto'
          description: >-
            Teams that the requesting user is part of and that belong to the
            organization
        license:
          $ref: '#/components/schemas/LicenseDto'
          description: License of the organization
      required:
        - _id
        - name
