    ServiceAccountDto:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
          description: Account ID
          example: 6584c915f173f39d71bb8b38
        name:
          type: string
          description: Account name
          example: Helmut Mc Cloud
        email:
          type: string
          format: email
          description: Account email
          example: hmc@helmut.cloud
        avatarUrl:
          type: string
          format: uri
          description: Account avatar URL
          example: https://app.helmut.cloud/asset/no_avatar.webp
        token:
          type: string
          description: >-
            Account authentication token. This will be defined only on account
            creation and on account regeneration
          example: hlmc_p_8332629108ba293471c7bb8631a12d8b
      required:
        - _id
        - name
        - email
        - avatarUrl
      description: Represents a service account object
      example:
        _id: 6584c915f173f39d71bb8b38
        name: Helmut Mc Cloud
        email: hmc@helmut.cloud
        avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        token: hlmc_p_8332629108ba293471c7bb8631a12d8b
    StatsDto:
      type: object
      properties:
        orgName:
          type: string
          description: Name of the organization
          example: Moovit SP GmbH
        usersTotal:
          type: number
          minimum: 0
          description: Total number of registered users within the organization
          example: 47
        usersOnline:
          type: number
          minimum: 0
          description: Number of users currently online in the organization
          example: 19
        teams:
          type: number
          minimum: 0
          description: Total number of teams created under the organization
          example: 11
        serviceAccounts:
          type: number
          minimum: 0
          description: Number of agent accounts associated with the organization
          example: 5
      required:
        - orgName
        - usersTotal
        - usersOnline
        - teams
        - serviceAccounts
      description: Aggregated license usage statistics for a given organization
      example:
        orgName: Moovit SP GmbH
        usersTotal: 47
        usersOnline: 19
        teams: 11
        serviceAccounts: 5
    UsersEmailDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the User
          example: hmc@helmut.cloud
      required:
        - email
      description: Users email address.
      example:
        email: hmc@helmut.cloud
    User2FADto:
      type: object
      properties:
        totp:
          type: boolean
          description: TOTP status of this account
          example: true
      required:
        - totp
      description: 2FA Totp status for this account
      example:
        totp: true
    UserWith2FADto:
      allOf:
        - $ref: '#/components/schemas/UserDto'
        - type: object
          properties:
            twoFactor:
              $ref: '#/components/schemas/User2FADto'
      description: User with 2FA object
      example:
        _id: 5684c915f173f39d71bb8bd7
        name: Helmut Mc Cloud
        email: hmc@helmut.cloud
        company: Moovit Software Products
        activeOrganization: Video Editors
        avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        createDate: 1665569820033
        modifyDate: 1666361487534
        activeScopes:
          - idp:organization:admin
        isAgent: true
        isGuest: false
        lastActive: 1666361487534
        twoFactor:
          totp: true
    NatsAccess:
      type: object
      properties:
        allow:
          type: array
          items:
            type: string
        deny:
          type: array
          items:
            type: string
    NatsResponses:
      type: object
      properties:
        max:
          type: number
          format: int32
        ttl:
          type: number
          format: int64
      required:
        - max
        - ttl
    NatsPermissions:
      type: object
      properties:
        publish:
          $ref: '#/components/schemas/NatsAccess'
        subscribe:
          $ref: '#/components/schemas/NatsAccess'
        responses:
          $ref: '#/components/schemas/NatsResponses'
      required:
        - publish
        - subscribe
        - responses
      description: Permissions the user has inside the NATS message bus
    NatsDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the User
          example: hmc@helmut.cloud
        permissions:
          $ref: '#/components/schemas/NatsPermissions'
      required:
        - email
        - permissions
      description: User's NATS configuration including email and permission structure.
    ReducedOrganizationWithConnect:
      allOf:
        - $ref: '#/components/schemas/ReducedOrganization'
        - type: object
          properties:
            connect:
              type: boolean
              description: >-
                Flag that determines whether or not to connect to this
                organization
              example: true
          required:
            - connect
      description: Reduced organization object extended with connection status
      example:
        _id: 2977e64ff912d31ffa27a585
        name: Moovit Software Products
        avatarUrl: https://example.com/asset/some_avatar.webp
        connect: true
    ConnectionSettingsDto:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ReducedOrganizationWithConnect'
          description: >-
            Record of connection flags for each organization the user is part
            of.
          example:
            - _id: 2977e64ff912d31ffa27a585
              name: Moovit Software Products
              avatarUrl: https://example.com/asset/some_avatar.webp
              connect: true
      required:
        - connections
      description: Connection settings for the user across all organizations they belong to
      example:
        connections:
          - _id: 2977e64ff912d31ffa27a585
            name: Moovit Software Products
            avatarUrl: https://example.com/asset/some_avatar.webp
            connect: true
    GeneralSettingsDto:
      type: object
