        activated: false
        otpAuthUrl: >-
          otpauth://totp/example@helmut.cloud?secret=MUWES4KBJ54DUURPIB3GCVLHHY4GGLST&issuer=localhost&algorithm=SHA1&digits=6&period=30
        qrcode: >-
          data:image/png;base64,
        secret: MUWES4KBJ54DUURPIB3GCVLHHY4GGLST
        createDate: 1685096723820
        modifyDate: 1685096723820
