    SAMLResponse:
      properties:
        RelayState:
          type: string
          description: State value forwarded by the SAML IdP
        SAMLResponse:
          type: string
          description: >-
            Base64 URL encoded XML string containing the response as per the <a
            href="https://docs.oasis-open.org/security/saml/v2.0/saml-bindings-2.0-os.pdf">SAML
            2.0 HTTP POST binding (Section 3.5)</a>
      required:
        - RelayState
        - SAMLResponse
      example:
        RelayState: ac022b41-acfb-4129-8a69-c1ce0e992191
        SAMLResponse: PHNhbWxwOlJlc3BvbnNlPmV4YW1wbGU8L3NhbWxwOlJlc3BvbnNlPg==
    Scope:
      enum:
        - hcloud:full
        - idp:email:read
        - idp:user:read
        - idp:user:write
        - idp:user:delete
        - openid
        - idp:organization:read
        - idp:organization:write
        - idp:organization:delete
        - idp:organization:admin
        - high5:space:read
        - high5:space:execute
        - high5:space:write
        - high5:space:delete
        - fuse:space:read
        - fuse:space:execute
        - fuse:space:write
        - fuse:space:delete
        - cosmo:space:read
        - cosmo:space:write
        - cosmo:space:delete
      type: string
      description: >
        * hcloud:full - Full access to HCloud

        * idp:email:read - Access to email read operations

        * idp:user:read - Access to read operations of users

        * idp:user:write - Access to read and write operations of users

        * idp:user:delete - Access to read, write and delete operations of users

        * openid - Used for OAuth authentication requests. Used in the OpenID
        Connect protocol.

        * idp:organization:read - Access to read operations of organizations

        * idp:organization:write - Access to read and write operations of
        organizations

        * idp:organization:delete - Access to read, write and delete operations
        of organizations

        * idp:organization:admin - Access to read, write and delete operations
        of organizations and ability to manage its members

        * high5:space:read - Access to read operations of spaces

        * high5:space:execute - Access to the ability to start execution of
        streams of spaces

        * high5:space:write - Access to read and write operations of spaces

        * high5:space:delete - Access to read, write and delete operations of
        spaces

        * fuse:space:read - Access to read operations of spaces

        * fuse:space:execute - Access to the ability to start execution of
        streams of spaces

        * fuse:space:write - Access to read and write operations of spaces

        * fuse:space:delete - Access to read, write and delete operations of
        spaces

        * cosmo:space:read - Access to read operations of spaces

        * cosmo:space:write - Access to read and write operations of spaces

        * cosmo:space:delete - Access to read, write and delete operations of
        spaces
    Search:
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/SearchFilter'
          description: A list of filters
        sorting:
          $ref: '#/components/schemas/Sorting'
          description: The sorting definition
      example:
        filters:
          - type: DATE
            key: modifyDate
            comparator: less than
            value: 1681912446650
        sorting:
          direction: DESC
          fields:
            - name
            - company
    SearchFilterComparatorBoolean:
      enum:
        - is
        - is not
      type: string
      description: |
        * is - Boolean equals the specified boolean value
        * is not - Boolean does not equal the specified boolean value
    SearchFilterComparatorDate:
      enum:
        - is
        - is not
        - greater than
        - less than
        - greater than or equal
        - less than or equal
      type: string
      description: >
        * is - Date equals the specified date value

        * is not - Date does not equal the specified date value

        * greater than - Date is more recent than the specified date value

        * less than - Date is older than the specified date value

        * greater than or equal - Date is more recent or equal to the specified
        date value

        * less than or equal - Date is older than or equal to the specified date
        value
    SearchFilterComparatorNumber:
      enum:
        - is
        - is not
        - greater than
        - less than
        - greater than or equal
        - less than or equal
      type: string
      description: >
        * is - Number equals the specified numeric value

        * is not - Number does not equal the specified numeric value

        * greater than - Number is greater than the specified numeric value

        * less than - Number is less than the specified numeric value

        * greater than or equal - Number is greater than or equal to the
        specified numeric value

        * less than or equal - Number is less than or equal to the specified
        numeric value
    SearchFilterComparatorString:
      enum:
        - is
        - is not
        - starts with
        - ends with
        - contains
      type: string
      description: |
        * is - String equals the specified string value
        * is not - String does not equal the specified string value
        * starts with - String starts with the specified string value
        * ends with - String ends with the specified string value
        * contains - String contains the specified string value
    SearchFilterType:
      enum:
        - STRING
        - SELECT
        - MULTISELECT
        - TYPEAHEAD
        - NUMBER
        - DATE
        - BOOLEAN
      type: string
      description: |
        * STRING - Filter by a string value
        * SELECT - Filter by a value from a set of possible choices
        * MULTISELECT - Filter by multiple values from a set of possible choices
        * TYPEAHEAD - Filter by ???
        * NUMBER - Filter by a numeric value
        * DATE - Filter by a Date value
        * BOOLEAN - Filter by a boolean flag
