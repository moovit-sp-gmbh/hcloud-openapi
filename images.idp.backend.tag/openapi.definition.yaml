  /v1/org/{orgName}:
    get:
      description: |-

        Required role: MEMBER
        Required scopes: IDP_ORGANIZATION_READ
      summary: Retrieves an organization by it's name
      tags:
        - Organization
      parameters:
        - schema:
            anyOf:
              - type: string
                minLength: 3
                maxLength: 64
                pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
                description: >-
                  Name of the organization (only alphanumeric characters,
                  hyphens and dots are allowed; it should contain between 3 and
                  64 characters)
                example: MoovIT-Software-Products-GmbH
              - type: string
                minLength: 3
                maxLength: 255
                pattern: ^[\p{L}\p{M}0-9_+@.-]{3,255}$
                description: >-
                  Name of the user's private organization, allowed everything
                  defined in the RFC for the email specification (it should
                  contain between 3 and 255 characters)
                example: hmc@helmut.cloud
          required: true
          name: orgName
          in: path
        - schema:
            type: boolean
            nullable: true
            description: >-
              If true, an additional property holding all teams that the
              requesting user is part of and that belong to the organization
              will be returned
          required: false
          name: teamsOfUser
          in: query
        - schema:
            type: boolean
            nullable: true
            description: >-
              If true, an additional property holding the total member count of
              the organization will be returned
          required: false
          name: totalMemberCount
          in: query
        - schema:
            type: number
            minimum: 1
            maximum: 100
            default: 25
            description: >-
              If set, an additional property holding a sample of members will be
              returned. The provided number represents the max. size of the
              sample
          required: false
          name: membersSample
          in: query
        - schema:
            type: boolean
            nullable: true
            description: >-
