            - description: >-
                * GUEST - Guest of an organization

                * MEMBER - Standard member of an organization

                * MANAGER - Member of an organization that has the ability to
                manage certain aspects of the organization's members

                * ADMIN - Member of an organization that has the ability to
                manage all aspects of the organization's members

                * OWNER - Member of an organization that has the ability to
                manage all aspects of the organization's members. Only this
                member can delete the organization
        executionTarget:
          type: boolean
          description: >-
            Flag that represents whether or not this user is a valid execution
            target for this organization
          example: false
        lastActive:
          type: number
          description: Last activity of the user
          example: 1666361487534
        serviceAccount:
          type: boolean
          description: Is service account
          example: false
        isGuest:
          type: boolean
          description: Boolean flag indicating if this is a guest account
          example: false
      required:
        - _id
        - email
        - name
        - avatarUrl
        - role
        - executionTarget
        - lastActive
        - serviceAccount
      description: >-
        Represents a member of an organization, including identity, role, and
        activity metadata.
      example:
        _id: 8184c915f173f39d71bb8b61
        email: hmc@helmut.cloud
        name: Helmut Mc Cloud
        avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        role: MEMBER
        executionTarget: false
        lastActive: 1666361487534
        serviceAccount: false
        isGuest: false
