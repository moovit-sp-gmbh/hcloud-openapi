        _id: 3817e64ff912d31ffa27a571
        name: Helmut Mc Cloud
        email: mcloud@helmut.cloud
        avatarUrl: https://example.com/asset/some_avatar.webp
        isGuest: false
        isAgent: false
    DomainDto:
