    OAuthTokenEndpointErrorResponseDto:
      properties:
        error:
          type: string
          description: >-
            Error code. More info <a
            href="https://datatracker.ietf.org/doc/html/rfc6749#section-5.2">here</a>.
      required:
        - error
      example:
        error: OAuth token error
    OAuthTokenEndpointResponseDto:
      properties:
        access_token:
          type: string
          description: Token used for authentication with the resource server.
        token_type:
          type: string
          description: Type of the access_token.
        expires_in:
          type: number
          description: Time in seconds until the access_token becomes invalid.
        refresh_token:
          type: string
          description: >-
            Token that can be exchanged for another access_token without the
            end-user.
        scope:
          type: string
          description: >-
            Scope granted to the access_token. If not defined, then the scope
            granted is equal to what was requested.
        id_token:
          type: string
          description: >-
            OpenID Connect ID token. Will be present if "openid" is part of the
            scope requested.
      required:
        - access_token
        - token_type
        - expires_in
      example:
        access_token: >-
          eyJhbGciOiJIUzI1NiIsInR5cCI6ImF0K2p3dCJ9.eyJzY29wZSI6WyJpZHA6ZW1haWw6cmVhZCIsImlkcDp1c2VyOnJlYWQiLCJpZHA6b3JnYW5pemF0aW9uOnJlYWQiLCJvcGVuaWQiXSwiaWF0IjoxNjkyODgxOTUzLCJleHAiOjE2OTI4ODU1NTMsImF1ZCI6IjkzZWVmNzkyLTUwYzctNGExNi04MjRiLTBhOTQxYmE1OTQzNiIsImlzcyI6ImhlbG11dC5jbG91ZCIsImp0aSI6ImViYzk5YjBlLTAxZTYtNDA3OC05MTYzLTlhMTIzZDhiYTM5MSJ9.Pp4GB9ZC7HaNkYWW3PTDjxotTlsjLNvJprfWcuPJDsk
