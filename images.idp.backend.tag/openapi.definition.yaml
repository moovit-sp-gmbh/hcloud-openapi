    SAMLResponse:
      properties:
        RelayState:
          type: string
          description: State value forwarded by the SAML IdP
        SAMLResponse:
          type: string
          description: >-
            Base64 URL encoded XML string containing the response as per the <a
            href="https://docs.oasis-open.org/security/saml/v2.0/saml-bindings-2.0-os.pdf">SAML
            2.0 HTTP POST binding (Section 3.5)</a>
      required:
        - RelayState
        - SAMLResponse
      example:
        RelayState: ac022b41-acfb-4129-8a69-c1ce0e992191
        SAMLResponse: PHNhbWxwOlJlc3BvbnNlPmV4YW1wbGU8L3NhbWxwOlJlc3BvbnNlPg==
    Scope:
      enum:
        - hcloud:full
        - idp:email:read
        - idp:user:read
        - idp:user:write
        - idp:user:delete
        - openid
        - idp:organization:read
        - idp:organization:write
        - idp:organization:delete
        - idp:organization:admin
        - high5:space:read
        - high5:space:execute
        - high5:space:write
        - high5:space:delete
        - fuse:space:read
        - fuse:space:execute
        - fuse:space:write
        - fuse:space:delete
      type: string
      description: >
        * hcloud:full - Full access to HCloud

        * idp:email:read - Access to email read operations

        * idp:user:read - Access to read operations of users

        * idp:user:write - Access to read and write operations of users

        * idp:user:delete - Access to read, write and delete operations of users

        * openid - Used for OAuth authentication requests. Used in the OpenID
        Connect protocol.

        * idp:organization:read - Access to read operations of organizations

        * idp:organization:write - Access to read and write operations of
        organizations

        * idp:organization:delete - Access to read, write and delete operations
        of organizations

        * idp:organization:admin - Access to read, write and delete operations
        of organizations and ability to manage its members

        * high5:space:read - Access to read operations of spaces

        * high5:space:execute - Access to the ability to start execution of
        streams of spaces

        * high5:space:write - Access to read and write operations of spaces

        * high5:space:delete - Access to read, write and delete operations of
        spaces

        * fuse:space:read - Access to read operations of spaces

        * fuse:space:execute - Access to the ability to start execution of
        streams of spaces

        * fuse:space:write - Access to read and write operations of spaces

        * fuse:space:delete - Access to read, write and delete operations of
        spaces
    Search:
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/SearchFilter'
          description: A list of filters
        sorting:
          $ref: '#/components/schemas/Sorting'
          description: The sorting definition
      example:
        filters:
          - type: DATE
            key: modifyDate
            comparator: less than
            value: 1681912446650
        sorting:
          direction: DESC
          fields:
            - name
            - company
    SearchFilterComparatorBoolean:
      enum:
        - is
        - is not
      type: string
      description: |
        * is - Boolean equals the specified boolean value
        * is not - Boolean does not equal the specified boolean value
    SearchFilterComparatorDate:
      enum:
        - is
        - is not
        - greater than
        - less than
        - greater than or equal
        - less than or equal
      type: string
      description: >
        * is - Date equals the specified date value

        * is not - Date does not equal the specified date value

        * greater than - Date is more recent than the specified date value

        * less than - Date is older than the specified date value

        * greater than or equal - Date is more recent or equal to the specified
        date value

        * less than or equal - Date is older than or equal to the specified date
        value
    SearchFilterComparatorNumber:
      enum:
        - is
        - is not
        - greater than
        - less than
        - greater than or equal
        - less than or equal
      type: string
      description: >
        * is - Number equals the specified numeric value

        * is not - Number does not equal the specified numeric value

        * greater than - Number is greater than the specified numeric value

        * less than - Number is less than the specified numeric value

        * greater than or equal - Number is greater than or equal to the
        specified numeric value

        * less than or equal - Number is less than or equal to the specified
        numeric value
    SearchFilterComparatorString:
      enum:
        - is
        - is not
        - starts with
        - ends with
        - contains
      type: string
      description: |
        * is - String equals the specified string value
        * is not - String does not equal the specified string value
        * starts with - String starts with the specified string value
        * ends with - String ends with the specified string value
        * contains - String contains the specified string value
    SearchFilterType:
      enum:
        - STRING
        - SELECT
        - MULTISELECT
        - TYPEAHEAD
        - NUMBER
        - DATE
        - BOOLEAN
      type: string
      description: |
        * STRING - Filter by a string value
        * SELECT - Filter by a value from a set of possible choices
        * MULTISELECT - Filter by multiple values from a set of possible choices
        * TYPEAHEAD - Filter by ???
        * NUMBER - Filter by a numeric value
        * DATE - Filter by a Date value
        * BOOLEAN - Filter by a boolean flag
    SortDirection:
      enum:
        - ASC
        - DESC
      type: string
      description: |
        * ASC - Ascending order (lowest to highest)
        * DESC - Descending order (highest to lowest)
    Sorting:
      properties:
        direction:
          $ref: '#/components/schemas/SortDirection'
        fields:
          type: array
          items:
            type: string
          description: The fields to consider when performing the sorting of the result.
      example:
        direction: ASC
        fields:
          - name
          - createDate
    TeamCreateDto:
      properties:
        name:
          type: string
          description: Name of the team - must be unique within an organization
        userIds:
          type: array
          items:
            type: string
          description: Array of user database IDs that should be part of the team
      required:
        - name
        - userIds
      example:
        name: DEVS_Team
        userIds:
          - 63c7e64ff912d31ffa27a5b4
          - 63c7e64ff912d31ffa27a5d4
    TeamDto:
      properties:
        _id:
          type: string
          description: ID of the Team
        name:
          type: string
          description: Name of the team - must be unique within an organization
        organization:
          $ref: '#/components/schemas/ReducedOrganization'
          description: Organization the team belongs to
        membersSample:
          type: array
          items:
            $ref: '#/components/schemas/ReducedUser'
          description: >-
            Optional array holding a sample of team members (used for preview
            purposes). Number of returned members depends on query parameter
            'membersLimit'
        totalMemberCount:
          type: number
          description: >-
            Total count of team members. Will only be set if query parameter
            'membersLimit' is set to a value different from 0
        avatarUrl:
          type: string
          description: URL of the avatar
        createDate:
          type: number
          description: Creation date of the team
        modifyDate:
          type: number
          description: Date of last database entry modification
        creator:
          $ref: '#/components/schemas/ReducedUser'
          description: Creator of the team
      required:
        - _id
        - name
        - organization
        - avatarUrl
        - createDate
        - modifyDate
      example:
        _id: 63ca7c7683160ed3ad9162ff
        name: DEVS_Team
        organization:
          _id: 6284c915f173f39d71bb8b83
          name: Helmut Mc Cloud
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        membersSample:
          - _id: 63c7e64ff912d31ffa27a5b4
            name: Mr Ben Dover
            avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
          - _id: 63c7e64ff912d31ffa27a5d4
            name: Hugh Janus
            avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        totalMemberCount: 10
        avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        createDate: 1660922024145
        modifyDate: 1660922024145
        creator:
          _id: 6284c915f173f39d71bb8b83
          name: Helmut Mc Cloud
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
    TeamMemberDto:
      properties:
        _id:
          type: string
          description: ID of the user
        email:
          type: string
          description: Email of the user
        name:
          type: string
          description: Name of the user
        avatarUrl:
          type: string
          description: Avatar URL of the user
      required:
        - _id
        - email
        - name
        - avatarUrl
      example:
        _id: 6284c915f173f39d71bb8b83
        email: hmc@helmut.cloud
        name: Helmut Mc Cloud
        avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
    TeamPatchDto:
      properties:
        name:
          type: string
          description: Name of the team - must be unique within an organization
        userIds:
          type: array
          items:
            type: string
          description: Array of user database IDs that should be part of the team
        usersOperation:
          $ref: '#/components/schemas/UsersOperation'
          description: >-
            Define which operation should be performed with the provided users
            array on the existing users array
      example:
        name: DEVS_Team
        userIds:
          - 63c7e64ff912d31ffa27a5b4
          - 63c7e64ff912d31ffa27a5d4
        usersOperation: ADD
    Theme:
      enum:
        - DARK
        - LIGHT
        - DARK_HIGH_CONTRAST
        - LIGHT_HIGH_CONTRAST
        - SYSTEM_DEFAULT
      type: string
      description: |
        * DARK - Dark mode theme.
        * LIGHT - Light mode theme.
        * DARK_HIGH_CONTRAST - Dark mode theme with high contrast.
        * LIGHT_HIGH_CONTRAST - Light mode theme with high contrast.
        * SYSTEM_DEFAULT - Use the system's default theme.
    TokenPrefix:
      enum:
        - hlmc_p_
        - hlmc_o_
      type: string
      description: |
        * hlmc_p_ - Signals that the token is a personal access token.
        * hlmc_o_ - Signals that the token is an OAuth access token.
