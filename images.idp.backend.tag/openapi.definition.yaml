        name:
          type: string
          description: Full name of the user
          example: John Doe
        email:
          type: string
          format: email
          description: Email address of the user
          example: john.doe@example.com
        avatarUrl:
          type: string
          format: uri
          description: URL to the user's avatar image
          example: https://example.com/avatar.webp
        isGuest:
