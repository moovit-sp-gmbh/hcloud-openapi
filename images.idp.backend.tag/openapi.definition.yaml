        token:
          type: string
          description: TOTP token. Must be defined if the user has 2FA enabled.
      required:
        - name
        - scopes
      example:
        name: private auth token
        expiration: 1668415213314
        scopes:
          - high5:space:read
          - high5:space:execute
    PatDto:
      properties:
        _id:
          type: string
          description: ID of the PAT
        name:
          type: string
          description: Name of the PAT
        expiration:
          type: number
          description: Expiration as unix timestamp or no expiration if missing
        createDate:
          type: number
          description: Date of creation as unix timestamp
        modifyDate:
          type: number
          description: Date of last modification as unix timestamp
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          description: Set of scopes the user of the PAT is allowed to access
        type:
          $ref: '#/components/schemas/TokenPrefix'
          description: Describes the type of the token, e.g. PAT or OAUTH
        user:
          $ref: '#/components/schemas/ReducedUser'
          description: User the PAT belongs to
      required:
        - _id
        - name
        - scopes
        - type
        - user
