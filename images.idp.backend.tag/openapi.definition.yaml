    OrganizationDto:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
          description: ID of the organization
          example: 62a17641614a64c2974c9481
        name:
          type: string
          description: Name of the organization
          example: Devs
        creator:
          $ref: '#/components/schemas/ReducedUser'
        company:
          type: string
          description: Company the organization belongs to
          example: Moovit SP
        isUserOrganization:
          type: boolean
          description: Defines if it's a user organization
          example: false
        createDate:
          type: number
          description: Creation date of the organization
          example: 1660922024145
        modifyDate:
          type: number
          description: Date of last database entry modification
          example: 1765432168438
        roleOfUser:
          allOf:
            - $ref: '#/components/schemas/OrganizationRole'
            - description: >-
                * MEMBER - Standard member of an organization

                * MANAGER - Member of an organization that has the ability to
                manage certain aspects of the organization's members

                * ADMIN - Member of an organization that has the ability to
                manage all aspects of the organization's members

                * OWNER - Member of an organization that has the ability to
                manage all aspects of the organization's members. Only this
                member can delete the organization
        executionTarget:
          type: boolean
          description: >-
            Whether or not the current request user is set as an executionTarget
            in this organization
          example: false
        avatarUrl:
          type: string
          format: uri
          description: Url of the avatar
          example: https://app.helmut.cloud/asset/no_avatar.webp
        membersSample:
          type: array
          items:
            $ref: '#/components/schemas/ReducedUser'
          description: >-
            Array holding a limited number of organization members (used for
            preview purposes)
