    SAMLResponse:
      type: object
      properties:
        RelayState:
          type: string
          minLength: 24
          maxLength: 24
          format: hexadecimal
          description: State value forwarded by the SAML IdP
          example: 8164031fd36f1412ecc7a8e5
        SAMLResponse:
          type: string
          description: >-
            Base64 URL encoded XML string containing the response as per the <a
            href="https://docs.oasis-open.org/security/saml/v2.0/saml-bindings-2.0-os.pdf">SAML
            2.0 HTTP POST binding (Section 3.5)</a>
          example: PHNhbWxwOlJlc3BvbnNlPmV4YW1wbGU8L3NhbWxwOlJlc3BvbnNlPg==
      required:
        - RelayState
        - SAMLResponse
      description: Payload containing RelayState and Base64-encoded SAML response
      example:
        RelayState: 8164031fd36f1412ecc7a8e5
        SAMLResponse: PHNhbWxwOlJlc3BvbnNlPmV4YW1wbGU8L3NhbWxwOlJlc3BvbnNlPg==
    ServiceAccountCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
          pattern: ^(?!-)(?!.*--)[\p{L}\p{M}0-9_. -]{3,255}(?<!-)$
          description: Service account name
          example: ci-worker
      required:
        - name
      description: Payload for creating a new service account
      example:
        name: ci-worker
    High5SpacePermission:
      type: string
      enum:
        - NONE
        - READ
        - EXECUTE
        - WRITE
        - MANAGE
        - OWNER
      description: The permission the user has within the space
      example: OWNER
    ServiceAccountPatchPermissionDto:
      type: object
      properties:
        permission:
          $ref: '#/components/schemas/High5SpacePermission'
      required:
        - permission
      description: Users permissions within the space
      example:
        permission: OWNER
    TeamCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
          description: >-
            Name of the team (only alphanumeric characters, hyphens and dots are
            allowed; it should contain between 3 and 64 characters)
          example: Research-and-development-department.1
        userIds:
          type: array
          items:
            type: string
            minLength: 24
            maxLength: 24
            format: hexadecimal
          maxItems: 1000
          description: Array of user database IDs that should be part of the team
          example:
            - 761b2de208337dc792b65f93
            - 385b2de208337dc792b65f38
            - 97ab2de208337dc792b65f11
      required:
        - name
        - userIds
      description: Payload for creating a new team with a name and list of user IDs
      example:
        name: Devs_Team
        userIds:
          - 761b2de208337dc792b65f93
          - 385b2de208337dc792b65f38
          - 97ab2de208337dc792b65f11
    TeamMembersSearchDto:
      type: object
      properties:
        teamIds:
          type: array
          items:
            type: string
            minLength: 24
            maxLength: 24
            format: hexadecimal
          minItems: 1
          description: List of team IDs to search members across
          example:
            - 761b2de208337dc792b65f93
            - 385b2de208337dc792b65f38
        name:
          type: string
          minLength: 1
          description: >-
            Name search query — returns members whose name contains this string
            (case-insensitive)
          example: john
      required:
        - teamIds
        - name
      description: Payload for searching members by name across a set of teams
      example:
        teamIds:
          - 761b2de208337dc792b65f93
          - 385b2de208337dc792b65f38
        name: john
    UsersOperation:
      type: string
      enum:
        - ADD
        - REMOVE
        - SET
      description: >-
        Define which operation should be performed with the provided users array
        on the existing users array
      example: ADD
    TeamPatchDto:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
          description: >-
            Name of the team (only alphanumeric characters, hyphens and dots are
            allowed; it should contain between 3 and 64 characters)
          example: Research-and-development-department.1
        userIds:
          type: array
          items:
            type: string
            minLength: 24
            maxLength: 24
            format: hexadecimal
          minItems: 1
          maxItems: 1000
          description: Array of user database IDs that should be part of the team
          example:
            - 761b2de208337dc792b65f93
            - 385b2de208337dc792b65f38
            - 97ab2de208337dc792b65f11
        usersOperation:
          $ref: '#/components/schemas/UsersOperation'
      description: >-
        Payload for updating a team, including optional name, user list, and
        operation type
      example:
        name: Devs_Team
        userIds:
          - 761b2de208337dc792b65f93
          - 385b2de208337dc792b65f38
          - 97ab2de208337dc792b65f11
        usersOperation: ADD
    TeamResolveDto:
      type: object
      properties:
        teamIds:
          type: array
          items:
            type: string
            minLength: 24
            maxLength: 24
            format: hexadecimal
          minItems: 1
          description: List of team IDs to be resolved
          example:
            - 761b2de208337dc792b65f93
            - 385b2de208337dc792b65f38
            - 97ab2de208337dc792b65f11
        organizationId:
          type: string
          minLength: 24
          maxLength: 24
          format: hexadecimal
          description: >-
            ID of an organization. Will not resolve teams that are not part of
            this organization. In essence, guarantees that all teams are of the
            same organization.
          example: 563b2de208337dc792b65dc2
      required:
        - teamIds
      description: >-
        Payload for resolving teams by their IDs, optionally scoped to a
        specific organization
      example:
        teamIds:
          - 761b2de208337dc792b65f93
          - 385b2de208337dc792b65f38
          - 97ab2de208337dc792b65f11
        organizationId: 563b2de208337dc792b65dc2
    UserTotpDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the user
          example: hmc@helmut.cloud
        token:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
          description: Token to match against a TOTP secret if 2FA is enabled
          example: '467932'
      required:
        - email
        - token
      description: Payload for verifying a TOTP token during 2FA authentication
      example:
        email: hmc@helmut.cloud
        token: '467932'
    UserTotpRecoverCodeDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the user
          example: hmc@helmut.cloud
        password:
          type: string
          minLength: 8
          maxLength: 255
          pattern: ^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,255}$
          description: >-
            Password of the user (only alphanumeric, underscores, hyphens, dots
            and special characters are allowed; it should contain between 8 and
            255 characters)
          example: MySuperSecurePassword123!
        code:
          type: string
          format: uuid
          description: Code to match against the TOTP recoverCodes
          example: e5065bc6-14f5-43cf-a13b-7970d4aa9630
      required:
        - email
        - password
        - code
      description: >-
        Payload for verifying a TOTP recovery code using email, password, and
        recovery UUID
      example:
        email: hmc@helmut.cloud
        password: Anewpassword!123
        code: e5065bc6-14f5-43cf-a13b-7970d4aa9630
    UserTotpTokenDto:
      type: object
      properties:
        token:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
          description: Token to match against a TOTP secret
          example: '462810'
      required:
        - token
      description: Payload for verifying a TOTP token
      example:
        token: '462810'
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the user that forgot their password
          example: hmc@helmut.cloud
        captcha:
          type: string
          minLength: 1
          description: Valid google reCAPTCHAV2
          example: D6vS8kM
        targetUrl:
          type: string
          format: uri
          description: >-
            URL create the redirect link in the email. It will default to
            https://app.helmut.cloud
          example: app.helmut.cloud
      required:
        - email
        - captcha
      description: >-
        Payload for requesting a password reset, including user email, CAPTCHA
        token, and optional target URL
      example:
        email: hmc@helmut.cloud
        captcha: D6vS8kM
        targetUrl: https://app.helmut.cloud
    Views:
      type: string
      enum:
        - save_last_view
        - /account
        - /high5
        - /cosmo
      description: Last view the user was in
      example: /account
    GeneralSettingsLastVisitPatchDto:
      type: object
      properties:
        lastUrl:
          type: string
          minLength: 1
          maxLength: 2048
          description: Last URL visited by the user
          example: /account/settings
        lastView:
          $ref: '#/components/schemas/Views'
      description: >-
        Payload for updating the user's last visited URL and view in general
        settings
      example:
        lastUrl: /account/settings
        lastView: /account
    Language:
      type: string
