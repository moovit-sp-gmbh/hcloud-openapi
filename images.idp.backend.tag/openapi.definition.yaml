                  $ref: '#/components/examples/BasicAuthDisabledInFavorOf2FAException'
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UserNotFoundException:
                  $ref: '#/components/examples/UserNotFoundException'
        default:
          description: Unexpected error
    delete:
      tags:
        - User.Settings.TOTP
      summary: Delete a user TOTP
      security:
        - BearerAuth: []
        - BasicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTotpTokenDto'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InvalidBodyException:
                  $ref: '#/components/examples/InvalidBodyException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                PatExpiredException:
                  $ref: '#/components/examples/PatExpiredException'
                  summary: The token has expired
                TokenExpiredException:
                  $ref: '#/components/examples/TokenExpiredException'
                  summary: The token has expired
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                SessionExpiredException:
                  $ref: '#/components/examples/SessionExpiredException'
                  summary: The user session has expired
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: User TOTP verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UserTotpInvalidException:
                  $ref: '#/components/examples/UserTotpInvalidException'
                BasicAuthDisabledInFavorOf2FAException:
                  $ref: '#/components/examples/BasicAuthDisabledInFavorOf2FAException'
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UserTotpNotFoundException:
                  $ref: '#/components/examples/UserTotpNotFoundException'
                UserNotFoundException:
                  $ref: '#/components/examples/UserNotFoundException'
        default:
          description: Unexpected error
  /v1/user/settings/security/2fa/totp/activate:
    patch:
      tags:
        - User.Settings.TOTP
      summary: Activate a user TOTP
      description: |-

        Required scopes: IDP_USER_DELETE
      security:
        - BearerAuth: []
        - BasicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTotpTokenDto'
        required: true
      responses:
        '200':
          description: Object holding the activated user TOTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpActivatedDto'
        '400':
          description: User TOTP already exist or invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UserTotpAlreadyExistsException:
                  $ref: '#/components/examples/UserTotpAlreadyExistsException'
                InvalidBodyException:
                  $ref: '#/components/examples/InvalidBodyException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                PatExpiredException:
                  $ref: '#/components/examples/PatExpiredException'
                  summary: The token has expired
                TokenExpiredException:
                  $ref: '#/components/examples/TokenExpiredException'
                  summary: The token has expired
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                SessionExpiredException:
                  $ref: '#/components/examples/SessionExpiredException'
                  summary: The user session has expired
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: User TOTP verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UserTotpInvalidException:
                  $ref: '#/components/examples/UserTotpInvalidException'
                BasicAuthDisabledInFavorOf2FAException:
                  $ref: '#/components/examples/BasicAuthDisabledInFavorOf2FAException'
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
        '404':
          description: User TOTP not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UserTotpNotFoundException:
                  $ref: '#/components/examples/UserTotpNotFoundException'
        default:
          description: Unexpected error
  /v1/user/settings/security/2fa/totp/recover:
    delete:
      tags:
        - User.Settings.TOTP
      summary: Delete a user TOTP by using a recover code
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTotpRecoverCodeDto'
        required: true
      responses:
        '204':
