          in: query
        - schema:
            type: boolean
            description: >-
              If true, an additional property holding the total member count of
              the organization will be returned
          required: false
          name: totalMemberCount
          in: query
        - schema:
            type: number
            minimum: 1
            maximum: 100
            default: 25
            description: >-
              If set, an additional property holding a sample of members will be
              returned. The provided number represents the max. size of the
              sample
          required: false
          name: membersSample
          in: query
        - schema:
            type: boolean
            description: >-
              If set, an additional property holding the organization's license
              will be included
          required: false
          name: license
          in: query
        - schema:
            type: string
            minLength: 24
            maxLength: 24
            format: hexadecimal
