  /v1/org/{orgName}/settings/domains/{domainName}/saml:
    post:
      description: >-
        Creates a new provider for the specified domain in an organization

        There are multiple ways the process can fail besides
        authentication/authorization:

        - The domain is not verified

        - The certificates sent are invalid

        - There is already an IdP associated with this organization and domain


        Required organization role: ADMIN
      summary: Creates a new provider for the specified domain in an organization
      tags:
        - Organization.Settings.Domains.SAML
      parameters:
        - schema:
            anyOf:
              - type: string
                minLength: 3
                maxLength: 64
                pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
                description: >-
                  Name of the organization (only alphanumeric characters,
                  hyphens and dots are allowed; it should contain between 3 and
                  64 characters)
                example: MoovIT-Software-Products-GmbH
              - type: string
                minLength: 3
                maxLength: 255
                pattern: ^[\p{L}\p{M}0-9_+@.-]{3,255}$
                description: >-
                  Name of the user's private organization, allowed everything
                  defined in the RFC for the email specification (it should
                  contain between 3 and 255 characters)
                example: hmc@helmut.cloud
          required: true
          name: orgName
          in: path
        - schema:
            type: string
            pattern: >-
              ^(?=.{1,253}$)(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\.(?!-)[A-Za-z0-9-]{1,63}(?<!-))*\.[A-Za-z]{2,}$
          required: true
          name: domainName
          in: path
      requestBody:
        required: true
        description: >-
          Important note regarding the example request body shown below:
          Provider data must be send as multipart/form-data with the
          certificates as files, not strings!
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SAMLProviderCreateDto'
      responses:
        '201':
          description: Created SAMLProvider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAMLProviderDto'
        '400':
          description: >-
            Failed to validate 'path' parameter 'orgName' | Failed to validate
            'path' parameter 'domainName' | No certificates found in the request
            | The certificate sent is invalid. | Cannot link SAML provider to an
            unverified domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Failed to validate 'path' parameter 'orgName':
                  summary: Failed to validate 'path' parameter 'orgName'
                  description: Failed to validate 'path' parameter 'orgName' - {error}
                  value:
                    code: 001.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'path' parameter 'orgName' - {error}
                Failed to validate 'path' parameter 'domainName':
                  summary: Failed to validate 'path' parameter 'domainName'
                  description: Failed to validate 'path' parameter 'domainName' - {error}
                  value:
                    code: 001.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'path' parameter 'domainName' - {error}
                No certificates found in the request:
                  summary: No certificates found in the request
                  value:
                    code: 001.000.0004
                    error: invalid.body
                    message: No certificates found in the request
                The certificate sent is invalid.:
                  summary: The certificate sent is invalid.
                  value:
                    code: 001.022.0001
                    error: saml.invalid.certificate
                    message: The certificate sent is invalid.
                Cannot link SAML provider to an unverified domain.:
                  summary: Cannot link SAML provider to an unverified domain.
                  value:
                    code: 001.022.0004
                    error: saml.unverified.domain
                    message: Cannot link SAML provider to an unverified domain.
        '404':
