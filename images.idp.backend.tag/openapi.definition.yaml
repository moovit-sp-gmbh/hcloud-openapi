      summary: Creates a new provider for the specified domain in an organization
      description: >-
        Creates a new provider for the specified domain in an organization.

        There are multiple ways the process can fail besides
        authentication/authorization:

        - The domain is not verified

        - The certificates sent are invalid

        - There is already an IdP associated with this organization and domain


        Required organization role: ADMIN
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the organization
          required: true
          schema:
            type: string
        - name: domainName
          in: path
          description: Name of the domain
          required: true
          schema:
            type: string
      requestBody:
        description: >-
          Important note regarding the example request body shown below:
          Provider data must be send as multipart/form-data with the
          certificates as files, not strings!
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SAMLProviderCreateDto'
      responses:
        '201':
          description: Created SAMLProvider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAMLProviderDto'
        '400':
          description: Invalid Certificate or unverified domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                SAMLInvalidCertificateException:
                  $ref: '#/components/examples/SAMLInvalidCertificateException'
                SAMLUnverifiedDomainException:
                  $ref: '#/components/examples/SAMLUnverifiedDomainException'
        '401':
          description: Not Authorized exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
        '404':
          description: User/Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                UserNotFoundException:
                  $ref: '#/components/examples/UserNotFoundException'
                OrganizationNotFoundException:
                  $ref: '#/components/examples/OrganizationNotFoundException'
        default:
          description: Unexpected error
    put:
      tags:
        - Organization.Settings.Domains.SAML
      summary: >-
        Overwrites the previous provider for the specified domain in an
        organization
      description: |-

        Required organization role: ADMIN
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the organization
          required: true
          schema:
            type: string
        - name: domainName
          in: path
          description: Name of the domain
          required: true
          schema:
            type: string
      requestBody:
        description: >-
