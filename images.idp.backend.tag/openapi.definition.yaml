        password:
          type: string
          minLength: 8
          pattern: /^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$/
          description: Password of the user
          example: 123&/(Password
        token:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
          description: Token to match against a TOTP secret if 2FA is enabled
