          description: Quota assigned to this license
        creator:
          $ref: '#/components/schemas/ReducedUser'
          description: Creator of the license
        contact:
          $ref: '#/components/schemas/ReducedUser'
          description: Contact for the license
        expireDate:
          type: number
          description: Expiry date of the license
        createDate:
          type: number
          description: Creation date of the license
      required:
        - tier
        - type
        - quota
        - expireDate
        - createDate
      example:
        tier: FREE
        type: PRODUCTION
        quota:
          idp:
            organization:
              members:
                quota: 2
              agents:
                quota: 1
              teams:
                quota: 1
              domains:
                quota: 0
              logPeriodInDays: 30
          high5:
            spaces:
              quota: 1
              catalogs:
                quota: -1
              customCatalogs:
                quota: 0
              customNodes:
                quota: 1
              webhooks:
                quota: 1
                logs:
                  quota: 10
              secrets:
                quota: 1
              events:
                quota: 1
                streams:
                  quota: 1
            executionsPerMonth:
              quota: 150
          fuse:
            spaces:
              quota: 1
              jobs:
                quota: 1
                logs:
                  quota: 10
            secondBaseExecutions: false
        expireDate: -1
        createDate: 1706191554
    LicenseTier:
      enum:
        - FREE
        - PRO
        - ENTERPRISE
      type: string
      description: |
        * FREE - Free license
        * PRO - Professional license
        * ENTERPRISE - Enterprise license
    LicenseType:
      enum:
        - PRODUCTION
        - POC
        - THIRD_PARTY
      type: string
      description: |
        * PRODUCTION - Production license
        * POC - Proof of concept license
        * THIRD_PARTY - Third party license
    LicenseUpdateDto:
      properties:
        identifier:
          type: string
          description: Identifier of the license
      required:
        - identifier
      example:
        identifier: 201fd106-f0b0-4ae8-beb1-94ca0d765c82
    LoginPath:
      enum:
        - LOGIN
        - VERIFY_EMAIL
        - REGISTER
        - EXTERNAL
      type: string
      description: >
        * LOGIN - Proceed to login page. The user has an account and is
        verified.

        * VERIFY_EMAIL - Proceed to verification page. The user has an account,
        but the email has not been validated.

        * REGISTER - Proceed to register page. The user does not have an
        account.

        * EXTERNAL - Proceed to external page. The domain of the user's email is
        bound to a different authentication system.
    LoginPreDto:
      properties:
        path:
