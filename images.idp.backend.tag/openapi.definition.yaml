    OrganizationRole:
      enum:
        - MEMBER
        - MANAGER
        - ADMIN
        - OWNER
      type: string
      description: >
        * MEMBER - Standard member of an organization.

        * MANAGER - Member of an organization that has the ability to manage
        certain aspects of the organization's members.

        * ADMIN - Member of an organization that has the ability to manage all
        aspects of the organization's members.

        * OWNER - Member of an organization that has the ability to manage all
        aspects of the organization's members. Only this member can delete the
        organization.
