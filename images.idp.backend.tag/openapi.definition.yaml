openapi: 3.0.0
info:
  title: hcloud - IdP
  description: >-
    The Identity Provider (IdP) handles everything around user entities in the
    helmut cloud. Registration, Authentication, User related preference
    management are performed within this application
  version: 1.0.0
  contact:
    name: MoovIT Software Products GmbH
    url: https://www.moovit-sp.com
    email: info@moovit-sp.com
servers:
  - url: https://eu-central-1.helmut.cloud/api/account
    description: EU-Central production server
  - url: https://na-west-1.helmut.cloud/api/account
    description: NA-West production server
  - url: https://eu-dev-1.app.helmut.cloud/api/account
    description: EU development server
  - url: http://localhost/api/account
    description: Localhost
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    patAuth:
      type: http
      scheme: bearer
      bearerFormat: PAT
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CustomError:
      type: object
      properties:
        error:
          type: string
          description: Error name
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
      required:
        - error
        - code
        - message
      description: API errors obey this shape
    DomainCreateDto:
      type: object
      properties:
        name:
          type: string
          pattern: >-
            ^(?=.{1,253}$)(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\.(?!-)[A-Za-z0-9-]{1,63}(?<!-))*\.[A-Za-z]{2,}$
          description: Fully qualified domain name
          example: example.helmut.cloud
      required:
        - name
      description: Object containing a fully qualified domain name
      example:
        name: example.helmut.cloud
    GuestCreateDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the guest
          example: john.doe@helmut.cloud
        hmac:
          type: string
          description: Url-safe base64 representation of the HMAC of the email address
          example: am9obi5kb2VAaGVsbXV0LmNsb3Vk
        name:
          type: string
          minLength: 1
          description: Name of the guest account
          example: John Doe
      required:
        - email
        - hmac
        - name
      description: Represents the data required to register a new guest user
      example:
        email: john.doe@helmut.cloud
        hmac: am9obi5kb2VAaGVsbXV0LmNsb3Vk
        name: John Doe
    GuestLoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the guest
          example: john.doe@helmut.cloud
        hmac:
          type: string
          description: Url-safe base64 representation of the HMAC of the email address
          example: am9obi5kb2VAaGVsbXV0LmNsb3Vk
      required:
        - email
        - hmac
      description: Contains credentials required for guest login
      example:
        email: john.doe@helmut.cloud
        hmac: am9obi5kb2VAaGVsbXV0LmNsb3Vk
    RecipientType:
      type: string
      enum:
        - USER
        - TEAM
        - ORGANIZATION
      default: USER
      description: Message recipient type (single user or group of users)
      example: USER
    MessageCreateDto:
      type: object
      properties:
        to:
          type: string
          description: >-
            Specifies the recipient of the message. Depending on the selected
            recipient type, this field may contain an individual’s email
            address, a team name, or an organization name
          example: john.doe@helmut.cloud
        recipient:
          $ref: '#/components/schemas/RecipientType'
        orgName:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
          description: >-
            Optional name of the organization (should be specified only when
            sending message to team members)
          example: Devs
        title:
          type: string
          maxLength: 255
          description: Optional title of the message
          example: Welcome to the team!
        subject:
          type: string
          maxLength: 255
          description: Optional subject of the message
          example: Your onboarding details
        message:
          type: string
          maxLength: 5000
          description: Content of the message
          example: Hello and welcome to our platform...
        link:
          type: string
          description: Optional link related to a referenced ressource
          example: Broadcasters1
      required:
        - to
        - message
      description: >-
        The input structure for sending a message to a user, team, or
        organization.
      example:
        to: john.doe@helmut.cloud
        recipient: USER
        title: Welcome
        subject: Getting Started
        message: Hello and welcome to our platform!
        link: Broadcasters1
    MessagePatchDto:
      type: object
      properties:
        read:
          type: boolean
          description: Indicates whether the message has been read
          example: true
      required:
        - read
      description: DTO for patching message read status
      example:
        read: true
    OAuthAppCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
          description: Name of the OAuthApp
          example: SevTest
        description:
          type: string
          maxLength: 255
          description: Optional description of the OAuthApp
          example: A test OAuthApp
        homepage:
          type: string
          format: uri
          description: Optional homepage URL for the OAuthApp
          example: https://github.com/
        callback:
          type: array
          items:
            type: string
          description: Callback URI for the OAuthApp
          example:
            - https://openidconnect.net/callback
      required:
        - name
        - callback
      description: The input structure for creating a new OAuth application.
      example:
        name: SevTest
        description: A test OAuthApp
        homepage: https://github.com/
        callback:
          - https://openidconnect.net/callback
    OAuthDeviceAuthorizationRequestDto:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
          description: HcloudClientId of the OAuth app
          example: 30ed05e3-4065-4c2c-b537-e4c411854b6f
        scope:
          type: string
          description: Scope that the access token should be granted
          example: profile email
      required:
        - client_id
      description: OAuth request for device authorization
      example:
        client_id: 30ed05e3-4065-4c2c-b537-e4c411854b6f
        scope: profile email
    OAuthDeviceDecisionStatus:
      type: string
      enum:
        - APPROVED
        - REJECTED
      description: Status to set
      example: APPROVED
    OAuthDeviceDecisionDto:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/OAuthDeviceDecisionStatus'
      required:
        - status
      description: OAuth Device Decision Status
    OAuthDeviceTokenRequestDto:
      type: object
      properties:
        grant_type:
          type: string
          enum:
            - urn:ietf:params:oauth:grant-type:device_code
          description: Device flow grant type
          example: urn:ietf:params:oauth:grant-type:device_code
        client_id:
          type: string
          description: HcloudClientId of the OAuth app
        device_code:
          type: string
          description: Device code generated in the authorization request.
      required:
        - grant_type
        - client_id
        - device_code
      description: OAuth device token request object
    OAuthSecretCreateDto:
      type: object
      properties:
        secretName:
          type: string
          maxLength: 255
          pattern: ^[\w\-.]+$
          description: Name of the new secret
          example: default
      required:
        - secretName
      description: The input structure for creating a new OAuth secret.
      example:
        secretName: default
    GrantType:
      type: string
      enum:
        - authorization_code
        - refresh_token
      description: Type of authorization grant.
      example: authorization_code
    OAuthTokenRequestDto:
      type: object
      properties:
        grant_type:
          $ref: '#/components/schemas/GrantType'
        code:
          type: string
          description: >-
            Code from the OAuth code grant. Will be ignored if the grant type is
            not authorization_code
          example: 32f63f0b8033d77d31b5a4eb77db9c30
        refresh_token:
          type: string
          description: >-
            RefreshToken from the OAuth token grant. Required in the
            refresh_token grant and ignored in the authorization_code grant
          example: some-refresh-token
        client_id:
          type: string
          description: HcloudClientId of the OAuth app
          example: 30ed05e3-4065-4c2c-b537-e4c411854b6f
        client_secret:
          type: string
          description: Client secret of the OAuth app
          example: >-
            secret_a976faeab2af78f3036ab3cd3773d28346d0d26aaec02f81699c4f1847148bc6
        redirect_uri:
          type: string
          description: >-
            Callback URI of the OAuth app. If a redirect_uri was sent in the
            authorization phase, then it must be sent again. Optional for the
            authorization_code grant and ignored in the refresh_token grant
          example: https://yourredirect.url
        scope:
          type: string
          description: >-
            Scope that the access token should be granted. Optional for the
            refresh_token grant and ignored in the authorization_code grant. The
            requested scope MUST NOT include any scope not originally granted,
            and if omitted is treated as equal to the scope originally granted
          example: hcloud:full
      required:
        - grant_type
        - client_id
        - client_secret
      description: >-
        The input structure for requesting an OAuth access token using either
        authorization_code or refresh_token grant.
      example:
        grant_type: authorization_code
        code: 32f63f0b8033d77d31b5a4eb77db9c30
        client_id: 30ed05e3-4065-4c2c-b537-e4c411854b6f
        client_secret: >-
          secret_a976faeab2af78f3036ab3cd3773d28346d0d26aaec02f81699c4f1847148bc6
        redirect_uri: https://yourredirect.url
    OrganizationCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
          description: >-
            Name of the organization (only alphanumeric characters, hyphens and
            dots are allowed; it should contain between 3 and 64 characters)
          example: MoovIT-Software-Products-GmbH
        company:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[\w-. ]{1,255}$
          description: >-
            Name of the company the organization belongs to (only alphanumeric
            characters, underscores, hyphens, dots and spaces are allowed; it
            should contain between 1 and 255 characters)
          example: Moovit SP
      required:
        - name
      description: The input structure for creating a new organization
      example:
        name: Devs
        company: Moovit SP
    OrganizationPatchDto:
      type: object
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[\w-. ]{1,255}$
          description: >-
            Name of the company the organization belongs to (only alphanumeric
            characters, underscores, hyphens, dots and spaces are allowed; it
            should contain between 1 and 255 characters)
          example: Moovit SP
      required:
        - company
      description: The input structure for updating organization
      example:
        company: Moovit SP
    LicenseUpdateDto:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 64
          description: Identifier of the license
          example: 201fd106-f0b0-4ae8-beb1-94ca0d765c82
      required:
        - identifier
      description: The input structure for updating a license identifier
      example:
        identifier: 201fd106-f0b0-4ae8-beb1-94ca0d765c82
    OrgMemberExecutionTargetPatchDto:
      type: object
      properties:
        executionTarget:
          type: boolean
          description: >-
            Boolean flag that determines if this user can be an execution target
            for this organization.
          example: true
      required:
        - executionTarget
      description: >-
        The input structure for updating the execution target status of an
        organization member.
      example:
        executionTarget: true
    OrganizationRole:
      type: string
      enum:
        - MEMBER
        - MANAGER
        - ADMIN
        - OWNER
      description: Role the user shall have in the Organization
      example: MEMBER
    OrgMemberInvitationCreateDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email of the user
          example: hmc@helmut.cloud
        role:
          $ref: '#/components/schemas/OrganizationRole'
        allowNonRegisteredUsers:
          type: boolean
          description: >-
            If non-registered users are allowed and the email is not bound to an
            HCloud user, then a registration email will be sent to this email.
            Upon registration, the user will be added automatically to the
            organization.
          example: false
        targetUrl:
          type: string
          format: uri
          description: >-
            URL to create the redirect link in the email. It will default to
            https://app.helmut.cloud.
          example: https://app.helmut.cloud
      required:
        - email
        - role
      description: Request data for inviting a user to an organization
      example:
        email: hmc@helmut.cloud
        role: MEMBER
        allowNonRegisteredUsers: false
        targetUrl: https://app.helmut.cloud
    OrgMemberInvitationPatchDto:
      type: object
      properties:
        accept:
          type: boolean
          description: True to accept. False to reject
          example: true
      required:
        - accept
      description: >-
        The input structure for accepting or rejecting an organization
        invitation.
      example:
        accept: true
    OrgMemberInvitationsCreateDto:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/OrgMemberInvitationCreateDto'
          minItems: 1
      required:
        - users
      description: Request data for inviting a list of users to an organization
    OrgMemberPatchDto:
      type: object
      properties:
        role:
          allOf:
            - $ref: '#/components/schemas/OrganizationRole'
            - description: New role the member shall have in the Organization
              example: ADMIN
      required:
        - role
      description: The input structure for updating a member's role in the organization.
      example:
        role: ADMIN
    SearchFilterType:
      type: string
      enum:
        - STRING
        - SELECT
        - MULTISELECT
        - TYPEAHEAD
        - NUMBER
        - DATE
        - BOOLEAN
      description: |-
        * STRING - Filter by a string value
        * SELECT - Filter by a value from a set of possible choices
        * MULTISELECT - Filter by multiple values from a set of possible choices
        * TYPEAHEAD - Filter by ???
        * NUMBER - Filter by a numeric value
        * DATE - Filter by a Date value
        * BOOLEAN - Filter by a boolean flag
      example: NUMBER
    SearchFilterComparatorString:
      type: string
      enum:
        - is
        - is not
        - starts with
        - ends with
        - contains
      description: |-
        * is - String equals the specified string value
        * is not - String does not equal the specified string value
        * starts with - String starts with the specified string value
        * ends with - String ends with the specified string value
        * contains - String contains the specified string value
      example: starts with
    SearchFilterString:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchFilterType'
        key:
          type: string
          description: The search key
        comparator:
          $ref: '#/components/schemas/SearchFilterComparatorString'
        value:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
          description: The value searching for
      required:
        - type
        - key
        - comparator
        - value
      description: >-
        Filter for string-based fields, accepts a single string or an array of
        strings as the filter value
    SearchFilterSelect:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchFilterType'
        key:
          type: string
          description: The search key
        allowedValues:
          type: array
          items:
            type: string
        comparator:
          $ref: '#/components/schemas/SearchFilterComparatorString'
        value:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
          description: The value searching for
      required:
        - type
        - key
        - allowedValues
        - comparator
        - value
      description: >-
        Filter for fields with predefined selectable values, allows string
        comparators and accepts either a single value or multiple values from
        the allowed set
    SearchFilterMultiSelect:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchFilterType'
        key:
          type: string
          description: The search key
        allowedValues:
          type: array
          items:
            type: string
        comparator:
          $ref: '#/components/schemas/SearchFilterComparatorString'
        value:
          type: array
          items:
            type: string
          description: The value searching for
      required:
        - type
        - key
        - allowedValues
        - comparator
        - value
      description: >-
        Filter for fields that support multiple selections from a predefined
        list, accepts an array of strings and applies string-based comparators
    SearchFilterTypeahead:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchFilterType'
        key:
          type: string
          description: The search key
        allowedValues:
          type: array
          items:
            type: string
        comparator:
          $ref: '#/components/schemas/SearchFilterComparatorString'
        value:
          type: string
          description: The value searching for
      required:
        - type
        - key
        - allowedValues
        - comparator
        - value
      description: >-
        Filter designed for typeahead fields, accepts a single string value and
        applies string comparators against a list of allowed values
    SearchFilterComparatorNumber:
      type: string
      enum:
        - is
        - is not
        - greater than
        - less than
        - greater than or equal
        - less than or equal
      description: >-
        * is - Number equals the specified numeric value

        * is not - Number does not equal the specified numeric value

        * greater than - Number is greater than the specified numeric value

        * less than - Number is less than the specified numeric value

        * greater than or equal - Number is greater than or equal to the
        specified numeric value

        * less than or equal - Number is less than or equal to the specified
        numeric value
      example: greater than or equal
    SearchFilterNumber:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchFilterType'
        key:
          type: string
          description: The search key
        comparator:
          $ref: '#/components/schemas/SearchFilterComparatorNumber'
        value:
          type: number
          description: The value searching for
      required:
        - type
        - key
        - comparator
        - value
      description: Filter for numeric fields, accepts a single number as the filter value
    SearchFilterComparatorDate:
      type: string
      enum:
        - is
        - is not
        - greater than
        - less than
        - greater than or equal
        - less than or equal
      description: >-
        * is - Date equals the specified date value

        * is not - Date does not equal the specified date value

        * greater than - Date is more recent than the specified date value

        * less than - Date is older than the specified date value

        * greater than or equal - Date is more recent or equal to the specified
        date value

        * less than or equal - Date is older than or equal to the specified date
        value
      example: less than
    SearchFilterDate:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchFilterType'
        key:
          type: string
          description: The search key
        comparator:
          $ref: '#/components/schemas/SearchFilterComparatorDate'
        value:
          type: number
          description: The value searching for
      required:
        - type
        - key
        - comparator
        - value
      description: >-
        Filter for date or timestamp fields, uses date-based comparators and
        accepts a numeric value representing the date (e.g., Unix timestamp)
    SearchFilterComparatorBoolean:
      type: string
      enum:
        - is
        - is not
      description: |-
        * is - Boolean equals the specified boolean value
        * is not - Boolean does not equal the specified boolean value
      example: is not
    SearchFilterBoolean:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchFilterType'
        key:
          type: string
          description: The search key
        comparator:
          $ref: '#/components/schemas/SearchFilterComparatorBoolean'
        value:
          type: boolean
          description: The value searching for
      required:
        - type
        - key
        - comparator
        - value
      description: Filter for boolean fields, accepts a boolean value
    SearchFilter:
      anyOf:
        - $ref: '#/components/schemas/SearchFilterString'
        - $ref: '#/components/schemas/SearchFilterSelect'
        - $ref: '#/components/schemas/SearchFilterMultiSelect'
        - $ref: '#/components/schemas/SearchFilterTypeahead'
        - $ref: '#/components/schemas/SearchFilterNumber'
        - $ref: '#/components/schemas/SearchFilterDate'
        - $ref: '#/components/schemas/SearchFilterBoolean'
      description: Filter for searching
      example:
        type: STRING
        key: name
        comparator: starts with
        value: Editor-
    SortDirection:
      type: string
      enum:
        - ASC
        - DESC
      description: |-
        * ASC - Ascending order
        * DESC - Descending order
      example: DESC
    Sorting:
      type: object
      properties:
        direction:
          $ref: '#/components/schemas/SortDirection'
        fields:
          type: array
          items:
            type: string
            minLength: 1
          description: The fields to consider when performing the sorting of the result
      description: The sorting definition
      example:
        direction: DESC
        fields:
          - name
          - company
    Search:
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/SearchFilter'
          description: A list of filters
        sorting:
          $ref: '#/components/schemas/Sorting'
      description: >-
        Defines the search parameters used to query objects of various types.
        Includes optional filters for narrowing down results and a sorting
        definition to control the order of returned data
      example:
        filters:
          - type: DATE
            key: modifyDate
            comparator: less than
            value: 1681912446650
        sorting:
          direction: DESC
          fields:
            - name
            - company
    OrgMemberSearch:
      allOf:
        - $ref: '#/components/schemas/Search'
        - type: object
          properties:
            excludeTeamByName:
              type: string
              minLength: 3
              maxLength: 64
              pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
              description: Name of team whose members shall not be returned
              example: Dev-Ops
            excludeServiceAccounts:
              type: boolean
              description: Exclude service accounts from search result
              example: true
      description: >-
        Search input structure for querying organization members with filters,
        sorting, and exclusions.
      example:
        filters:
          - type: DATE
            key: modifyDate
            comparator: less than
            value: 1681912446650
        sorting:
          direction: DESC
          fields:
            - name
            - company
        excludeTeamByName: Dev-Ops
        excludeServiceAccounts: true
    Scope:
      type: string
      enum:
        - hcloud:full
        - idp:email:read
        - idp:user:read
        - idp:user:write
        - idp:user:delete
        - openid
        - idp:organization:read
        - idp:organization:write
        - idp:organization:delete
        - idp:organization:admin
        - high5:space:read
        - high5:space:execute
        - high5:space:write
        - high5:space:delete
        - fuse:space:read
        - fuse:space:execute
        - fuse:space:write
        - fuse:space:delete
        - cosmo:space:read
        - cosmo:space:write
        - cosmo:space:delete
      description: >-
        * hcloud:full - Full access to HCloud

        * idp:email:read - Access to email read operations

        * idp:user:read - Access to read operations of users

        * idp:user:write - Access to read and write operations of users

        * idp:user:delete - Access to read, write and delete operations of users

        * openid - Used for OAuth authentication requests. Used in the OpenID
        Connect protocol

        * idp:organization:read - Access to read operations of organizations

        * idp:organization:write - Access to read and write operations of
        organizations

        * idp:organization:delete - Access to read, write and delete operations
        of organizations

        * idp:organization:admin - Access to read, write and delete operations
        of organizations and ability to manage its members

        * high5:space:read - Access to read operations of spaces

        * high5:space:execute - Access to the ability to start execution of
        streams of spaces

        * high5:space:write - Access to read and write operations of spaces

        * high5:space:delete - Access to read, write and delete operations of
        spaces

        * fuse:space:read - Access to read operations of spaces

        * fuse:space:execute - Access to the ability to start execution of
        streams of spaces

        * fuse:space:write - Access to read and write operations of spaces

        * fuse:space:delete - Access to read, write and delete operations of
        spaces

        * cosmo:space:read - Access to read operations of spaces

        * cosmo:space:write - Access to read and write operations of spaces

        * cosmo:space:delete - Access to read, write and delete operations of
        spaces
      example: idp:organization:write
    PatCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[\w-. ]{1,64}$
          description: >-
            Name of the Personal Access Token (only alphanumeric characters,
            underscores, hyphens, dots and spaces are allowed; it should contain
            between 1 and 64 characters)
          example: Private auth token
        expiration:
          type: number
          description: Expiration as unix timestamp or no expiration if missing
          example: 1668415213314
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          minItems: 1
          description: Set of scopes the user of the PAT is allowed to access
          example:
            - high5:space:read
            - high5:space:execute
        token:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
          description: TOTP token. Must be defined if the user has 2FA enabled
          example: '451379'
      required:
        - name
        - scopes
      description: The required input structure for creating a Personal Access Token (PAT)
      example:
        name: private auth token
        expiration: 1668415213314
        scopes:
          - high5:space:read
          - high5:space:execute
        token: '451379'
    PatRegenerateDto:
      type: object
      properties:
        token:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
          description: TOTP token. Must be defined if the user has 2FA enabled
          example: '451379'
      description: The input structure for regenerating a Personal Access Token (PAT)
      example:
        token: '451379'
    PatUpdateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[\w-. ]{1,64}$
          description: >-
            Name of the Personal Access Token (only alphanumeric characters,
            underscores, hyphens, dots and spaces are allowed; it should contain
            between 1 and 64 characters)
          example: Private auth token
        expiration:
          type: number
          description: >-
            UNIX timestamp with new expiration. Use the value -1 to make the
            token never expire.
          example: -1
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          description: Set of scopes the user of the PAT is allowed to access
          example:
            - high5:space:read
            - high5:space:execute
        token:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
          description: TOTP token. Must be defined if the user has 2FA enabled.
          example: '451379'
      description: The input structure for updating an existing Personal Access Token (PAT)
      example:
        name: private token
        expiration: -1
        scopes:
          - high5:space:read
          - high5:space:execute
        token: '451379'
