        Simplified representation of an organization object used for referencing
        or displaying minimal organization details
      example:
        _id: 82f7e64ff912d31ffa27a5b7
        name: Moovit Software Products
        avatarUrl: https://example.com/asset/some_avatar.webp
    VerificationStatus:
      type: string
      enum:
        - verified
        - waiting
        - error
      description: |-
        * verified - Domain is verified
        * waiting - Domain is waiting for verification
        * error - Domain is not verified
      example: waiting
    ReducedUser:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
          description: Unique identifier of the user
          example: 65562d052ed0590e5d580ca0
        name:
          type: string
          description: Full name of the user
          example: John Doe
        email:
          type: string
          format: email
          description: Email address of the user
          example: john.doe@example.com
        avatarUrl:
          type: string
          format: uri
          description: URL to the user's avatar image
          example: https://example.com/avatar.webp
        isGuest:
          type: boolean
          description: Indicates if the user is a guest
          example: false
        isAgent:
          type: boolean
          description: Indicates if the user is an agent
          example: true
      required:
        - _id
        - name
        - email
        - avatarUrl
      description: >-
        Simplified representation of a user object used for referencing or
        displaying minimal user details
      example:
        _id: 3817e64ff912d31ffa27a571
        name: Helmut Mc Cloud
        email: mcloud@helmut.cloud
        avatarUrl: https://example.com/asset/some_avatar.webp
        isGuest: false
        isAgent: false
    DomainDto:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
          description: ID of the domain
          example: 3824021ff36f1412ecc7a263
        name:
          type: string
          description: Fully qualified domain name (FQDN)
          example: apple.test
        organization:
          $ref: '#/components/schemas/ReducedOrganization'
        verified:
          type: boolean
          description: Whether the domain is verified or not
          example: true
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        uuid:
          type: string
          format: uuid
          description: UUID used in the verification process
          example: 8de11b9b-9807-4b78-a6e4-412bda0e85c7
        creator:
          $ref: '#/components/schemas/ReducedUser'
        createDate:
          type: number
          description: Unix timestamp of when the domain was created.
          example: 1680251765050
        modifyDate:
          type: number
          description: Unix timestamp of when the domain was last modified.
          example: 1680251765050
      required:
        - _id
        - name
        - organization
        - verified
        - verificationStatus
        - uuid
        - creator
        - createDate
        - modifyDate
      description: >-
        Represents a domain associated with an organization, including
        verification and ownership metadata.
      example:
        _id: 3824021ff36f1412ecc7a263
        name: apple.test
        organization:
          _id: 6284c915f173f39d71bb8b83
          name: Devs
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        verified: true
        verificationStatus: verified
        uuid: 8de11b9b-9807-4b78-a6e4-412bda0e85c7
        creator:
          _id: 5814c915f173f39d71bb8b83
          name: Helmut Mc Cloud
          email: hmc@helmut.cloud
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
          isGuest: false
        createDate: 1680251765050
        modifyDate: 1680251765050
    UserDto:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
          description: ID of the User
          example: 5684c915f173f39d71bb8bd7
        name:
          type: string
          description: Name of the User
          example: Helmut Mc Cloud
        email:
          type: string
          format: email
          description: Email of the User
