      example:
        email: hmc@helmut.cloud
        nonce: d6e65091-5810-4dc8-a321-9ea59f49e4fa
        newPassword: Anewpassword!123
        totpToken: '237112'
    UserResolveDto:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: string
            minLength: 24
            maxLength: 24
            pattern: ^[a-fA-F0-9]{24}$
            description: >-
              ID of the user (ObjectId identifier, consists of 24 hexadecimal
              digits)
            example: 671b7de208337dc792b65f93
          minItems: 1
          description: List of user IDs to be resolved
          example:
            - 761b2de208337dc792b65f93
            - 385b2de208337dc792b65f38
            - 97ab2de208337dc792b65f11
        organizationId:
          type: string
          minLength: 24
          maxLength: 24
          format: hexadecimal
          description: >-
            ID of an organization. Will not resolve users that are not members
