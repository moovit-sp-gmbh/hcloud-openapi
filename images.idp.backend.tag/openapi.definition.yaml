      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: response_type
          in: query
          description: >-
            Tells the authorization server which grant to execute. Currently
            only "code" is supported.
          required: false
          schema:
            type: string
        - name: client_id
          in: query
          description: The ID of the application that is asking for authorization
          required: false
          schema:
            type: string
        - name: redirect_uri
          in: query
          description: A successful response will redirect to this URI
          required: false
          schema:
            type: string
        - name: scope
          in: query
          description: >-
            Space-delimited list of hcloud permissions that the application
            requires as well as openId if required.
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: >-
            Optional value, used for security purposes (XSRF) or to store
            non-sensitive information between requests.
                                           If this request parameter is set in the request, then it is returned to the application as part of the redirect_uri with no changes.
          required: false
          schema:
            type: string
      responses:
        '302':
          description: >-
            Redirects to the redirect URL with the authorization code in the
            query string
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
