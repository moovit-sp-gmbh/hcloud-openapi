          type: string
          description: >-
            Base64 URL encoded XML string containing the response as per the <a
            href="https://docs.oasis-open.org/security/saml/v2.0/saml-bindings-2.0-os.pdf">SAML
            2.0 HTTP POST binding (Section 3.5)</a>
          example: PHNhbWxwOlJlc3BvbnNlPmV4YW1wbGU8L3NhbWxwOlJlc3BvbnNlPg==
      required:
        - RelayState
        - SAMLResponse
      description: Payload containing RelayState and Base64-encoded SAML response
      example:
        RelayState: 8164031fd36f1412ecc7a8e5
        SAMLResponse: PHNhbWxwOlJlc3BvbnNlPmV4YW1wbGU8L3NhbWxwOlJlc3BvbnNlPg==
