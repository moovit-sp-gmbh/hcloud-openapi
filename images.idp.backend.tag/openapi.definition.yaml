              this user instead of the one associated with the token used in the
              request
          required: false
          name: userId
          in: query
      responses:
        '200':
          description: Requested organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDto'
        '400':
          description: >-
            Failed to validate 'path' parameter 'orgName' | Failed to validate
            'query' parameter 'teamsOfUser' | Failed to validate 'query'
            parameter 'totalMemberCount' | Failed to validate 'query' parameter
            'membersSample' | Failed to validate 'query' parameter 'license' |
