    LoginPath:
      type: string
      enum:
        - LOGIN
        - VERIFY_EMAIL
        - REGISTER
        - EXTERNAL
      description: Path to take to move forward in authentication
      example: LOGIN
    LoginPreDto:
      type: object
      properties:
        path:
          $ref: '#/components/schemas/LoginPath'
        location:
          type: string
          description: >-
            Only defined if path is EXTERNAL. Will point to the location where
            authentication should continue
      required:
        - path
      description: >-
        Represents the next step in the login process, including redirect
        location if applicable.
      example:
        path: LOGIN
    MessageDto:
      type: object
      properties:
        _id:
          type: string
          format: hexadecimal
          description: Unique identifier of the message
          example: 7354c915f173f39d71bb8a75
        from:
          allOf:
            - $ref: '#/components/schemas/ReducedUser'
            - description: Sender of the message
        to:
          allOf:
            - $ref: '#/components/schemas/ReducedUser'
            - description: Recipient of the message
        source:
          type: string
          enum:
            - GLOBAL
            - COSMO
            - HIGH5
            - IDP
          description: The system or service that originated this message
          example: GLOBAL
        type:
          type: string
          enum:
            - ASSET_READY
            - MENTION
            - USER_ADDED_TO_SPACE
            - USER_REMOVED_FROM_SPACE
            - ASSET_SHARED
            - NEW_COMMENT
            - REPLY_TO_COMMENT
            - ASSET_STATUS_CHANGED
            - NEW_ASSET_UPLOADED
            - EXECUTION_FINISHED
            - LOGINS
            - MESSAGES
          description: The specific type of message
          example: MESSAGES
        properties:
          type: object
          additionalProperties:
            nullable: true
          description: Payload specific to the message source and type
        level:
          type: string
          enum:
            - info
            - success
            - warning
            - error
          description: Severity level of the message
          example: info
        read:
          type: boolean
          description: Indicates whether the message has been read
          example: false
        system:
          type: boolean
          description: Indicates whether this is a system-generated message
          example: false
        deleted:
          type: boolean
          description: Soft-delete flag
          example: false
        ttl:
          type: number
          description: Auto-delete threshold in seconds
          example: 5184000
        group:
          type: string
          format: uuid
          description: UUID grouping related messages
        createDate:
          type: number
          description: Creation date of the message
          example: 1675569825179
      required:
        - _id
        - from
        - to
        - source
        - type
        - properties
        - level
        - read
        - system
        - deleted
        - ttl
        - createDate
      description: Represents a typed message exchanged between users or systems.
