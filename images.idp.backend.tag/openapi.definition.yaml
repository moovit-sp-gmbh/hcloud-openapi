    GeneralSettingsDto:
      properties:
        _id:
          type: string
          description: ID of the GeneralSettings
        user:
          $ref: '#/components/schemas/ReducedUser'
        lastUrl:
          type: string
          description: Last url visited by the user
        lastView:
          $ref: '#/components/schemas/Views'
          description: Last view the user was in
        timezone:
          type: string
          description: IANA timezone on the user's settings
        language:
          $ref: '#/components/schemas/Language'
          description: Language on the user's settings
        dateFormat:
          $ref: '#/components/schemas/DateFormat'
          description: dateFormat on the user's settings
        theme:
          $ref: '#/components/schemas/Theme'
          description: Theme on the user's settings
        entrypoint:
          $ref: '#/components/schemas/Entrypoint'
          description: Entrypoint on the user's settings
      required:
        - _id
        - user
        - lastUrl
        - lastView
        - timezone
        - language
        - dateFormat
        - theme
        - entrypoint
      example:
        user:
          _id: 6284c915f173f39d71bb8b83
          name: Helmut Mc Cloud
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        lastUrl: /account
        lastView: /account
        timezone: Europe/Berlin
        language: en
        dateFormat: YYYY-MM-DD hh:mm:ss a
        theme: SYSTEM_DEFAULT
        entrypoint: HIGH5
    GeneralSettingsPatchDto:
      properties:
        lastUrl:
          type: string
          description: Last URL visited by the user
        lastView:
          $ref: '#/components/schemas/Views'
          description: Last view the user was in
        timezone:
          type: string
          description: IANA timezone
        language:
          $ref: '#/components/schemas/Language'
          description: New language
        entrypoint:
          $ref: '#/components/schemas/Entrypoint'
          description: New entrypoint in helmut.cloud
        dateFormat:
          $ref: '#/components/schemas/DateFormat'
          description: New format to use for dates
        theme:
          $ref: '#/components/schemas/Theme'
          description: Theme to use
      example:
        lastUrl: /account/settings
        lastView: /account
        timezone: Europe/Lisbon
        language: en
        entrypoint: FUSE
        dateFormat: YYYY-MM-DDTHH:mm:ss
        theme: DARK
    GrantType:
      enum:
        - authorization_code
        - refresh_token
      type: string
      description: |
        * authorization_code - OAuth 2.0 Authorization Code Grant
        * refresh_token - OAuth 2.0 Refresh token Grant
    InvitationStatus:
      enum:
        - ACCEPTED
        - REJECTED
        - PENDING
      type: string
      description: |
        * ACCEPTED - The invitation was accepted.
        * REJECTED - The invitation was rejected.
        * PENDING - There has been no response to the invitation.
    Language:
      enum:
        - en
        - de
      type: string
      description: |
        * en - English
        * de - German
    LicenseDto:
      properties:
        tier:
          $ref: '#/components/schemas/LicenseTier'
          description: Tier of the license
        type:
          $ref: '#/components/schemas/LicenseType'
          description: Type of the license
        billingId:
          type: string
          description: ID of the billing
        quota:
          $ref: '#/components/schemas/LicenseQuota'
          description: Quota assigned to this license
        creator:
          $ref: '#/components/schemas/ReducedUser'
          description: Creator of the license
        contact:
          $ref: '#/components/schemas/ReducedUser'
          description: Contact for the license
        expireDate:
          type: number
          description: Expiry date of the license
        createDate:
          type: number
          description: Creation date of the license
      required:
        - tier
        - type
        - quota
        - expireDate
        - createDate
      example:
        tier: FREE
        type: PRODUCTION
        quota:
          idp:
            organization:
              members:
                quota: 2
              agents:
                quota: 1
              teams:
                quota: 1
              domains:
                quota: 0
              logPeriodInDays: 30
          high5:
            spaces:
              quota: 1
              catalogs:
                quota: -1
              customCatalogs:
                quota: 0
              customNodes:
                quota: 1
              webhooks:
                quota: 1
                logs:
                  quota: 10
              secrets:
                quota: 1
              events:
                quota: 1
                streams:
                  quota: 1
            executionsPerMonth:
              quota: 150
          fuse:
            spaces:
              quota: 1
              jobs:
                quota: 1
                logs:
                  quota: 10
            secondBaseExecutions: false
        expireDate: -1
        createDate: 1706191554
    LicenseTier:
      enum:
        - FREE
        - PRO
        - ENTERPRISE
      type: string
      description: |
        * FREE - Free license
        * PRO - Professional license
        * ENTERPRISE - Enterprise license
    LicenseType:
      enum:
        - PRODUCTION
        - POC
        - THIRD_PARTY
      type: string
      description: |
        * PRODUCTION - Production license
        * POC - Proof of concept license
        * THIRD_PARTY - Third party license
    LicenseUpdateDto:
      properties:
        identifier:
          type: string
          description: Identifier of the license
      required:
        - identifier
      example:
        identifier: 201fd106-f0b0-4ae8-beb1-94ca0d765c82
    LoginPath:
      enum:
        - LOGIN
        - VERIFY_EMAIL
        - REGISTER
        - EXTERNAL
      type: string
      description: >
        * LOGIN - Proceed to login page. The user has an account and is
        verified.

        * VERIFY_EMAIL - Proceed to verification page. The user has an account,
        but the email has not been validated.

        * REGISTER - Proceed to register page. The user does not have an
        account.

        * EXTERNAL - Proceed to external page. The domain of the user's email is
        bound to a different authentication system.
    LoginPreDto:
      properties:
        path:
          $ref: '#/components/schemas/LoginPath'
          description: Path to take to move forward in authentication.
        location:
          type: string
          description: >-
            Only defined if path is EXTERNAL. Will point to the location where
            authentication should continue.
      required:
        - path
      example:
        path: LOGIN
    NatsDto:
      properties:
        email:
          type: string
          description: Email of the User
        permissions:
          $ref: '#/components/schemas/NatsPermissions'
      required:
        - email
        - permissions
      example:
        email: hmc@helmut.cloud
        permissions:
          publish:
            deny:
              - '>'
          subscribe:
            allow:
              - hcloud.idp.user.637f43ee98e5f1ad04f7e911.>
              - hcloud.idp.organization.637f43ee98e5f1ad04f7e914.>
              - >-
                hcloud.high5.organization.637f43ee98e5f1ad04f7e914.app.637f46bb7ed53934c00e5739.>
              - >-
                hcloud.high5.organization.637f43ee98e5f1ad04f7e914.app.637f46ba7ed53934c00e5736.>
              - >-
                hcloud.high5.organization.637f43ee98e5f1ad04f7e914.app.637f46b97ed53934c00e5733.>
              - >-
                hcloud.high5.organization.637f43ee98e5f1ad04f7e914.app.637f46b87ed53934c00e5730.>
          responses:
            max: 1
            ttl: 0
    NotificationSettingsDto:
      properties:
        _id:
          type: string
          description: ID of the NotificationSettings
        user:
          $ref: '#/components/schemas/ReducedUser'
          description: User the settings belong to
        organizationInvitationEmail:
          type: boolean
          description: Enable/disable email notification when invited to an organization
        systemNotifications:
          type: boolean
          description: Enable/disable system notifications
      required:
        - _id
        - user
      example:
        user:
          _id: 6284c915f173f39d71bb8b83
          name: Helmut Mc Cloud
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        organizationInvitationEmail: true
        systemNotifications: false
    NotificationSettingsPatchDto:
      properties:
        organizationInvitationEmail:
          type: boolean
          description: Enable/disable email notification when invited to an organization
        systemNotifications:
          type: boolean
          description: Enable/disable system notifications
      example:
        organizationInvitationEmail: true
        systemNotifications: false
