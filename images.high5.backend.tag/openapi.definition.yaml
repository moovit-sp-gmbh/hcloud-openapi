  /v1/org/{orgName}/spaces/{spaceName}/execute/stream/id/{streamId}:
    post:
      tags:
        - Execute
      summary: Execute a stream by it's id
      description: |-

        Required organization role: MEMBER\
        Required space permission: EXECUTE\
        Required scopes: HIGH5_SPACE_EXECUTE
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the organization
          required: true
          schema:
            type: string
        - name: spaceName
          in: path
          description: Name of the space
          required: true
          schema:
            type: string
        - name: streamId
          in: path
          description: ID of the stream
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/High5ExecutionRequestDto'
      responses:
        '200':
          description: >-
            Object holding execution object, status object and log object ids
            that can be used to poll latest information about stream execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/High5ExecutionResponseDto'
        '400':
          description: Bad request
