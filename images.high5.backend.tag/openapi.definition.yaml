                  $ref: '#/components/examples/WebhookInvalidSecurityHeadersException'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WebhookNotFoundException:
                  $ref: '#/components/examples/WebhookNotFoundException'
        default:
          description: Unexpected error
    get:
      tags:
        - Webhook
      summary: Validate webhook url and set headers
      description: >-
        Validate webhook url and set headers. This path is equivalent to the
        "url" property of Webhook

        objects.
      parameters:
        - name: orgName
          in: path
          description: Name of the organization
          required: true
          schema:
            type: string
        - name: spaceName
          in: path
          description: Name of the space
          required: true
          schema:
            type: string
        - name: webhookToken
          in: path
          description: Last path segment of the webhook URL (128 char long hex string)
          required: true
          schema:
            type: string
        - name: challenge
          in: query
          description: >-
            Some third party services require to validate the target URL of a
            webhook first.

            To do so, they sent an initial GET request with a query-string
            called 'challenge'.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Value of the 'challenge' query-string as body.
          content:
            text/plain:
              schema:
                type: string
