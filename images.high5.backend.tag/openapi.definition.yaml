    WebhookUpdateDto:
      properties:
        name:
          type: string
          description: >-
            Name of the webhook (only alphanumeric characters, hyphens,
            underscores, dots and spaces are allowed, it should contain between
            1 and 128 symbols)
        target:
          type: string
          description: The target where the webhook should be executed at
        type:
          $ref: '#/components/schemas/WebhookType'
          description: >-
            The webhook type, one of EventWebhook | SpaceWebhook |
            FrameIoWebhook
        sub:
          oneOf:
            - $ref: '#/components/schemas/EventWebhook'
            - $ref: '#/components/schemas/SpaceWebhook'
            - $ref: '#/components/schemas/FrameIoWebhook'
          description: >-
            Specifies the sub type of the webhook, e.g. the event id for a
            generic webhook
        webhookEncryptionSettings:
          $ref: '#/components/schemas/WebhookEncryptionSettingsDto'
          description: Optional encryption settings
        deleteWebhookEncryptionSettings:
          type: boolean
          description: >-
            Optional parameter to delete existing encryption settings. If true
            'webhookEncryptionSettings' will be ignored
        securityHeaders:
          type: array
          items:
            $ref: '#/components/schemas/SecurityHeaderDto'
          description: Optional security headers
        deleteSecurityHeaders:
          type: boolean
          description: >-
            Optional parameter to delete existing security header settings. If
            true 'securityHeaders' will be ignored
        networkSettings:
          $ref: '#/components/schemas/IncomingWebhookNetworkSettingsDto'
          description: Optional settings to white/black list IP addresses
        callbackEnabled:
          type: boolean
          description: >-
            Global setting to enable/disable callbacks that can just be
            overwritten by ?callback=false query param in the webhook execution
            endpoint
      example:
        name: webhook-blue
        target: account@moovit-sp.com
        type: EVENT
        sub:
          eventName: test-Camp
        webhookEncryptionSettings:
          hmacHeaderName: x-hub-signature-256
          hmacAlgorithm: sha256
          hmacSecret: 649180269bdc11b1fe807938
        securityHeaders:
          - key: x-custom-security-header
            value: secret
        callbackEnabled: false
