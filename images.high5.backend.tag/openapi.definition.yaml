components:
  securitySchemes:
    BearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
    BasicAuth:
      type: http
      scheme: basic
    JoinToken:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    AvatarDto:
      properties:
        url:
          type: string
          description: URL to the avatar
      required:
        - url
      example:
        url: https://pub-1e0d69034e2942f79ef26dae05343340.r2.dev/image.webp
    Catalog:
      properties:
        version:
          type: string
          description: Version of the release
        url:
          type: string
          description: Url to the save location on s3 storage
      required:
        - version
        - url
      example:
        version: https://wave.s3.helmut.cloud/catalogs/default/
        url: 0.0.2-1238f8fcf8f1dd8651fb6499aa09184af213494b
    CatalogInfo:
      properties:
        name:
          type: string
          description: Name of the input
        _id:
          type: string
          description: Catalog _id
        url:
          type: string
          description: Catalog URL
        version:
          type: string
          description: Catalog version
      required:
        - url
        - version
      example:
        name: default
        url: https://example.com
        version: 1.0.0
    CommandType:
      enum:
        - STEP_FORWARD
        - CONTINUE
        - STEP_BACK
        - SET_VALUE
        - REPLACE_NODE
        - RESTART
      type: string
      description: >
        * STEP_FORWARD - Continue execution until the next node

        * CONTINUE - Continue execution until a breakpoint is hit

        * STEP_BACK - Revert the previous node's execution

        * SET_VALUE - Alter the state of the stream without advancing execution

        * REPLACE_NODE - Replace a node in a design only for a specific
        execution

        * RESTART - Restart execution
    CustomError:
      properties:
        code:
          type: string
          description: >-
            "A helmut cloud custom error code following this schema: [Custom
            Error
            Codes](https://development-guideline.pages.moovit-sp.com/en/hcloud/customErrorCodes.html)"
        error:
          type: string
          description: 'Name of the error in the following format: name.of.error'
        message:
          type: string
          description: Error description
      required:
        - code
        - error
        - message
      example: null
    StreamDesign:
      properties:
        nodes:
          type: array
          description: Stream design nodes
          items:
            type: object
        links:
          type: array
          description: Stream design links
          items:
            type: object
      required:
        - nodes
        - links
    DesignCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z-_]{1,64}$
          description: >-
            Name of the design (only alphabet characters, hyphens and
            underscores are allowed, it should contain between 1 and 64 symbols)
          deprecated: true
          example: My_design
        content:
          $ref: '#/components/schemas/StreamDesign'
        build:
          nullable: true
          description: Deprecated. This property will be ignored.
          deprecated: true
      required:
        - name
        - content
    DesignDto:
      properties:
        _id:
          type: string
          description: Database id of the design object
        name:
          type: string
          description: Name of the design
        content:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
          description: >-
            Object containing all information needed to visualize the design in
            SDS
        streamId:
          type: string
          description: The stream id the design belongs to
        event:
          $ref: '#/components/schemas/ReducedEvent'
          description: Event the design belongs to
        space:
          $ref: '#/components/schemas/ReducedSpace'
          description: Space the design belongs to
        organization:
          $ref: '#/components/schemas/ReducedOrganization'
          description: The organization the design belongs to
        creator:
          $ref: '#/components/schemas/ReducedUser'
          description: The creator of the design
        designHash:
          type: string
          description: The hash of the design
        createDate:
          type: number
          description: Date of creation as unix timestamp
      required:
        - _id
        - name
        - content
        - streamId
        - event
        - space
        - organization
        - designHash
        - createDate
      example:
        _id: 63c7e6f0eae82d8001b65310
        name: design-application
        content:
          nodes:
            - name: Trigger
              uuid: '0'
