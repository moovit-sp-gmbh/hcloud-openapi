    Scope:
      enum:
        - hcloud:full
        - idp:email:read
        - idp:user:read
        - idp:user:write
        - idp:user:delete
        - openid
        - idp:organization:read
        - idp:organization:write
        - idp:organization:delete
        - idp:organization:admin
        - high5:space:read
        - high5:space:execute
        - high5:space:write
        - high5:space:delete
        - fuse:space:read
        - fuse:space:execute
        - fuse:space:write
        - fuse:space:delete
      type: string
      description: >
        * hcloud:full - Full access to HCloud

        * idp:email:read - Access to email read operations

        * idp:user:read - Access to read operations of users

        * idp:user:write - Access to read and write operations of users

        * idp:user:delete - Access to read, write and delete operations of users

        * openid - Used for OAuth authentication requests. Used in the OpenID
        Connect protocol.

        * idp:organization:read - Access to read operations of organizations

        * idp:organization:write - Access to read and write operations of
        organizations

        * idp:organization:delete - Access to read, write and delete operations
        of organizations

        * idp:organization:admin - Access to read, write and delete operations
        of organizations and ability to manage its members

        * high5:space:read - Access to read operations of spaces

        * high5:space:execute - Access to the ability to start execution of
        streams of spaces

        * high5:space:write - Access to read and write operations of spaces

        * high5:space:delete - Access to read, write and delete operations of
        spaces

        * fuse:space:read - Access to read operations of spaces

        * fuse:space:execute - Access to the ability to start execution of
        streams of spaces

        * fuse:space:write - Access to read and write operations of spaces

        * fuse:space:delete - Access to read, write and delete operations of
        spaces
