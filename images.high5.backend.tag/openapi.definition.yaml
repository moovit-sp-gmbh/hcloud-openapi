  parameters:
    CatalogID:
      in: path
      name: catalogId
      schema:
        type: string
        minLength: 24
        maxLength: 24
        pattern: /^[a-fA-F0-9]{24}$/i
        example: 873b7de208337dc792b65f21
      required: true
      description: >-
        ID of the catalog (ObjectId identifier, consists of 24 hexadecimal
        digits)
    EventName:
      in: path
      name: eventName
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: /^[\w-.]{1,128}$/i
        example: Dev_Camp-2025.1
      required: true
      description: >-
        Name of the event (only alphanumeric characters, underscores, hyphens
        and dots are allowed; it should contain between 1 and 128 characters)
    ExecutionSecret:
      in: path
      name: secret
      schema:
        type: string
        minLength: 3
        maxLength: 1024
        example: A-top-top-top-secret-superspy-Secret
      required: true
      description: >-
        Secret that got generated on execution package creation at one of the
        POST execute endpoints (it should contain between 3 and 1024 characters)
    High5ExecutionID:
      in: path
      name: high5ExecutionId
      schema:
        type: string
        minLength: 24
        maxLength: 24
        pattern: /^[a-fA-F0-9]{24}$/i
        example: 749b7de208337dc792b65f16
      required: true
      description: >-
        ID of the execution (ObjectId identifier, consists of 24 hexadecimal
        digits)
    JoinTokenID:
