openapi: 3.0.0
info:
  title: hcloud - High5
  version: 0.0.107-2356
  contact:
    name: MoovIT Software Products GmbH
    url: https://www.moovit-sp.com
    email: info@moovit-sp.com
  description: >-
    High5 handles everything around streams (workflows) that are bounded to
    events (and or webhooks), which are part of an app that is connected to an
    Organization.
servers:
  - url: https://eu-central-1.helmut.cloud/api/high5
    description: EU-Central production server
  - url: https://na-west-1.helmut.cloud/api/high5
    description: NA-West production server
  - url: https://eu-dev-1.app.helmut.cloud/api/high5
    description: EU development server
  - url: http://localhost/api/high5
    description: Localhost
paths:
  /v1/org/{orgName}/spaces/{spaceName}/events/{eventName}/streams/{streamId}/design:
    get:
      tags:
        - Design
      summary: Get a stream's design
      description: |-

        Required organization role: MEMBER\
        Required space permission: READ\
        Required scopes: HIGH5_SPACE_READ
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
        - $ref: '#/components/parameters/SpaceName'
        - $ref: '#/components/parameters/EventName'
        - $ref: '#/components/parameters/StreamID'
      responses:
        '200':
          description: Design object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignDto'
        '400':
          description: Organization name is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Space name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Invalid event name:
                  $ref: '#/components/examples/InvalidParameterException'
                Invalid stream ID:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Missing required scope for operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                User is not member of organization or role is insufficient:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Space permission is insufficient. Must be at least READ:
                  $ref: '#/components/examples/SpaceInsufficientPermissionException'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                DesignNotFoundException:
                  $ref: '#/components/examples/DesignNotFoundException'
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
                Space not found:
                  $ref: '#/components/examples/SpaceNotFoundException'
                Event not found:
                  $ref: '#/components/examples/EventNotFoundException'
                Stream not found:
                  $ref: '#/components/examples/StreamNotFoundException'
        default:
          description: Unexpected error
    put:
      tags:
        - Design
      summary: Create a new design for a stream
      description: |-

        Required organization role: MEMBER\
        Required space permission: WRITE\
        Required scopes: HIGH5_SPACE_WRITE
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
        - $ref: '#/components/parameters/SpaceName'
        - $ref: '#/components/parameters/EventName'
        - $ref: '#/components/parameters/StreamID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignCreateDto'
      responses:
        '201':
          description: Design object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignDto'
        '400':
          description: Organization name is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Space name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Invalid event name:
                  $ref: '#/components/examples/InvalidParameterException'
                Invalid stream ID:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Missing required scope for operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Missing required scope for operation:
