        Key of the secret (only alphanumeric characters, underscores, hyphens
        and dots are allowed; it should contain between 1 and 32 characters)
    SnapshotID:
      in: path
      name: snapshotId
      schema:
        type: string
        minLength: 24
        maxLength: 24
        pattern: /^[a-fA-F0-9]{24}$/i
        example: 658b7de208337dc792b65f49
      required: true
      description: >-
        ID of the snapshot (ObjectId identifier, consists of 24 hexadecimal
