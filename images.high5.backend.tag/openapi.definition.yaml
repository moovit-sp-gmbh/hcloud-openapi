        type: string
        minLength: 24
        maxLength: 24
        pattern: /^[a-fA-F0-9]{24}$/i
        example: 934b7de208337dc792b65f76
      required: true
      description: ID of the node (ObjectId identifier, consists of 24 hexadecimal digits)
    OrgName:
      in: path
      name: orgName
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: /^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$/i
        example: MoovIT-Software-Products-GmbH
      required: true
      description: >-
        Name of the organization (only alphanumeric characters, hyphens and dots
