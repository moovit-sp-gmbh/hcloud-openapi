openapi: 3.0.0
info:
  title: hcloud - Dali
  version: 0.0.5-417
  contact:
    name: MoovIT Software Products GmbH
    url: https://www.moovit-sp.com
    email: info@moovit-sp.com
  description: >-
    Dali manages avatars for entities like users, teams, organizations and
    others.
servers:
  - url: https://eu-central-1.helmut.cloud/api/dali
    description: EU-Central production server
  - url: https://na-west-1.helmut.cloud/api/dali
    description: NA-West production server
  - url: https://eu-dev-1.app.helmut.cloud/api/dali
    description: EU development server
  - url: http://localhost/api/dali
    description: Localhost
paths:
  /v1/avatar/org/{orgName}/applications/oauth/{appId}:
    post:
      tags:
        - OAuthApp.Avatar
      summary: Create a new avatar for the OAuth application
      description: |-

        Required organization role: ADMIN\
        Required scopes: IDP_ORGANIZATION_WRITE
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the organization
          required: true
          schema:
            type: string
        - name: appId
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Public URL of the created avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarDto'
        '400':
          description: Validation error, processing and uploading avatar exceptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                FileTransferErrorException:
                  $ref: '#/components/examples/FileTransferErrorException'
                ImageProcessingErrorException:
                  $ref: '#/components/examples/ImageProcessingErrorException'
                Organization name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Missing required scope for operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                User is not member of organization or role is insufficient:
                  $ref: '#/components/examples/InsufficientAccessRightException'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
        '500':
          description: Internal Server Error (something went wrong)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InternalServerErrorException:
                  $ref: '#/components/examples/InternalServerErrorException'
        default:
          description: Unexpected error
    delete:
      tags:
        - OAuthApp.Avatar
      summary: Delete avatar for the OAuth application
      description: |-

        Required organization role: ADMIN\
        Required scopes: IDP_ORGANIZATION_WRITE
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the organization
          required: true
          schema:
            type: string
        - name: appId
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '400':
          description: Organization name is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Missing required scope for operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                User is not member of organization or role is insufficient:
                  $ref: '#/components/examples/InsufficientAccessRightException'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
        '500':
          description: Internal Server Error (something went wrong)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InternalServerErrorException:
                  $ref: '#/components/examples/InternalServerErrorException'
        default:
          description: Unexpected error
    put:
      tags:
        - OAuthApp.Avatar
      summary: Upload custom avatar for the OAuth application
      description: |-

        Required organization role: ADMIN\
        Required scopes: IDP_ORGANIZATION_WRITE
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the organization
          required: true
          schema:
            type: string
        - name: appId
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      requestBody:
        description: >-
          custom image must be send in request body as multipart/form-data as
          file!
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomAvatarDto'
      responses:
        '200':
          description: Public URL of the uploaded avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarDto'
        '400':
          description: >-
            Invalid parameter or request body, processing/uploading avatar
            exceptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                FileTransferErrorException:
                  $ref: '#/components/examples/FileTransferErrorException'
                ImageProcessingErrorException:
                  $ref: '#/components/examples/ImageProcessingErrorException'
                Organization name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                No avatar in the request body:
                  $ref: '#/components/examples/InvalidBodyException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Missing required scope for operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                User is not member of organization or role is insufficient:
                  $ref: '#/components/examples/InsufficientAccessRightException'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
        '413':
          description: File size too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                File size too large:
                  $ref: '#/components/examples/InvalidFileSizeException'
        '415':
          description: Invalid file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Invalid file type:
                  $ref: '#/components/examples/InvalidFileTypeException'
        '500':
          description: Internal Server Error (something went wrong)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InternalServerErrorException:
                  $ref: '#/components/examples/InternalServerErrorException'
        default:
          description: Unexpected error
