components:
  securitySchemes:
    BearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    AvatarDto:
      properties:
        url:
          type: string
          description: URL of the created/uploaded avatar
      required:
        - url
      example:
        url: https://dali.s3.helmut.cloud/some_avatar.webp
    CustomAvatarDto:
      properties:
        file:
          type: string
          description: The custom image to upload
          format: binary
      required:
        - file
      example:
        file: "PNG\r\n\x1A\n\0\0\0\rIHDR\0\0\0..."
    CustomError:
      properties:
        code:
          type: string
          description: >-
            "A helmut cloud custom error code following this schema: [Custom
            Error
            Codes](https://development-guideline.pages.moovit-sp.com/en/hcloud/customErrorCodes.html)"
        error:
          type: string
          description: 'Name of the error in the following format: name.of.error'
        message:
          type: string
          description: Error description
      required:
        - code
        - error
        - message
      example: null
  examples:
    InvalidParameterException:
      value:
        code: 007.000.0003
        error: invalid.parameter
        message: >-
          Failed to validate 'string' parameter 'MyVar' - A non-empty value is
          expected
    InvalidBodyException:
      value:
        code: 007.000.0004
        error: invalid.body
        message: No user avatar attached in the request body.
    AuthenticationTokenMissingException:
      value:
        code: 007.001.0002
        error: missing.auth.token
        message: Expected an authentication token that has not been provided
    NotAuthorizedException:
      value:
        code: 007.001.0001
        error: unauthorized
        message: You're not authorized
    WrongAuthenticationTokenException:
      value:
