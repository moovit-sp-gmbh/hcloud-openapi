openapi: 3.0.0
info:
  title: hcloud - Cosmo
  description: Cosmo is a Media Asset Management platform.
  version: 1.0.0
  contact:
    name: MoovIT Software Products GmbH
    url: https://www.moovit-sp.com
    email: info@moovit-sp.com
servers:
  - url: https://eu-central-1.helmut.cloud/api/cosmo
    description: EU-Central production server
  - url: https://na-west-1.helmut.cloud/api/cosmo
    description: NA-West production server
  - url: https://eu-dev-1.app.helmut.cloud/api/cosmo
    description: EU development server
  - url: http://localhost/api/cosmo
    description: Localhost
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    patAuth:
      type: http
      scheme: bearer
      bearerFormat: PAT
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CustomError:
      type: object
      properties:
        error:
          type: string
          description: Error name
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
      required:
        - error
        - code
        - message
      description: API errors obey this shape
    SpaceCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-zA-Z0-9-.]{1,32}$
          description: Name for the space
          example: my_space
      required:
        - name
    SpaceRenameDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-zA-Z0-9-.]{1,32}$
          description: Name for the space
          example: my_space
      required:
        - name
    AssetPatchLocationDto:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
          description: Location ID
      required:
        - locationId
    MoveAssetDto:
      type: object
      properties:
        parentId:
          type: string
          format: uuid
          description: Parent ID
      required:
        - parentId
    AssetPatchDto:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
          description: New categories
          example:
            - cat1
            - cat2
        tags:
          type: array
          items:
            type: string
          description: New tags
          example:
            - tag1
            - tag2
    AssetSearchDto:
      type: object
      properties:
        filters:
          type: array
          items:
            oneOf:
              - oneOf:
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - type
                      type:
                        type: string
                        enum:
                          - STRING
                      value:
                        anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      operator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                    required:
                      - key
                      - type
                      - value
                      - operator
                    description: STRING for type
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - type
                      type:
                        type: string
                        enum:
                          - SELECT
                      value:
                        anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      operator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                      allowedValues:
                        type: array
                        items:
                          type: string
                    required:
                      - key
                      - type
                      - value
                      - operator
                      - allowedValues
                    description: SELECT for type
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - type
                      type:
                        type: string
                        enum:
                          - TYPEAHEAD
                      value:
                        type: string
                      operator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                      allowedValues:
                        type: array
                        items:
                          type: string
                    required:
                      - key
                      - type
                      - value
                      - operator
                      - allowedValues
                    description: TYPEAHEAD for type
                description: type filters
              - type: object
                properties:
                  key:
                    type: string
                    enum:
                      - id
                  type:
                    type: string
                    enum:
                      - STRING
                  value:
                    anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  operator:
                    type: string
                    enum:
                      - is
                      - is not
                required:
                  - key
                  - type
                  - value
                  - operator
                description: id filters
              - oneOf:
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - name
                      type:
                        type: string
                        enum:
                          - STRING
                      value:
                        anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      operator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                    required:
                      - key
                      - type
                      - value
                      - operator
                    description: STRING for name
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - name
                      type:
                        type: string
                        enum:
                          - SELECT
                      value:
                        anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      operator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                      allowedValues:
                        type: array
                        items:
                          type: string
                    required:
                      - key
                      - type
                      - value
                      - operator
                      - allowedValues
                    description: SELECT for name
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - name
                      type:
                        type: string
                        enum:
                          - TYPEAHEAD
                      value:
                        type: string
                      operator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                      allowedValues:
                        type: array
                        items:
                          type: string
                    required:
                      - key
                      - type
                      - value
                      - operator
                      - allowedValues
                    description: TYPEAHEAD for name
                description: name filters
          description: field filters
      required:
        - filters
    AssetCreateDto:
      type: object
      properties:
        name:
          type: string
          description: Asset name
          example: my-asset
        parentId:
          type: string
          format: uuid
          description: Parent ID
          example: 4bd96ba6-2be3-4cd4-91a3-8af692cf7f84
        parentType:
          type: string
          enum:
            - ASSET
            - SPACE
            - PRODUCTION
            - PROJECT
            - FOLDER
          description: Parent Type
          example: SPACE
        tags:
          type: array
          items:
            type: string
          description: Asset tags
          example:
            - tag1
            - tag2
        categories:
          type: array
          items:
            type: string
          description: Asset categories
          example:
            - category1
            - category2
      required:
        - name
        - parentId
        - parentType
      example:
        name: my-asset
        parentId: 4bd96ba6-2be3-4cd4-91a3-8af692cf7f84
        parentType: SPACE
        tags:
          - tag1
          - tag2
        categories:
          - category1
          - category2
    LocationCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-zA-Z0-9-.]{1,32}$
      required:
        - name
    ProductionCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-zA-Z0-9-.]{1,32}$
      required:
        - name
    NamespaceCreateDto:
      type: object
      properties:
        name:
          type: string
          description: Namespace name
          example: My Namespace
      required:
        - name
    SpaceDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the space
          example: 641fa07a-2812-4d07-8de7-cd20daade955
        name:
          type: string
          description: Name of the space
          example: My Space
      required:
        - id
        - name
    ItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Item ID
        name:
          type: string
          description: Item name
        type:
          type: string
          enum:
            - ASSET
            - SPACE
            - PRODUCTION
            - PROJECT
            - FOLDER
          description: Item type
      required:
        - id
        - name
        - type
      example:
        name: my space
        type: SPACE
        id: 2e1d01be-fc17-4acd-a3d9-ddacedebc59f
    ReducedUser:
      type: object
      properties:
        _id:
          type: string
          format: hex
          description: User ID
          example: 67336a3f31ed8ecdc24e0080
        name:
          type: string
          description: User Name
          example: Bob
        avatarUrl:
          type: string
          format: uri
          description: URL to the user's avatar
          example: https://example.com
      required:
        - _id
        - name
        - avatarUrl
    Unknown:
      type: object
      properties:
        name:
          type: string
          description: Name of the media
          example: original
        url:
          type: string
          format: uri
          description: >-
            URL to the media. Can be undefined if the media is still being
            uploaded
          example: https://example.com
        type:
          type: string
          enum:
            - UNKNOWN
          description: Media type
          example: UNKNOWN
      required:
        - name
        - type
    Image:
      type: object
      properties:
        name:
          type: string
          description: Name of the media
          example: thumbnail
        url:
          type: string
          format: uri
          description: >-
            URL to the media. Can be undefined if the media is still being
            uploaded
          example: https://example.com
        type:
          type: string
          enum:
            - IMAGE
          description: Media type
          example: IMAGE
      required:
        - name
        - type
    AudioMetadata:
      type: object
      properties:
        type:
          type: string
          enum:
            - AUDIO
          example: AUDIO
        codec:
          type: string
          example: aac
        channels:
          type: number
          example: 6
        channelLayout:
          type: string
          example: '5.1'
        bitRate:
          type: number
          example: 383960
        sampleRate:
          type: number
          example: 48000
      required:
        - type
        - codec
        - channels
        - channelLayout
        - bitRate
        - sampleRate
    VideoMetadata:
      type: object
      properties:
        type:
          type: string
          enum:
            - VIDEO
          example: VIDEO
        codec:
          type: string
          example: h264
        frameRate:
          type: number
          example: 25
        pixelFormat:
          type: string
          example: yuv420p
        aspectRatio:
          type: string
          example: '16:9'
        colorSpace:
          type: string
        width:
          type: number
          example: 1280
        height:
          type: number
          example: 720
        fieldOrder:
          type: string
        duration:
          type: number
          example: 29.56
        tcIn:
          type: string
          example: '0.000000'
        tcOut:
          type: string
        noOfFrames:
          type: number
          example: 739
        formatLongName:
          type: string
          example: QuickTime / MOV
      required:
        - type
        - codec
        - frameRate
        - pixelFormat
        - aspectRatio
        - width
        - height
        - fieldOrder
        - duration
        - tcIn
        - tcOut
        - noOfFrames
        - formatLongName
      description: Video metadata
    AssetDetailedDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Asset ID
          example: d11bdb05-d94a-4aa1-b6e2-32259a2c46e3
        name:
          type: string
          description: Asset Name
          example: myasset.mov
        type:
          type: string
          enum:
            - ASSET
            - SPACE
            - PRODUCTION
            - PROJECT
            - FOLDER
          description: Item type
        assetType:
          type: string
          enum:
            - VIDEO
            - IMAGE
            - DOCUMENT
            - UNKNOWN
          description: Asset Type
          example: VIDEO
        breadcrumb:
          type: array
          items:
            $ref: '#/components/schemas/ItemDto'
        duration:
          type: number
          description: Duration of the video if the asset is a video asset
          example: 29.56
        frameRate:
          type: number
          description: Frame rate of the video if the asset is a video asset
          example: 25
        thumbnailUrl:
          type: string
          format: uri
          description: URL of the thumbnail
          example: https://example.com/thumbnail.jpg
        previewUrl:
          type: string
          format: uri
          description: URL of the preview
          example: https://example.com/preview.jpg
        createDate:
          type: number
          minimum: 0
          description: Date of creation
          format: UNIX timestamp
          example: 1747142773233
        creator:
          $ref: '#/components/schemas/ReducedUser'
        upload:
          type: object
          properties:
            url:
              type: string
              format: uri
            token:
              type: string
            expiration:
              type: number
            libraryId:
              type: number
            videoId:
              type: string
          required:
            - url
            - token
            - expiration
        media:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Unknown'
              - $ref: '#/components/schemas/Image'
              - type: object
                properties:
                  name:
                    type: string
                    description: Name of the media
                    example: original
                  url:
                    type: string
                    format: uri
                    description: >-
                      URL to the media. Can be undefined if the media is still
                      being uploaded
                    example: https://example.com
                  type:
                    type: string
                    enum:
                      - AUDIO
                    description: Media type
                    example: AUDIO
                  metadata:
                    type: array
                    items:
                      $ref: '#/components/schemas/AudioMetadata'
                    description: Media metadata
                required:
                  - name
                  - type
              - type: object
                properties:
                  name:
                    type: string
                    description: Name of the media
                    example: original
                  url:
                    type: string
                    format: uri
                    description: >-
                      URL to the media. Can be undefined if the media is still
                      being uploaded
                    example: https://example.com
                  type:
                    type: string
                    enum:
                      - VIDEO
                    description: Media type
                    example: VIDEO
                  metadata:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/AudioMetadata'
                        - $ref: '#/components/schemas/VideoMetadata'
                    description: Media metadata
                required:
                  - name
                  - type
      required:
        - id
        - name
        - type
        - createDate
        - creator
    LocationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the location
          example: 6471393c-6dc5-4ab4-a390-a1568b7d1689
        name:
          type: string
          description: Name of the location
          example: My location
      required:
        - id
        - name
    ProductionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the production
          example: 641fa07a-2812-4d07-8de7-cd20daade955
        name:
          type: string
          description: Name of the production
          example: My Production
      required:
        - id
        - name
    FolderDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Folder ID
        name:
          type: string
          description: Folder name
      required:
        - id
        - name
      example:
        name: my-name
        id: fa7f41b9-7915-4a9c-bd6f-67ddfb03f73a
    FolderCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-zA-Z0-9-.]{1,32}$
          description: Folder name
          example: my folder
        parentId:
          type: string
          format: uuid
          description: Parent ID
          example: 4ba38673-c8bb-4541-b123-b542f91d5f07
        parentType:
          type: string
          enum:
            - ASSET
            - SPACE
            - PRODUCTION
            - PROJECT
            - FOLDER
          description: Parent Type
          example: SPACE
      required:
        - name
        - parentId
        - parentType
    FolderRenameDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-zA-Z0-9-.]{1,32}$
          description: Folder name
          example: my folder
      required:
        - name
    FolderMoveDto:
      type: object
      properties:
        parentId:
          type: string
          format: uuid
          description: Parent ID
          example: 4ba38673-c8bb-4541-b123-b542f91d5f07
      required:
        - parentId
    NamespaceDto:
      type: object
      properties:
        name:
          type: string
          description: Namespace name
          example: My Namespace
        id:
          type: string
          format: uuid
          description: Namespace ID
          example: 254b0fb5-7567-47a8-b655-d09a40c91b2f
      required:
        - name
        - id
    CommentDto:
      type: object
      properties:
        text:
          type: string
          description: Comment Text
          example: My Comment
        id:
          type: string
          format: uuid
          description: Comment ID
          example: 254b0fb5-7567-47a8-b655-d09a40c91b2f
        createDate:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Comment creation date
          example: 1746608457170
        timestamp:
          type: object
          properties:
            in:
              type: number
              minimum: 0
              description: Timecode IN
            out:
              type: number
              minimum: 0
              description: Timecode OUT
            color:
              type: string
              description: Comment color
          required:
            - in
            - color
          description: Timestamp the comment refers to
        creator:
          $ref: '#/components/schemas/ReducedUser'
      required:
        - text
        - id
        - createDate
        - creator
    CommentCreateDto:
      type: object
      properties:
        text:
          type: string
          maxLength: 2048
          description: Comment text
          example: This is my comment
        refId:
          type: string
          format: uuid
          description: ID of the item referenced
          example: 8a5cd9be-f983-4a1c-bfdb-3868152a87fe
        timestamp:
          type: object
          properties:
            in:
              type: number
              minimum: 0
              description: Timecode IN
            out:
              type: number
              minimum: 0
              description: Timecode OUT
            color:
              type: string
              description: Comment color
          required:
            - in
            - color
          description: Timestamp the comment refers to
      required:
        - text
        - refId
    CommentEditDto:
      type: object
      properties:
        text:
          type: string
          maxLength: 2048
          description: Comment text
          example: This is my comment
        timestamp:
          type: object
          properties:
            in:
              type: number
              minimum: 0
              description: Timecode IN
            out:
              type: number
              minimum: 0
              description: Timecode OUT
            color:
              type: string
              description: Comment color
          required:
            - in
            - color
          description: Timestamp the comment refers to
      required:
        - text
  parameters: {}
paths:
  /v1/org/{orgName}/spaces:
    post:
      security:
        - bearerAuth:
            - high5:space:write
        - basicAuth:
            - high5:space:write
        - patAuth:
            - high5:space:write
      summary: Create a space
      tags:
        - Space
      parameters:
        - schema:
            anyOf:
              - type: string
                minLength: 3
                maxLength: 64
                pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
              - type: string
                minLength: 3
                maxLength: 255
                pattern: ^[\w-+@.]{3,255}$
            description: Organization name
          required: true
          name: orgName
          in: path
        - schema:
            type: boolean
            nullable: true
          required: false
          name: noAvatar
          in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceCreateDto'
      responses:
        '201':
          description: Created space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceDto'
        '400':
          description: >-
            Failed to validate 'query' parameter 'noAvatar' | Failed to validate
            'path' parameter 'orgName'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Failed to validate 'query' parameter 'noAvatar':
                  summary: Failed to validate 'query' parameter 'noAvatar'
                  description: Failed to validate 'query' parameter 'noAvatar' - {error}
                  value:
                    code: 011.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'query' parameter 'noAvatar' - {error}
                Failed to validate 'path' parameter 'orgName':
                  summary: Failed to validate 'path' parameter 'orgName'
                  description: Failed to validate 'path' parameter 'orgName' - {error}
                  value:
                    code: 011.000.0003
                    error: invalid.parameter
                    message: Failed to validate 'path' parameter 'orgName' - {error}
        '401':
          description: >-
            You're not authorized | Expected an authentication token that has
            not been provided | Your authentication token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                You're not authorized:
                  summary: You're not authorized
                  value:
                    code: 011.001.0001
                    error: unauthorized
                    message: You're not authorized
                Expected an authentication token that has not been provided:
                  summary: Expected an authentication token that has not been provided
                  value:
                    code: 011.001.0002
                    error: missing.auth.token
                    message: >-
                      Expected an authentication token that has not been
                      provided
                Your authentication token is invalid:
                  summary: Your authentication token is invalid
                  value:
                    code: 011.001.0003
                    error: wrong.auth.token
                    message: Your authentication token is invalid
        '403':
          description: >-
            Required scopes ['high5:space:write'] not included in authorization
            | User's organization role is insufficient. Must be at least ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Required scopes ['high5:space:write'] not included in authorization:
                  summary: >-
                    Required scopes ['high5:space:write'] not included in
                    authorization
                  value:
                    code: 011.001.0004
                    error: insufficient.rights
                    message: >-
                      You have not enough rights to access/manipulate this
                      resource
                User's organization role is insufficient. Must be at least ADMIN:
                  summary: >-
                    User's organization role is insufficient. Must be at least
                    ADMIN
                  value:
                    code: 011.001.0004
                    error: insufficient.rights
                    message: >-
                      You have not enough rights to access/manipulate this
                      resource
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  summary: Organization not found
                  value:
                    code: 011.007.0001
                    error: organization.not.found
                    message: Organization not found
        '500':
          description: something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                something went wrong:
                  summary: something went wrong
                  value:
                    code: 011.000.0002
                    error: internal.server.error
                    message: something went wrong
    get:
      security:
        - bearerAuth:
            - high5:space:write
        - basicAuth:
            - high5:space:write
        - patAuth:
            - high5:space:write
      summary: List spaces
      tags:
        - Space
      parameters:
        - schema:
            anyOf:
              - type: string
