openapi: 3.0.0
info:
  title: hcloud - Cosmo
  description: Cosmo is a Media Asset Management platform.
  version: 1.0.0
  contact:
    name: MoovIT Software Products GmbH
    url: https://www.moovit-sp.com
    email: info@moovit-sp.com
servers:
  - url: https://eu-central-1.helmut.cloud/api/cosmo
    description: EU-Central production server
  - url: https://na-west-1.helmut.cloud/api/cosmo
    description: NA-West production server
  - url: https://eu-dev-1.app.helmut.cloud/api/cosmo
    description: EU development server
  - url: http://localhost/api/cosmo
    description: Localhost
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    patAuth:
      type: http
      scheme: bearer
      bearerFormat: PAT
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CustomError:
      type: object
      properties:
        error:
          type: string
          description: Error name
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
      required:
        - error
        - code
        - message
      description: API errors obey this shape
    ShareCreateDto:
      type: object
      properties:
        name:
          type: string
          description: Share name
        password:
          type: string
          description: Share password
          example: super-safe
        expires:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: UTC timestamp in milliseconds marking when the share should expire
          example: 1752057295637
        items:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum:
                - READ
                - WRITE
                - CREATE
                - COMMENT
                - CONTRIBUTE
                - DOWNLOAD
                - DELETE
                - READ_DETAILS
          description: >-
            Map of asset ID to the desired permissions that the share members
            will have relative to it. All shared assets have baseline READ
            permission,
          example:
            ae13321a-522d-48da-9733-27c97bcab124:
              - READ
        namespaces:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum:
                - READ_COMMENTS
                - WRITE_COMMENTS
                - READ_STATUS
            minItems: 1
          description: >-
            Namespaces to include in the share. Share consumers will only able
            to read/write asset comments and statuses according to the
            permissions set in this map.
          example:
            rush:
              - READ_STATUS
        users:
          type: array
          items:
            type: string
            format: email
          description: List of user to automatically add and notify of the share
      required:
        - name
        - items
    ShareLinkDto:
      type: object
      properties:
        password:
          type: string
          description: Share password
          example: super-safe
    ShareAddUsersDto:
      type: object
      properties:
        password:
          type: string
          description: Share password
          example: super-safe
        users:
          type: array
          items:
            type: string
            format: email
          description: List of user to automatically add and notify of the share
      required:
        - users
    SpaceCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[\w-.]{1,32}$
          description: Name for the space
          example: my_space
      required:
        - name
    SpaceRenameDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[\w-.]{1,32}$
          description: Name for the space
          example: my_space
      required:
        - name
    High5SpaceInfoDto:
      type: object
      properties:
        high5_spaceName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[\w-.]{1,32}$
          description: Name for the space
          example: my_space
        executionTarget:
          type: string
          description: Email address or pool name for the execution target
          example: hmc@helmut.cloud or Pool-Party
      required:
        - high5_spaceName
        - executionTarget
    AssetPatchLocationDto:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
          description: Location ID
      required:
        - locationId
    MoveAssetDto:
      type: object
      properties:
        parentId:
          type: string
          format: uuid
          description: Parent ID. If omitted, the asset will be placed at the root level.
          example: 24b9fe00-8cc2-4f15-bde7-72a8b2e3c7ef
    BulkMoveAssetsDto:
      type: object
      properties:
        assetIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: List of asset/folder IDs to move
          example:
            - uuid-1
            - uuid-2
        parentId:
          type: string
          format: uuid
          description: >-
            ID of the target parent. If omitted, the assets will be placed at
            the root level.
          example: 24b9fe00-8cc2-4f15-bde7-72a8b2e3c7ef
      required:
        - assetIds
    AssetPatchDto:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
          description: New categories
          example:
            - cat1
            - cat2
        tags:
          type: array
          items:
            type: string
          description: New tags
          example:
            - tag1
            - tag2
    AssetSearchDto:
      type: object
      properties:
        filters:
          type: array
          items:
            oneOf:
              - oneOf:
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - type
                      type:
                        type: string
                        enum:
                          - STRING
                      value:
                        anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      comparator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                    required:
                      - key
                      - type
                      - value
                      - comparator
                    description: STRING for type
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - type
                      type:
                        type: string
                        enum:
                          - SELECT
                      value:
                        anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      comparator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                      allowedValues:
                        type: array
                        items:
                          type: string
                    required:
                      - key
                      - type
                      - value
                      - comparator
                      - allowedValues
                    description: SELECT for type
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - type
                      type:
                        type: string
                        enum:
                          - TYPEAHEAD
                      value:
                        type: string
                      comparator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                      allowedValues:
                        type: array
                        items:
                          type: string
                    required:
                      - key
                      - type
                      - value
                      - comparator
                      - allowedValues
                    description: TYPEAHEAD for type
                description: type filters
              - type: object
                properties:
                  key:
                    type: string
                    enum:
                      - id
                  type:
                    type: string
                    enum:
                      - STRING
                  value:
                    anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  comparator:
                    type: string
                    enum:
                      - is
                      - is not
                required:
                  - key
                  - type
                  - value
                  - comparator
                description: id filters
              - oneOf:
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - name
                      type:
                        type: string
                        enum:
                          - STRING
                      value:
                        anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      comparator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                    required:
                      - key
                      - type
                      - value
                      - comparator
                    description: STRING for name
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - name
                      type:
                        type: string
                        enum:
                          - SELECT
                      value:
                        anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      comparator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                      allowedValues:
                        type: array
                        items:
                          type: string
                    required:
                      - key
                      - type
                      - value
                      - comparator
                      - allowedValues
                    description: SELECT for name
                  - type: object
                    properties:
                      key:
                        type: string
                        enum:
                          - name
                      type:
                        type: string
                        enum:
                          - TYPEAHEAD
                      value:
                        type: string
                      comparator:
                        type: string
                        enum:
                          - is
                          - is not
                          - starts with
                          - ends with
                          - contains
                      allowedValues:
                        type: array
                        items:
                          type: string
                    required:
                      - key
                      - type
                      - value
                      - comparator
                      - allowedValues
                    description: TYPEAHEAD for name
                description: name filters
          description: field filters
      required:
        - filters
    AssetRenameDto:
      type: object
      properties:
        name:
          type: string
          description: Asset name
          example: my-asset
      required:
        - name
      example:
        name: my-asset
    BulkDownloadUrlsDto:
      type: object
      properties:
        assetIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: List of asset IDs to get download Urls from
          example:
            - uuid-1
            - uuid-2
        resolution:
          type: string
          enum:
            - original
            - '1080'
            - '720'
            - '480'
            - '360'
            - '240'
          description: Resolution for the download URLs
          example: original
      required:
        - assetIds
        - resolution
    AssetIdsDto:
      type: object
      properties:
        assetIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: List of asset IDs to get download Urls from
          example:
            - uuid-1
            - uuid-2
      required:
        - assetIds
    AssetCreateDto:
      type: object
      properties:
        name:
          type: string
          description: Asset name
          example: my-asset
        parentId:
          type: string
          format: uuid
          description: Parent ID. If omitted, the asset will be placed at the root level.
          example: 4bd96ba6-2be3-4cd4-91a3-8af692cf7f84
        tags:
          type: array
          items:
            type: string
          description: Asset tags
          example:
            - tag1
            - tag2
        categories:
          type: array
          items:
            type: string
          description: Asset categories
          example:
            - category1
            - category2
      required:
        - name
      example:
        name: my-asset
        parentId: 4bd96ba6-2be3-4cd4-91a3-8af692cf7f84
        tags:
          - tag1
          - tag2
        categories:
          - category1
          - category2
    AssetTrashDto:
      type: object
      properties:
        assetIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required:
        - assetIds
    AssetTrashRemoveDto:
      type: object
      properties:
        assetIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required:
        - assetIds
    LocationCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[\w-.]{1,32}$
      required:
        - name
    ProductionCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[\w-.]{1,32}$
      required:
        - name
    NamespaceSearchName:
      anyOf:
        - type: string
          minLength: 3
          maxLength: 64
          pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
        - type: string
          minLength: 3
          maxLength: 64
          pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
        - type: string
          enum:
            - '*'
        - type: array
          items:
            anyOf:
              - type: string
                minLength: 3
                maxLength: 64
                pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
              - type: string
                minLength: 3
                maxLength: 64
                pattern: ^(?!-)(?!.*--)[a-zA-Z0-9-.]{3,64}(?<!-)$
              - type: string
                enum:
                  - '*'
      description: >-
        Use * to fetch from all namespaces. Can only be used if spaceName is
        also defined.
    NamespaceCreateDto:
      type: object
      properties:
        name:
          type: string
          description: Namespace name
          example: My Namespace
      required:
        - name
    ReferenceStatusPatchDto:
      type: object
      properties:
        status:
          type: string
          enum: &ref_0
            - approved
            - rejected
      required:
        - status
    ReducedUser:
      type: object
      properties:
        _id:
          type: string
          format: hex
          description: User ID
          example: 67336a3f31ed8ecdc24e0080
        name:
          type: string
          description: User Name
          example: Bob
        email:
          type: string
          description: User email
          example: bob@helmut.cloud
        avatarUrl:
          type: string
          format: uri
          description: URL to the user's avatar
          example: https://example.com
      required:
        - _id
        - name
        - email
        - avatarUrl
    SpaceDto:
      type: object
      properties:
        _id:
          type: string
          format: uuid
          description: ID of the space
          example: 641fa07a-2812-4d07-8de7-cd20daade955
        name:
          type: string
          description: Name of the space
          example: My Space
        createDate:
          type: number
          description: Creation date of the space as millisecond timestamp
          example: 1633072800000
        creator:
          $ref: '#/components/schemas/ReducedUser'
        avatarUrl:
          type: string
          format: uri
          description: URL of the avatar
          example: https://example.com/avatar.jpg
        high5_spaceName:
          type: string
          description: Name of the linked high5 space
          example: cosmo_space
        high5_executionTarget:
          type: string
          format: email
          description: Email address of the execution target for the high5 space
          example: hmc@helmut.cloud
      required:
        - _id
        - name
        - createDate
        - creator
        - avatarUrl
    ItemDto:
      type: object
      properties:
        _id:
          type: string
          format: uuid
          description: Item ID
        name:
          type: string
          description: Item name
        type:
          type: string
          enum:
            - ASSET
            - SPACE
            - PRODUCTION
            - PROJECT
            - FOLDER
            - COMMENT
          description: Item type
      required:
        - _id
        - name
        - type
      example:
        name: my space
        type: SPACE
        _id: 2e1d01be-fc17-4acd-a3d9-ddacedebc59f
    Unknown:
      type: object
      properties:
        name:
          type: string
          description: Name of the media
          example: original
        url:
          type: string
          format: uri
          description: >-
            URL to the media. Can be undefined if the media is still being
            uploaded
          example: https://example.com
        type:
          type: string
          enum:
            - UNKNOWN
          description: Media type
          example: UNKNOWN
      required:
        - name
        - type
    Image:
      type: object
      properties:
        name:
          type: string
          description: Name of the media
          example: thumbnail
        url:
          type: string
          format: uri
          description: >-
            URL to the media. Can be undefined if the media is still being
            uploaded
          example: https://example.com
        type:
          type: string
          enum:
            - IMAGE
          description: Media type
          example: IMAGE
      required:
        - name
        - type
    AudioMetadata:
      type: object
      properties:
        type:
          type: string
          enum:
            - AUDIO
          example: AUDIO
        codec:
          type: string
          example: aac
        channels:
          type: number
          example: 6
        channelLayout:
          type: string
          example: '5.1'
        bitRate:
          type: number
          example: 383960
        sampleRate:
          type: number
          example: 48000
      required:
        - type
        - codec
        - channels
        - channelLayout
        - bitRate
        - sampleRate
    VideoMetadata:
      type: object
      properties:
        type:
          type: string
          enum:
            - VIDEO
          example: VIDEO
        codec:
          type: string
          example: h264
        frameRate:
          type: number
          example: 25
        pixelFormat:
          type: string
          example: yuv420p
        aspectRatio:
          type: string
          example: '16:9'
        colorSpace:
          type: string
        width:
          type: number
          example: 1280
        height:
          type: number
          example: 720
        fieldOrder:
          type: string
        duration:
          type: number
          example: 29.56
        tcIn:
          type: string
          example: '0.000000'
        tcOut:
          type: string
        noOfFrames:
          type: number
          example: 739
        formatLongName:
          type: string
          example: QuickTime / MOV
      required:
        - type
        - codec
        - frameRate
        - pixelFormat
        - aspectRatio
        - width
        - height
        - fieldOrder
        - duration
        - tcIn
        - tcOut
        - noOfFrames
        - formatLongName
      description: Video metadata
    AssetDetailedDto:
      type: object
      properties:
        _id:
          type: string
          format: uuid
          description: Asset ID
          example: d11bdb05-d94a-4aa1-b6e2-32259a2c46e3
        name:
          type: string
          description: Asset Name
          example: myasset.mov
        type:
          type: string
          enum:
            - ASSET
            - SPACE
            - PRODUCTION
            - PROJECT
            - FOLDER
            - COMMENT
          description: Item type
        assetType:
          type: string
          enum:
            - VIDEO
            - IMAGE
            - DOCUMENT
            - UNKNOWN
            - FOLDER
          description: Asset Type
          example: VIDEO
        breadcrumb:
          type: array
          items:
            $ref: '#/components/schemas/ItemDto'
        duration:
          type: number
          description: Duration of the video if the asset is a video asset
          example: 29.56
        frameRate:
          type: number
          description: Frame rate of the video if the asset is a video asset
          example: 25
        thumbnailUrl:
          type: string
          format: uri
          description: URL of the thumbnail
          example: https://example.com/thumbnail.jpg
        previewUrl:
          type: string
          format: uri
          description: URL of the preview
          example: https://example.com/preview.jpg
        createDate:
          type: number
          minimum: 0
          description: Date of creation
          format: UNIX timestamp
          example: 1747142773233
        creator:
          $ref: '#/components/schemas/ReducedUser'
        upload:
          type: object
          properties:
            url:
              type: string
              format: uri
            token:
              type: string
            expiration:
              type: number
            libraryId:
              type: number
            videoId:
              type: string
          required:
            - url
            - token
            - expiration
        namespaces:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
            required:
              - status
          description: Information about the asset across namespaces.
          example: &ref_1
            rush:
              status: approved
        permissions:
          type: array
          items:
            type: string
          description: Allowed operations on the asset
          example: &ref_2
            - CAN_READ
        media:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Unknown'
              - $ref: '#/components/schemas/Image'
              - type: object
                properties:
                  name:
                    type: string
                    description: Name of the media
                    example: original
                  url:
                    type: string
                    format: uri
                    description: >-
                      URL to the media. Can be undefined if the media is still
                      being uploaded
                    example: https://example.com
                  type:
                    type: string
                    enum:
                      - AUDIO
                    description: Media type
                    example: AUDIO
                  metadata:
                    type: array
                    items:
                      $ref: '#/components/schemas/AudioMetadata'
                    description: Media metadata
                required:
                  - name
                  - type
              - type: object
                properties:
                  name:
                    type: string
                    description: Name of the media
                    example: original
                  url:
                    type: string
                    format: uri
                    description: >-
                      URL to the media. Can be undefined if the media is still
                      being uploaded
                    example: https://example.com
                  type:
                    type: string
                    enum:
                      - VIDEO
                    description: Media type
                    example: VIDEO
                  metadata:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/AudioMetadata'
                        - $ref: '#/components/schemas/VideoMetadata'
                    description: Media metadata
                required:
                  - name
                  - type
      required:
        - _id
        - name
        - type
        - createDate
        - creator
    AssetPermissionsDto:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
          enum:
            - READ
            - WRITE
            - CREATE
            - COMMENT
            - CONTRIBUTE
            - DOWNLOAD
            - DELETE
            - READ_DETAILS
      example:
        37fd2155-98f7-4154-b2ed-a43715937f6a:
          - READ
    LocationDto:
      type: object
      properties:
        _id:
          type: string
          format: uuid
          description: ID of the location
          example: 6471393c-6dc5-4ab4-a390-a1568b7d1689
        name:
          type: string
          description: Name of the location
          example: My location
      required:
        - _id
        - name
    ProductionDto:
      type: object
      properties:
        _id:
          type: string
          format: uuid
          description: ID of the production
          example: 641fa07a-2812-4d07-8de7-cd20daade955
        name:
          type: string
          description: Name of the production
          example: My Production
      required:
        - _id
        - name
    FolderDto:
      allOf:
        - $ref: '#/components/schemas/ItemDto'
        - type: object
          properties:
            breadcrumb:
              type: array
              items:
                $ref: '#/components/schemas/ItemDto'
            children:
              type: array
              items:
                $ref: '#/components/schemas/ItemDto'
      example:
        _id: fa7f41b9-7915-4a9c-bd6f-67ddfb03f73a
        name: my-name
        type: FOLDER
        children: []
    FolderCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Folder name
          example: my folder
        parentId:
          type: string
          format: uuid
          description: Parent ID. If omitted, the asset will be placed at the root level.
          example: 4bd96ba6-2be3-4cd4-91a3-8af692cf7f84
      required:
        - name
    FolderRenameDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Folder name
          example: my folder
      required:
        - name
    FolderMoveDto:
      type: object
      properties:
        parentId:
          type: string
          format: uuid
          description: Parent ID. If omitted, the asset will be placed at the root level.
          example: 4bd96ba6-2be3-4cd4-91a3-8af692cf7f84
    NamespaceDto:
      type: object
      properties:
        _id:
          type: string
          format: uuid
          description: Namespace ID
          example: 254b0fb5-7567-47a8-b655-d09a40c91b2f
        name:
          type: string
