openapi: 3.0.0
info:
  title: hcloud - Cosmo
  description: Cosmo is a Media Asset Management platform.
  version: 1.0.0
  contact:
    name: MoovIT Software Products GmbH
    url: https://www.moovit-sp.com
    email: info@moovit-sp.com
servers:
  - url: https://eu-central-1.helmut.cloud/api/cosmo
    description: EU-Central production server
  - url: https://na-west-1.helmut.cloud/api/cosmo
    description: NA-West production server
  - url: https://eu-dev-1.app.helmut.cloud/api/cosmo
    description: EU development server
  - url: http://localhost/api/cosmo
    description: Localhost
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    patAuth:
      type: http
      scheme: bearer
      bearerFormat: PAT
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CustomError:
      type: object
      properties:
        error:
          type: string
          description: Error name
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
      required:
        - error
        - code
        - message
      description: API errors obey this shape
    sharePassword:
      type: string
      description: Share password
      example: super-safe
    ShareCreateDto:
      type: object
      properties:
        name:
          type: string
          description: Share name
        password:
          type: string
          description: Share password
          example: super-safe
        expires:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: UTC timestamp in milliseconds marking when the share should expire
          example: 1752057295637
        items:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: List of asset IDs that the share members will have access to.
          example:
            - ae13321a-522d-48da-9733-27c97bcab124
        permissions:
          type: array
          items:
            type: string
            enum:
              - VIEW_ASSETS
              - VIEW_ASSET_DETAILS
              - VIEW_ASSET_ACTIVITY
              - DOWNLOAD_ASSETS
              - CREATE_ASSETS
              - UPDATE_ASSETS
              - DELETE_ASSETS
              - COPY_ASSETS
              - MOVE_ASSETS
              - RENAME_ASSETS
              - SHARE_ASSETS
          minItems: 1
          description: List of the permissions to apply.
          example:
            - VIEW_ASSETS
        namespaces:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum:
                - VIEW_NAMESPACES
                - EDIT_NAMESPACES
                - CREATE_NAMESPACES
                - DELETE_NAMESPACES
                - VIEW_ASSET_TAGS
                - WRITE_ASSET_TAGS
                - VIEW_ASSET_STATUS
                - WRITE_ASSET_STATUS
                - VIEW_ASSET_COMMENTS
                - CREATE_ASSET_COMMENTS
                - EDIT_ASSET_COMMENTS
                - DELETE_ASSET_COMMENTS
            minItems: 1
          description: >-
            Namespaces to include in the share. Share consumers will only able
            to read/write asset comments and statuses according to the
            permissions set in this map.
          example:
            rush:
              - VIEW_ASSET_STATUS
        users:
          type: array
          items:
            type: string
            format: email
          description: List of user to automatically add and notify of the share
      required:
        - name
        - items
        - permissions
    ShareLinkDto:
      type: object
      properties:
        password:
          type: string
          description: Share password
          example: super-safe
        shareIdHMAC:
          type: string
          description: HMAC of the shareId. Required if password is not present
    ShareAddUsersDto:
      type: object
      properties:
        password:
          type: string
          description: Share password
          example: super-safe
        users:
          type: array
          items:
            type: string
            format: email
          description: List of user to automatically add and notify of the share
      required:
        - users
    SharePatchDto:
      type: object
      properties:
        name:
          type: string
          description: Share name
        password:
          type: string
          description: Share password
          example: super-safe
        expires:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: UTC timestamp in milliseconds marking when the share should expire
          example: 1752057295637
        items:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: List of asset IDs that the share members will have access to.
          example:
            - ae13321a-522d-48da-9733-27c97bcab124
        permissions:
          type: array
          items:
            type: string
            enum:
              - VIEW_ASSETS
              - VIEW_ASSET_DETAILS
              - VIEW_ASSET_ACTIVITY
              - DOWNLOAD_ASSETS
              - CREATE_ASSETS
              - UPDATE_ASSETS
              - DELETE_ASSETS
              - COPY_ASSETS
              - MOVE_ASSETS
              - RENAME_ASSETS
              - SHARE_ASSETS
          minItems: 1
          description: List of the permissions to apply.
          example:
            - VIEW_ASSETS
        namespaces:
          type: object
          additionalProperties:
            anyOf:
              - type: array
                items:
                  type: string
                  enum:
                    - VIEW_NAMESPACES
                    - EDIT_NAMESPACES
                    - CREATE_NAMESPACES
                    - DELETE_NAMESPACES
                    - VIEW_ASSET_TAGS
                    - WRITE_ASSET_TAGS
                    - VIEW_ASSET_STATUS
                    - WRITE_ASSET_STATUS
                    - VIEW_ASSET_COMMENTS
                    - CREATE_ASSET_COMMENTS
                    - EDIT_ASSET_COMMENTS
                    - DELETE_ASSET_COMMENTS
                minItems: 1
              - nullable: true
              - nullable: true
          description: >-
            Namespaces to include in the share. Share consumers will only able
            to read/write asset comments and statuses according to the
            permissions set in this map. To remove permissions for a certain
            namespace, use the null value.
          example:
            rush:
              - VIEW_ASSET_STATUS
      description: Object used to patch shares
    DeleteSharesDto:
      type: object
      properties:
        shareIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: List of share IDs to delete
          example:
            - uuid-1
            - uuid-2
      required:
        - shareIds
    SpaceCreateDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[\w-.]{1,32}$
          description: Name for the space
          example: my_space
      required:
        - name
    SpaceRenameDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[\w-.]{1,32}$
          description: Name for the space
          example: my_space
      required:
        - name
    High5SpaceInfoDto:
      type: object
      properties:
        high5_spaceName:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[\w-.]{1,32}$
          description: Name for the space
          example: my_space
        executionTarget:
          type: string
          description: Email address or pool name for the execution target
          example: hmc@helmut.cloud or Pool-Party
      required:
        - high5_spaceName
        - executionTarget
    AssetPatchLocationDto:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
          description: Location ID
      required:
        - locationId
    MoveAssetDto:
      type: object
      properties:
        parentId:
          type: string
          format: uuid
          description: Parent ID. If omitted, the asset will be placed at the root level.
          example: 24b9fe00-8cc2-4f15-bde7-72a8b2e3c7ef
    BulkMoveCopyAssetsDto:
      type: object
      properties:
        assetIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: List of asset/folder IDs to move
          example:
            - uuid-1
            - uuid-2
        parentId:
          type: string
          format: uuid
          description: >-
            ID of the target parent. If omitted, the assets will be placed at
            the root level.
          example: 24b9fe00-8cc2-4f15-bde7-72a8b2e3c7ef
        copy:
          type: boolean
          default: false
          description: Whether to copy the assets instead of moving them
          example: false
      required:
        - assetIds
    sorting:
      type: object
      properties:
        fields:
          type: array
          items:
            type: string
          description: Fields to sort by
          example:
            - name
        direction:
          type: string
          enum:
            - ASC
            - DESC
          description: Sort order
          example: ASC
      required:
        - fields
        - direction
