      properties:
        name:
          type: string
          description: Media_Asset name
          example: my-asset
        parentId:
          type: string
          format: uuid
          description: Parent ID. If omitted, the asset will be placed at the root level.
          example: 4bd96ba6-2be3-4cd4-91a3-8af692cf7f84
      required:
        - name
      example:
        name: my-asset
        parentId: 4bd96ba6-2be3-4cd4-91a3-8af692cf7f84
