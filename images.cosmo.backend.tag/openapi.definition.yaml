    AssetRenameDto:
      type: object
      properties:
        name:
          type: string
          description: Media_Asset name
          example: my-asset
      required:
        - name
      example:
        name: my-asset
    BulkDownloadUrlsDto:
      type: object
      properties:
        assetIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: List of asset IDs to get download Urls from
          example:
            - uuid-1
            - uuid-2
        resolution:
          type: string
          enum:
            - original
            - '1080'
            - '720'
            - '480'
            - '360'
            - '240'
          description: Resolution for the download URLs
          example: original
      required:
        - assetIds
        - resolution
    AssetIdsDto:
