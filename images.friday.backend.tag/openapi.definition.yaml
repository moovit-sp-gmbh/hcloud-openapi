components:
  securitySchemes:
    BearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    CustomError:
      properties:
        code:
          type: string
          description: >-
            "A helmut cloud custom error code following this schema: [Custom
            Error
            Codes](https://development-guideline.pages.moovit-sp.com/en/hcloud/customErrorCodes.html)"
        error:
          type: string
          description: 'Name of the error in the following format: name.of.error'
        message:
          type: string
          description: Error description
      required:
        - code
        - error
        - message
      example: null
    DatabaseCreateDto:
      properties:
        name:
          type: string
          description: >-
            Name of the database (only alphanumeric characters, hyphens,
            underscores and dots are allowed, it should contain between 1 and
            128 symbols)
      required:
        - name
      example:
        name: Helmut4-Data-Storage
    DatabaseDto:
      properties:
        _id:
          type: string
          description: Object ID of the database
        name:
          type: string
          description: Name of the database
        space:
          $ref: '#/components/schemas/ReducedSpace'
          description: Space the database belongs to
        organization:
          $ref: '#/components/schemas/ReducedOrganization'
          description: Organization the database belongs to
        creator:
          $ref: '#/components/schemas/ReducedUser'
          description: Creator of the database
        createDate:
          type: number
          description: Date of creation as unix timestamp
      required:
        - _id
        - name
        - space
        - organization
        - createDate
      example:
        _id: 63c7e6e4eae82d8001b65305
        name: Helmut4-Data-Storage
        space:
          _id: 63ecb429ee5ede1101f25d33
          name: Helmut4
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        organization:
          _id: 6436bb9988821e8f6400c2f8
          name: DEV-software
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        creator:
          _id: 64180bfafe4fbcd791493ef4
          name: Account MSP
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        createDate: 1674045156
    DatabasePatchDto:
      properties:
        name:
          type: string
          description: >-
            The new name of the database (only alphanumeric characters, hyphens,
            underscores and dots are allowed, it should contain between 1 and
            128 symbols)
      required:
        - name
      example:
        name: Helmut4-Data-Storage
    DocumentCreateDto:
      properties:
        key:
          type: string
          description: Key of the document
        type:
          $ref: '#/components/schemas/DocumentType'
          description: Type of the document value
        value:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
          description: >-
            Document value (data type must match the type specified in the type
            field)
      required:
        - key
        - type
        - value
      example:
        key: Helmut4-stream-executions-counter
        type: NUMBER
        value: 647931
    DocumentDto:
      properties:
        _id:
          type: string
          description: Database ID of the document
        key:
          type: string
          description: Key of the document
        database:
          type: string
          description: Database name the document belongs to
        space:
          $ref: '#/components/schemas/ReducedSpace'
          description: Space the document belongs to
        organization:
          $ref: '#/components/schemas/ReducedOrganization'
          description: Organization the document belongs to
        creator:
          $ref: '#/components/schemas/ReducedUser'
          description: Creator of the document
        type:
          $ref: '#/components/schemas/DocumentType'
          description: Type of data stored in the document
        value:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
          description: Data stored in the document
        createDate:
          type: number
          description: Date of creation as unix timestamp
        modifyDate:
          type: number
          description: Date of last modification as unix timestamp
      required:
        - _id
        - key
        - space
        - organization
        - type
        - value
        - createDate
        - modifyDate
      example:
        _id: 71c7e6e4eae82d8001b65303
        key: Helmut4-stream-executions-counter
        database: Helmut4-Data-Storage
        space:
          _id: 63ecb429ee5ede1101f25d33
          name: Helmut4
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        organization:
          _id: 6436bb9988821e8f6400c2f8
          name: DEV-software
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        creator:
          _id: 64180bfafe4fbcd791493ef4
          name: Account MSP
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        type: NUMBER
        value: 647931
        createDate: 1774045156
        modifyDate: 1774047958
    DocumentPatchDto:
      properties:
        value:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
          description: >-
            Document value (data type must match the type specified in the type
            field of the existing document)
      required:
        - value
      example:
        value: 647931
    DocumentType:
      enum:
        - STRING
        - NUMBER
        - BOOLEAN
        - STRING_LIST
        - NUMBER_LIST
        - BOOLEAN_LIST
        - OBJECT
        - ARRAY
      type: string
      description: |
        * STRING - String data type.
        * NUMBER - Number data type.
        * BOOLEAN - Boolean data type.
        * STRING_LIST - Array of strings.
        * NUMBER_LIST - Array of numbers.
        * BOOLEAN_LIST - Array of boolean values.
        * OBJECT - Json object.
        * ARRAY - Array with values of any type.
    Search:
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/SearchFilter'
          description: A list of filters
        sorting:
          $ref: '#/components/schemas/Sorting'
          description: The sorting definition
      example:
        filters:
          - type: DATE
            key: modifyDate
            comparator: less than
            value: 1681912446650
        sorting:
          direction: DESC
          fields:
            - name
            - name
    SearchFilterComparatorBoolean:
      enum:
        - is
        - is not
      type: string
      description: |
        * is - Boolean equals the specified boolean value
        * is not - Boolean does not equal the specified boolean value
    SearchFilterComparatorDate:
      enum:
        - is
        - is not
        - greater than
        - less than
        - greater than or equal
        - less than or equal
      type: string
      description: >
        * is - Date equals the specified date value

        * is not - Date does not equal the specified date value

        * greater than - Date is more recent than the specified date value

        * less than - Date is older than the specified date value

        * greater than or equal - Date is more recent or equal to the specified
        date value

        * less than or equal - Date is older than or equal to the specified date
        value
    SearchFilterComparatorNumber:
      enum:
        - is
        - is not
        - greater than
        - less than
        - greater than or equal
        - less than or equal
      type: string
      description: >
        * is - Number equals the specified numeric value

        * is not - Number does not equal the specified numeric value

        * greater than - Number is greater than the specified numeric value

        * less than - Number is less than the specified numeric value

        * greater than or equal - Number is greater than or equal to the
        specified numeric value

        * less than or equal - Number is less than or equal to the specified
        numeric value
    SearchFilterComparatorString:
      enum:
        - is
        - is not
        - starts with
        - ends with
        - contains
      type: string
      description: |
        * is - String equals the specified string value
        * is not - String does not equal the specified string value
        * starts with - String starts with the specified string value
        * ends with - String ends with the specified string value
        * contains - String contains the specified string value
    SearchFilterType:
      enum:
        - STRING
        - SELECT
        - MULTISELECT
        - TYPEAHEAD
        - NUMBER
        - DATE
        - BOOLEAN
      type: string
      description: |
        * STRING - Filter by a string value
        * SELECT - Filter by a value from a set of possible choices
        * MULTISELECT - Filter by multiple values from a set of possible choices
        * TYPEAHEAD - Filter by ???
        * NUMBER - Filter by a numeric value
        * DATE - Filter by a Date value
        * BOOLEAN - Filter by a boolean flag
    SortDirection:
      enum:
        - ASC
        - DESC
      type: string
      description: |
        * ASC - Ascending order
        * DESC - Descending order
    Sorting:
      properties:
        direction:
          $ref: '#/components/schemas/SortDirection'
        fields:
          type: array
          items:
            type: string
          description: The fields to consider when performing the sorting of the result.
      example:
        direction: DESC
        fields:
          - name
          - name
    SpaceCreateDto:
      properties:
        name:
          type: string
          description: Name of the space
      required:
        - name
      example:
        name: Helmut4
    SpaceDto:
      properties:
        _id:
          type: string
          description: ID of the space
        name:
          type: string
          description: Name of the space
        organization:
          $ref: '#/components/schemas/ReducedOrganization'
          description: Organization the space belongs to
        avatarUrl:
          type: string
          description: URL of the avatar
        creator:
          $ref: '#/components/schemas/ReducedUser'
          description: Creator of the space
        highestPermissionOfUser:
          $ref: '#/components/schemas/SpacePermission'
          description: >-
            Highest permission the requesting user has in this space, be it his
            own or the permission of a team he is part of
        createDate:
          type: number
          description: Create date of the space as unix timestamp
        modifyDate:
          type: number
          description: Date of the last modification of the space as unix timestamp
      required:
        - _id
        - name
        - organization
        - avatarUrl
        - createDate
        - modifyDate
      example:
        _id: 63ecb429ee5ede1101f25d33
        name: Helmut4
        organization:
          _id: 6436bb9988821e8f6400c2f8
          name: DEV-software
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        creator:
          _id: 64180bfafe4fbcd791493ef4
          name: Account MSP
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        highestPermissionOfUser: OWNER
        createDate: 1676457001
        modifyDate: 1676457001
    SpaceEntity:
      enum:
        - team
        - user
      type: string
      description: |
        * team - This space entity is a team
        * user - This space entity is a user
    SpaceEntityPermissionDto:
      properties:
        organization:
          $ref: '#/components/schemas/ReducedOrganization'
          description: The organization the space belongs to
        space:
          $ref: '#/components/schemas/ReducedSpace'
          description: Space the design belongs to
        entityId:
          type: string
          description: ID of the entity (user or team)
        entityName:
          type: string
          description: Name of the entity
        type:
          $ref: '#/components/schemas/SpaceEntity'
          description: Type of the entity
        permission:
          $ref: '#/components/schemas/SpacePermission'
          description: Permission the entity has within the space
      required:
        - organization
        - space
        - entityId
        - entityName
        - type
        - permission
      example:
        organization:
          _id: 6436bb9988821e8f6400c2f8
          name: DEV-software
          avatarUrl: https://app.helmut.cloud/asset/no_avatar.webp
        space:
          _id: 63ecb429ee5ede1101f25d33
