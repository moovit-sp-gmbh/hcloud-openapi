  /v1/org/{orgName}/spaces/{spaceName}/jobs/{cronjobId}/next:
    get:
      tags:
        - Cronjob
      summary: >-
        Retrieves the timestamps (in milliseconds, UTC+0) of the next n cronjob
        executions.
      description: |-

        Required organization role: MEMBER\
        Required space permission: READ\
        Required scopes: FUSE_SPACE_READ
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
        - $ref: '#/components/parameters/SpaceName'
        - $ref: '#/components/parameters/CronjobID'
        - name: amount
          in: query
          description: >-
            Amount of execution-timestamps that should be returned, min: 1, max:
            10, default: 3
          required: false
          schema:
            type: number
            default: 3
      responses:
        '200':
          description: >-
            Array holding the timestamps (in milliseconds, UTC+0) for the next n
            executions of the cronjob
          content:
            application/json:
              schema:
                type: array
                items:
                  type: number
        '400':
          description: Organization name is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Space name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Cronjob id is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
