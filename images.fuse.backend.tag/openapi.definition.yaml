          description: Permission the user shall have in the space
      required:
        - userId
        - permission
      example:
        userId: 63c7e64ff912d31ffa27a5b4
        permission: OWNER
    Header:
      properties:
        key:
          type: string
          description: The header's key
        value:
          type: string
          description: The header's value
      required:
        - key
        - value
      example:
        key: X-Custom-Header
        value: some-interesting-value
    ReducedCronjob:
      properties:
        _id:
          type: string
          description: ID of the cronjob
        name:
          type: string
          description: Name of the cronjob
      required:
        - _id
        - name
      example:
        _id: 63c7e64fc912d31ffa27a5b4
        name: Do something
    ReducedOrganization:
      properties:
        _id:
          type: string
          description: ID of the organization
        name:
          type: string
          description: Name of the organization
        avatarUrl:
          type: string
          description: URL of the avatar of the organization
      required:
        - _id
        - name
        - avatarUrl
      example:
        _id: 63c7e64ff912d31ffa27a5b4
        name: Moovit Software Products
        avatarUrl: https://example.com/asset/some_avatar.webp
    ReducedSpace:
      properties:
        _id:
          type: string
          description: ID of the space
        name:
          type: string
          description: Name of the space
        avatarUrl:
          type: string
          description: URL of the space avatar
      required:
        - _id
        - name
        - avatarUrl
      example:
        _id: 63c7e64ff912d31ffa27a5b4
        name: MySpace
        avatarUrl: https://example.com/asset/some_avatar.webp
    ReducedUser:
      properties:
        _id:
          type: string
          description: ID of the user
        name:
          type: string
          description: Name of the user
        avatarUrl:
          type: string
          description: URL of the avatar of the user
      required:
        - _id
        - name
        - avatarUrl
      example:
        _id: 63c7e64ff912d31ffa27a5b4
        name: Helmut Mc Cloud
        avatarUrl: https://example.com/asset/some_avatar.webp
    SearchFilter:
      properties:
        type:
          description: The type of the filter
          $ref: '#/components/schemas/SearchFilterType'
        key:
          type: string
          description: The search key
        comparator:
          description: The search comparator
          oneOf:
            - $ref: '#/components/schemas/SearchFilterComparatorString'
            - $ref: '#/components/schemas/SearchFilterComparatorNumber'
            - $ref: '#/components/schemas/SearchFilterComparatorDate'
            - $ref: '#/components/schemas/SearchFilterComparatorBoolean'
        value:
          description: The value searching for
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: boolean
            - type: number
      required:
        - type
        - key
        - comparator
        - value
      example:
        type: STRING
        key: name
        comparator: starts with
        value: Editor-
  parameters:
    CronjobID:
      in: path
      name: cronjobId
      schema:
        type: string
        minLength: 24
        maxLength: 24
        example: 70d5ec35c2fa070014ab8c3b
      required: true
      description: >-
        ID of the Cronjob (ObjectId identifier, consists of 24 hexadecimal
        digits)
    CronjobLogID:
      in: path
      name: cronjobLogId
      schema:
        type: string
        minLength: 24
        maxLength: 24
        example: 31d5ec35c2fa070014ab8c7b
      required: true
      description: >-
        ID of the Cronjob log (ObjectId identifier, consists of 24 hexadecimal
        digits)
    OrgName:
      in: path
      name: orgName
      schema:
        type: string
        minLength: 3
        maxLength: 64
        example: MoovIT-Software-Products-GmbH
      required: true
      description: >-
        Name of the organization (only alphanumeric characters, hyphens and dots
        are allowed; it should contain between 3 and 64 characters)
    SpaceName:
      in: path
      name: spaceName
      schema:
        type: string
        minLength: 1
        maxLength: 32
        example: Helmut4
      required: true
      description: >-
        Name of the space (only alphanumeric characters, hyphens and dots are
        allowed; it should contain between 1 and 32 characters)
    LimitParameter:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      required: false
      description: Max number of items to return. Integer between 1 and 100.
    PageParameter:
      in: query
      name: page
      schema:
        type: integer
        minimum: 0
        default: 0
      required: false
      description: Designates the current page, when using a limit. Minimum value is 0.
    NextExecution:
      in: query
      name: nextExecution
      schema:
        type: boolean
        default: false
      required: false
      description: >-
        Alongside the cronjob also retrieve the timestamps for three next
        executions (for the specified timezone, in milliseconds).
  examples:
    NotAuthorizedException:
      value:
        code: 003.001.0001
        error: unauthorized
        message: You're not authorized
    InsufficientAccessRightException:
      value:
        code: 003.001.0004
        error: insufficient.rights
        message: You have not enough rights to access/manipulate this resource
    SpaceNotFoundException:
      value:
        code: 003.010.0001
        error: space.not.found
        message: Given space not found
    SpaceNameInUseException:
      value:
        code: 003.010.0002
        error: space.name.in.use
        message: Given space name is already in use
    SpaceInsufficientPermissionException:
      value:
        code: 003.010.0003
        error: space.insufficient.permission
        message: You do not have the required permission
    CronjobNotFoundException:
      value:
        code: 003.020.0001
        error: cronjob.not.found
        message: Given cronjob not found
    CronjobInvalidExpressionException:
      value:
        code: 003.020.0003
        error: cronjob.invalid.expression
        message: >-
          Given cronjob expression is either not a valid quartz format, uses
          advanced expressions that are not supported or holds a value other
          than 0 for the 'seconds' field (seconds are currently not allowed)
    CronjobLogNotFoundException:
      value:
        code: 003.020.0004
        error: cronjob.log.not.found
        message: Given cronjob log not found
    SpaceRequiresOwnerException:
      value:
        code: 003.010.0006
        error: space.requires.owner
        message: >-
          A space must have at least one owner. Removing or changing the
          role/permissions of the last owner is not possible.
    TeamNotFoundException:
      value:
        code: 003.008.0001
        error: team.not.found
        message: Team does not exist
    OrganizationMemberNotFoundException:
      value:
        code: 003.002.0001
        error: organization.member.not.found
        message: User is not member of the organization
    InvalidFilterException:
      value:
        code: 003.023.0001
        error: search.invalid.filter
        message: The value of the filter property '<field name>' is invalid
    InvalidBodyException:
      value:
        code: 003.000.0004
        error: invalid.body
        message: <detailed message about what failed validation>
    InvalidParameterException:
      value:
        code: 003.000.0003
        error: invalid.parameter
        message: >-
          Failed to validate '<path | query>' parameter '<parameter name>' -
          <cause of validation failure>
    AuthenticationTokenMissingException:
      value:
        code: 003.001.0002
        error: missing.auth.token
        message: Expected an authentication token that has not been provided
    WrongAuthenticationTokenException:
      value:
        code: 003.001.0003
        error: wrong.auth.token
        message: Your authentication token is invalid
    LicenseQuotaExceededException:
      value:
        code: 003.032.0001
        error: license.quota.exceeded
        message: You have exceeded the assigned quota for this action.
    OrganizationNotFoundException:
      value:
        code: 003.007.0001
        error: organization.not.found
        message: Organization not found
    SpaceInvalidOwnerException:
      value:
        code: 003.010.0004
        error: space.invalid.owner
        message: A team cannot be the owner of a space
