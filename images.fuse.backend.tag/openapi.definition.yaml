  /v1/org/{orgName}/spaces/{spaceName}/jobs/{cronjobId}/next:
    get:
      tags:
        - Cronjob
      summary: >-
        Retrieves the timestamps (in milliseconds, UTC+0) of the next n cronjob
        executions.
      description: |-

        Required organization role: MEMBER\
        Required space permission: READ\
        Required scopes: FUSE_SPACE_READ
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the Organization
          required: true
          schema:
            type: string
        - name: spaceName
          in: path
          description: Name of the Space
          required: true
          schema:
            type: string
        - name: cronjobId
          in: path
          description: ID of the Cronjob
          required: true
          schema:
            type: string
        - name: amount
          in: query
          description: >-
            Amount of execution-timestamps that should be returned, min: 1, max:
            10, default: 3
          required: false
          schema:
            type: number
            default: 3
      responses:
        '200':
          description: >-
            Array holding the timestamps (in milliseconds, UTC+0) for the next n
            executions of the cronjob
          content:
            application/json:
              schema:
                type: array
                items:
                  type: number
        '401':
          description: Not Authorized exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InsufficientAccessRightException:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                SpaceInsufficientPermissionException:
                  $ref: '#/components/examples/SpaceInsufficientPermissionException'
        '404':
          description: Not Found exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                CronjobNotFoundException:
                  $ref: '#/components/examples/CronjobNotFoundException'
        default:
          description: Unexpected error
  /v1/cron/resolve:
    post:
      tags:
        - Cronjob
      summary: >-
        Resolve a Quartz cron expression along with a timezone to get the next
        execution(s)
      security:
        - BearerAuth: []
        - BasicAuth: []
      requestBody:
        content:
          .application/json:
            schema:
              $ref: '#/components/schemas/CronPatternDto'
        required: true
      responses:
        '200':
          description: >-
            Array holding the timestamps (in milliseconds, in UTC) for the next
            amount executions for given Quartz expression
          content:
            application/json:
              schema:
                type: array
                items:
                  type: number
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                CronjobInvalidExpressionException:
                  $ref: '#/components/examples/CronjobInvalidExpressionException'
