    HmacHashingAlgo:
      enum:
        - SHA-1
        - SHA-256
      type: string
      description: |
        * SHA-1 - SHA1 hashing algorithm
        * SHA-256 - SHA256 hashing algorithm
    HmacSettingsDto:
      properties:
        headerName:
          type: string
          description: Name of the header containing the HMAC
        algorithm:
          $ref: '#/components/schemas/HmacHashingAlgo'
          description: Hashing algorithm used in the HMAC
        secret:
          type: string
          description: Base64 encoded secret used in the HMAC
      required:
        - headerName
        - algorithm
        - secret
      example:
        headerName: X-HMAC-hcloud
        algorithm: SHA-256
        secret: CiXbc2Vao5Bova7onoOpBeyVopvwcsunsfor+HzSSLs=
    HmacSettingsIncomingDto:
      properties:
        headerName:
          type: string
          description: Name of the header used in the request sent out by the cronjob
        secret:
          type: string
          description: Base64 encoded secret used in the HMAC
        algorithm:
          $ref: '#/components/schemas/HmacHashingAlgo'
          description: Hashing algorithm used in the HMAC
      required:
        - headerName
        - algorithm
      example:
        headerName: X-HMAC-hcloud
        algorithm: SHA-256
    HttpMethodEnum:
      enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      type: string
      description: ''
    Search:
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/SearchFilter'
          description: A list of filters
        sorting:
          $ref: '#/components/schemas/Sorting'
          description: The sorting definition
      example:
        filters:
          - type: DATE
            key: modifyDate
            comparator: less than
            value: 1681912446650
        sorting:
          direction: DESC
          fields:
            - name
            - company
    SearchFilterComparatorBoolean:
      enum:
        - is
        - is not
      type: string
      description: |
        * is - Boolean equals the specified boolean value
        * is not - Boolean does not equal the specified boolean value
    SearchFilterComparatorDate:
      enum:
        - is
        - is not
        - greater than
        - less than
        - greater than or equal
        - less than or equal
      type: string
      description: >
        * is - Date equals the specified date value

        * is not - Date does not equal the specified date value

        * greater than - Date is more recent than the specified date value

        * less than - Date is older than the specified date value

        * greater than or equal - Date is more recent or equal to the specified
        date value

        * less than or equal - Date is older than or equal to the specified date
        value
    SearchFilterComparatorNumber:
      enum:
        - is
        - is not
        - greater than
        - less than
        - greater than or equal
        - less than or equal
      type: string
      description: >
        * is - Number equals the specified numeric value

        * is not - Number does not equal the specified numeric value

        * greater than - Number is greater than the specified numeric value

        * less than - Number is less than the specified numeric value

        * greater than or equal - Number is greater than or equal to the
        specified numeric value

        * less than or equal - Number is less than or equal to the specified
        numeric value
    SearchFilterComparatorString:
      enum:
        - is
        - is not
        - starts with
        - ends with
        - contains
      type: string
      description: |
        * is - String equals the specified string value
        * is not - String does not equal the specified string value
        * starts with - String starts with the specified string value
        * ends with - String ends with the specified string value
        * contains - String contains the specified string value
    SearchFilterType:
      enum:
        - STRING
        - SELECT
        - MULTISELECT
        - TYPEAHEAD
        - NUMBER
        - DATE
        - BOOLEAN
      type: string
      description: |
        * STRING - Filter by a string value
        * SELECT - Filter by a value from a set of possible choices
        * MULTISELECT - Filter by multiple values from a set of possible choices
        * TYPEAHEAD - Filter by ???
        * NUMBER - Filter by a numeric value
        * DATE - Filter by a Date value
        * BOOLEAN - Filter by a boolean flag
    SortDirection:
      enum:
        - ASC
        - DESC
      type: string
      description: |
        * ASC - Ascending order
        * DESC - Descending order
    Sorting:
      properties:
        direction:
          $ref: '#/components/schemas/SortDirection'
        fields:
          type: array
          items:
            type: string
          description: The fields to consider when performing the sorting of the result.
      example:
        direction: DESC
        fields:
          - name
          - company
    SpaceCreateDto:
      properties:
