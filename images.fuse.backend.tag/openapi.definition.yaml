openapi: 3.0.0
info:
  title: hcloud - Fuse
  version: 0.0.4-930
  contact:
    name: MoovIT Software Products GmbH
    url: https://www.moovit-sp.com
    email: info@moovit-sp.com
  description: Fuse handles everything around cronjobs.
servers:
  - url: https://eu-central-1.helmut.cloud/api/fuse
    description: EU-Central production server
  - url: https://na-west-1.helmut.cloud/api/fuse
    description: NA-West production server
  - url: https://eu-dev-1.app.helmut.cloud/api/fuse
    description: EU development server
  - url: http://localhost/api/fuse
    description: Localhost
paths:
  /v1/org/{orgName}/spaces/{spaceName}/jobs/{cronjobId}:
    get:
      tags:
        - Cronjob
      summary: Retrieve a cronjob by its ID
      description: |-

        Required organization role: MEMBER\
        Required space permission: READ\
        Required scopes: FUSE_SPACE_READ
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
        - $ref: '#/components/parameters/SpaceName'
        - $ref: '#/components/parameters/CronjobID'
        - $ref: '#/components/parameters/NextExecution'
      responses:
        '200':
          description: Cronjob object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronjobDto'
        '400':
          description: Organization name is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Space name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Cronjob id is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Missing required scope for operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                User is not member of organization or role is insufficient:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Space permission is insufficient. Must be at least READ:
                  $ref: '#/components/examples/SpaceInsufficientPermissionException'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
                Space not found:
                  $ref: '#/components/examples/SpaceNotFoundException'
                Cronjob not found:
                  $ref: '#/components/examples/CronjobNotFoundException'
        default:
          description: Unexpected error
    put:
      tags:
        - Cronjob
      summary: Updates a cronjob
      description: |-

        Required organization role: MEMBER\
        Required space permission: WRITE\
        Required scopes: FUSE_SPACE_WRITE
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
        - $ref: '#/components/parameters/SpaceName'
        - $ref: '#/components/parameters/CronjobID'
        - $ref: '#/components/parameters/NextExecution'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CronjobCreateDto'
      responses:
        '200':
          description: Updated cronjob object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronjobDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                CronjobInvalidExpressionException:
                  $ref: '#/components/examples/CronjobInvalidExpressionException'
                Organization name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Space name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Cronjob id is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Missing required scope for operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                User is not member of organization or role is insufficient:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Space permission is insufficient. Must be at least WRITE:
                  $ref: '#/components/examples/SpaceInsufficientPermissionException'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
                Space not found:
                  $ref: '#/components/examples/SpaceNotFoundException'
                Cronjob not found:
                  $ref: '#/components/examples/CronjobNotFoundException'
        default:
          description: Unexpected error
    delete:
      tags:
        - Cronjob
      summary: Deletes a cronjob
      description: |-

        Required organization role: MEMBER\
        Required space permission: WRITE\
        Required scopes: FUSE_SPACE_DELETE
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
        - $ref: '#/components/parameters/SpaceName'
        - $ref: '#/components/parameters/CronjobID'
      responses:
        '204':
          description: No content
        '400':
          description: Organization name is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Space name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Cronjob id is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
                  $ref: '#/components/examples/WrongAuthenticationTokenException'
                  summary: The JWT payload has an invalid format
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
                  summary: The credentials were incorrect
                AuthenticationTokenMissingException:
                  $ref: '#/components/examples/AuthenticationTokenMissingException'
                  summary: The Authorization header is empty
        '403':
          description: Missing required scope for operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Missing required scope for operation:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                User is not member of organization or role is insufficient:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                Space permission is insufficient. Must be at least WRITE:
                  $ref: '#/components/examples/SpaceInsufficientPermissionException'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization not found:
                  $ref: '#/components/examples/OrganizationNotFoundException'
                Space not found:
                  $ref: '#/components/examples/SpaceNotFoundException'
                Cronjob not found:
                  $ref: '#/components/examples/CronjobNotFoundException'
        default:
          description: Unexpected error
  /v1/org/{orgName}/spaces/{spaceName}/jobs/search:
    post:
      tags:
        - Cronjob
      summary: >-
        Retrieves all cronjobs that match the provided search filter. Will
        return all cronjobs of the specified space if no search filter is
        provided.
      description: |-

        Required organization role: MEMBER\
        Required space permission: READ\
        Required scopes: FUSE_SPACE_READ
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgName'
        - $ref: '#/components/parameters/SpaceName'
        - $ref: '#/components/parameters/LimitParameter'
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/NextExecution'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Search'
      responses:
        '200':
          description: List of filtered Cronjobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpaceDto'
        '400':
          description: Organization name is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                Organization name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Space name is invalid:
                  $ref: '#/components/examples/InvalidParameterException'
                Invalid body:
                  $ref: '#/components/examples/InvalidBodyException'
                  summary: Invalid body
                Invalid filter:
                  $ref: '#/components/examples/InvalidFilterException'
                  summary: Invalid search filter
                Invalid pagination parameters (limit/page):
                  $ref: '#/components/examples/InvalidParameterException'
                  summary: Invalid limit or page
        '401':
          description: There was an error while evaluating the user's credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                WrongAuthenticationTokenException:
