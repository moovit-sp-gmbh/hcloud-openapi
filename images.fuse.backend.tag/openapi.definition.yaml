components:
  securitySchemes:
    BearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    AvatarDto:
      properties:
        url:
          type: string
          description: URL to the avatar
      required:
        - url
      example:
        url: https://pub-1e0d69034e2942f79ef26dae05343340.r2.dev/image.webp
    CronPatternDto:
      properties:
        expression:
          type: string
          description: Quartz cron expression
        timezone:
          type: string
          description: Timezone of the Quartz expression in IANA format, e.g. Europe/Berlin
        amount:
          type: number
          description: Amount of returned execution-dates
      required:
        - expression
        - timezone
        - amount
      example:
        expression: 0 0 12 ? JUL,AUG 2 2024
        timezone: Europe/London
        amount: 5
    CronjobCreateDto:
      properties:
        name:
          type: string
          description: Name for the cronjob
        expression:
          type: string
          description: Quartz cron expression
        targetUrl:
          type: string
          description: Target URL. The Cronjob will execute HTTP calls to this URL
        httpMethod:
          $ref: '#/components/schemas/HttpMethodEnum'
          description: HTTP method, e.g. GET, POST, PUT, DELETE
        acceptInvalidSSL:
          type: boolean
        timezone:
          type: string
          description: Timezone of the Quartz expression in IANA format, e.g. Europe/Berlin
        description:
          type: string
          description: Description of the cronjob
        headers:
          type: array
          items:
            $ref: '#/components/schemas/Header'
          description: Headers for the HTTP request as key value pairs
        body:
          type: string
          description: Body for the HTTP request, limited to 1024kb
        enabled:
          type: boolean
