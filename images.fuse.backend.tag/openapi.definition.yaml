openapi: 3.0.0
info:
  title: hcloud - Fuse
  version: 0.0.4-714
  contact:
    name: MoovIT Software Products GmbH
    url: https://www.moovit-sp.com
    email: info@moovit-sp.com
  description: Fuse handles everything around cronjobs.
servers:
  - url: https://eu-central-1.helmut.cloud/api/fuse
    description: EU-Central production server
  - url: https://na-west-1.helmut.cloud/api/fuse
    description: NA-West production server
  - url: https://eu-dev-1.app.helmut.cloud/api/fuse
    description: EU development server
  - url: http://localhost/api/fuse
    description: Localhost
paths:
  /v1/org/{orgName}/spaces/{spaceName}/jobs/{cronjobId}:
    get:
      tags:
        - Cronjob
      summary: Retrieve a cronjob by its ID
      description: |-

        Required organization role: MEMBER\
        Required space permission: READ\
        Required scopes: FUSE_SPACE_READ
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the Organization the cronjob belongs to
          required: true
          schema:
            type: string
        - name: spaceName
          in: path
          description: Name of the Space the cronjob belongs to
          required: true
          schema:
            type: string
        - name: cronjobId
          in: path
          description: ID of the Cronjob
          required: true
          schema:
            type: string
        - name: nextExecution
          in: query
          description: >-
            Optional - Alongside the cronjob also retrieve the timestamps for
            three next executions (for the specified timezone, in milliseconds)
          required: false
          schema:
            type: boolean
            default: 'false'
      responses:
        '200':
          description: Cronjob object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronjobDto'
        '401':
          description: Not Authorized exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InsufficientAccessRightException:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                SpaceInsufficientPermissionException:
                  $ref: '#/components/examples/SpaceInsufficientPermissionException'
        '404':
          description: Not Found exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                CronjobNotFoundException:
                  $ref: '#/components/examples/CronjobNotFoundException'
        default:
          description: Unexpected error
    put:
      tags:
        - Cronjob
      summary: Updates a cronjob
      description: |-

        Required organization role: MEMBER\
        Required space permission: WRITE\
        Required scopes: FUSE_SPACE_WRITE
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the organization
          required: true
          schema:
            type: string
        - name: spaceName
          in: path
          description: Name of the space
          required: true
          schema:
            type: string
        - name: cronjobId
          in: path
          description: ID of the cronjob
          required: true
          schema:
            type: string
        - name: nextExecution
          in: query
          description: >-
            Optional - Alongside the cronjob also retrieve the timestamps for
            three next executions (for the specified timezone, in milliseconds)
          required: false
          schema:
            type: boolean
            default: 'false'
      requestBody:
        content:
          .application/json:
            schema:
              $ref: '#/components/schemas/CronjobCreateDto'
      responses:
        '200':
          description: Updated cronjob object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronjobDto'
        '400':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                CronjobInvalidExpressionException:
                  $ref: '#/components/examples/CronjobInvalidExpressionException'
                CronjobInvalidTimezoneException:
                  $ref: '#/components/examples/CronjobInvalidTimezoneException'
        '401':
          description: Not Authorized exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InsufficientAccessRightException:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                SpaceInsufficientPermissionException:
                  $ref: '#/components/examples/SpaceInsufficientPermissionException'
        '404':
          description: Not Found exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                CronjobNotFoundException:
                  $ref: '#/components/examples/CronjobNotFoundException'
        default:
          description: Unexpected error
    delete:
      tags:
        - Cronjob
      summary: Deletes a cronjob
      description: |-

        Required organization role: MEMBER\
        Required space permission: WRITE\
        Required scopes: FUSE_SPACE_DELETE
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the Organization
          required: true
          schema:
            type: string
        - name: spaceName
          in: path
          description: Name of the Space
          required: true
          schema:
            type: string
        - name: cronjobId
          in: path
          description: ID of the Cronjob
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '401':
          description: Not Authorized exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                NotAuthorizedException:
                  $ref: '#/components/examples/NotAuthorizedException'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                InsufficientAccessRightException:
                  $ref: '#/components/examples/InsufficientAccessRightException'
                SpaceInsufficientPermissionException:
                  $ref: '#/components/examples/SpaceInsufficientPermissionException'
        '404':
          description: Not Found exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
                CronjobNotFoundException:
                  $ref: '#/components/examples/CronjobNotFoundException'
        default:
          description: Unexpected error
  /v1/org/{orgName}/spaces/{spaceName}/jobs/search:
    post:
      tags:
        - Cronjob
      summary: >-
        Retrieves all cronjobs that match the provided search filter. Will
        return all cronjobs of the specified space if no search filter is
        provided.
      description: |-

        Required organization role: MEMBER\
        Required space permission: READ\
        Required scopes: FUSE_SPACE_READ
      security:
        - BearerAuth: []
        - BasicAuth: []
      parameters:
        - name: orgName
          in: path
          description: Name of the Organization
          required: true
          schema:
            type: string
        - name: spaceName
          in: path
          description: Name of the Space
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/LimitParameter'
        - $ref: '#/components/parameters/PageParameter'
        - name: nextExecution
          in: query
          description: >-
            Optional - Alongside the cronjob also retrieve the timestamps for
            three next executions (for the specified timezone, in milliseconds)
          required: false
          schema:
            type: boolean
            default: 'false'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Search'
      responses:
        '200':
          description: List of filtered Cronjobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpaceDto'
        '401':
          description: Not Authorized exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomError'
              examples:
